<template id="tpl-audit">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1" style="color: #181c32;">Audit Trail Logs</h3>
      <p class="text-muted small mb-0">Jejak rekaman aktivitas penting & log keamanan sistem (PRD Section 16 & 17).</p>
    </div>
    <button class="btn btn-sm btn-light border text-muted" onclick="AEF.loadAuditLogsTable()">
      <i class="bi bi-arrow-clockwise me-1 text-primary"></i> Refresh Logs
    </button>
  </div>

  <div class="aef-card">
    <div class="table-responsive">
      <table class="table table-aef align-middle mb-0">
        <thead>
          <tr>
            <th>Waktu</th>
            <th>Module</th>
            <th>Action / Status</th>
            <th>User ID</th>
            <th>Deskripsi</th>
            <th>Ref ID</th>
          </tr>
        </thead>
        <tbody id="audit-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light-subtle">
      <div class="text-muted small" id="audit-pagination-info">Memuat log...</div>
      <ul class="pagination pagination-sm mb-0" id="audit-pagination-controls"></ul>
    </div>
  </div>
</template>
