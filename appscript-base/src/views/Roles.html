<template id="tpl-roles">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1" style="color: #181c32;">Role Management</h3>
      <p class="text-muted small mb-0">Kelola daftar role dan deskripsi otorisasi sistem.</p>
    </div>
    <button class="btn btn-aef-primary" onclick="AEF.showModal('addRoleModal')">
      <i class="bi bi-shield-plus me-1"></i> Tambah Role
    </button>
  </div>

  <div class="aef-card">
    <div class="table-responsive">
      <table class="table table-aef align-middle mb-0">
        <thead>
          <tr>
            <th>Role Code</th>
            <th>Nama Role</th>
            <th>Deskripsi</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="roles-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light-subtle">
      <div class="text-muted small" id="roles-pagination-info">Memuat entri...</div>
      <ul class="pagination pagination-sm mb-0" id="roles-pagination-controls"></ul>
    </div>
  </div>
</template>
