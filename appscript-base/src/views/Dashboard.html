<template id="tpl-dashboard">
  <div class="row g-4 mb-4">
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="aef-card d-flex align-items-center justify-content-between">
        <div>
          <div class="text-muted small">Total Users</div>
          <div class="fs-3 fw-bold mt-1">2</div>
        </div>
        <div class="fs-1 text-indigo"><i class="bi bi-people"></i></div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="aef-card d-flex align-items-center justify-content-between">
        <div>
          <div class="text-muted small">Active Roles</div>
          <div class="fs-3 fw-bold mt-1">2</div>
        </div>
        <div class="fs-1 text-purple"><i class="bi bi-shield-check"></i></div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="aef-card d-flex align-items-center justify-content-between">
        <div>
          <div class="text-muted small">System Audit Logs</div>
          <div class="fs-3 fw-bold mt-1">14</div>
        </div>
        <div class="fs-1 text-success"><i class="bi bi-journal-text"></i></div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="aef-card d-flex align-items-center justify-content-between">
        <div>
          <div class="text-muted small">App Version</div>
          <div class="fs-3 fw-bold mt-1">1.0.0</div>
        </div>
        <div class="fs-1 text-info"><i class="bi bi-cpu"></i></div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <div class="aef-card">
        <h5 class="card-title mb-3"><i class="bi bi-graph-up me-2"></i>System Activity Trail</h5>
        <canvas id="aefActivityChart" height="120"></canvas>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="aef-card">
        <h5 class="card-title mb-3"><i class="bi bi-info-circle me-2"></i>Framework Info</h5>
        <ul class="list-group list-group-flush bg-transparent">
          <li class="list-group-item bg-transparent text-muted border-secondary d-flex justify-content-between">
            <span>Architecture</span> <strong class="text-white">5-Layered</strong>
          </li>
          <li class="list-group-item bg-transparent text-muted border-secondary d-flex justify-content-between">
            <span>Database</span> <strong class="text-white">Google Sheet</strong>
          </li>
          <li class="list-group-item bg-transparent text-muted border-secondary d-flex justify-content-between">
            <span>Auth Engine</span> <strong class="text-white">SHA-256 RBAC</strong>
          </li>
          <li class="list-group-item bg-transparent text-muted border-secondary d-flex justify-content-between">
            <span>Dynamic Menu</span> <strong class="text-white">Metadata Driven</strong>
          </li>
        </ul>
      </div>
    </div>
  </div>
</template>
