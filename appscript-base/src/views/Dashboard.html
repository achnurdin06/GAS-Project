<template id="tpl-dashboard">
  <div class="row g-4 mb-4">
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="aef-card d-flex align-items-center justify-content-between">
        <div>
          <div class="text-muted small fw-semibold">Total Users</div>
          <div class="fs-2 fw-bold mt-1" style="color: #181c32;">2</div>
        </div>
        <div class="rounded-3 p-3 bg-light-primary text-primary fs-2 d-flex align-items-center justify-content-center" style="width: 54px; height: 54px;">
          <i class="bi bi-people"></i>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="aef-card d-flex align-items-center justify-content-between">
        <div>
          <div class="text-muted small fw-semibold">Active Roles</div>
          <div class="fs-2 fw-bold mt-1" style="color: #181c32;">2</div>
        </div>
        <div class="rounded-3 p-3 bg-light-info text-info fs-2 d-flex align-items-center justify-content-center" style="width: 54px; height: 54px;">
          <i class="bi bi-shield-check"></i>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="aef-card d-flex align-items-center justify-content-between">
        <div>
          <div class="text-muted small fw-semibold">System Audit Logs</div>
          <div class="fs-2 fw-bold mt-1" style="color: #181c32;">14</div>
        </div>
        <div class="rounded-3 p-3 bg-light-success text-success fs-2 d-flex align-items-center justify-content-center" style="width: 54px; height: 54px;">
          <i class="bi bi-journal-text"></i>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="aef-card d-flex align-items-center justify-content-between">
        <div>
          <div class="text-muted small fw-semibold">App Version</div>
          <div class="fs-2 fw-bold mt-1" style="color: #181c32;">1.0.0</div>
        </div>
        <div class="rounded-3 p-3 bg-light-warning text-warning fs-2 d-flex align-items-center justify-content-center" style="width: 54px; height: 54px;">
          <i class="bi bi-cpu"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <div class="aef-card">
        <h5 class="card-title mb-3" style="color: #181c32;"><i class="bi bi-graph-up text-primary me-2"></i>System Activity Trail</h5>
        <canvas id="aefActivityChart" height="120"></canvas>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="aef-card">
        <h5 class="card-title mb-3" style="color: #181c32;"><i class="bi bi-info-circle text-primary me-2"></i>Framework Info</h5>
        <ul class="list-group list-group-flush bg-transparent">
          <li class="list-group-item bg-transparent text-muted border-light-subtle d-flex justify-content-between py-3">
            <span>Architecture</span> <strong style="color: #181c32;">5-Layered</strong>
          </li>
          <li class="list-group-item bg-transparent text-muted border-light-subtle d-flex justify-content-between py-3">
            <span>Database</span> <strong style="color: #181c32;">Google Sheet</strong>
          </li>
          <li class="list-group-item bg-transparent text-muted border-light-subtle d-flex justify-content-between py-3">
            <span>Auth Engine</span> <strong style="color: #181c32;">SHA-256 RBAC</strong>
          </li>
          <li class="list-group-item bg-transparent text-muted border-light-subtle d-flex justify-content-between py-3">
            <span>Dynamic Menu</span> <strong style="color: #181c32;">Metadata Driven</strong>
          </li>
        </ul>
      </div>
    </div>
  </div>
</template>
