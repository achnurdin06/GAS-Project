<template id="tpl-users">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1" style="color: #181c32;">User Management</h3>
      <p class="text-muted small mb-0">Kelola pengguna sistem dan pendelegasian role hak akses.</p>
    </div>
    <button class="btn btn-aef-primary" onclick="AEF.showModal('addUserModal')">
      <i class="bi bi-person-plus me-1"></i> Tambah User
    </button>
  </div>

  <div class="aef-card">
    <div class="table-responsive">
      <table class="table table-aef align-middle mb-0">
        <thead>
          <tr>
            <th>Nama Lengkap</th>
            <th>Email</th>
            <th>Role ID</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
          <!-- Dynamically populated via AEF.loadUsersTable() -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light-subtle">
      <div class="text-muted small" id="users-pagination-info">Memuat entri...</div>
      <ul class="pagination pagination-sm mb-0" id="users-pagination-controls"></ul>
    </div>
  </div>
</template>
