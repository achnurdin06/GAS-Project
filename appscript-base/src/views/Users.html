<template id="tpl-users">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1">User Management</h3>
      <p class="text-muted small mb-0">Kelola pengguna sistem dan pendelegasian role hak akses.</p>
    </div>
    <button class="btn btn-aef-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
      <i class="bi bi-person-plus me-1"></i> Tambah User
    </button>
  </div>

  <div class="aef-card">
    <div class="table-responsive">
      <table class="table table-aef align-middle mb-0">
        <thead>
          <tr>
            <th>Nama Lengkap</th>
            <th>Email</th>
            <th>Role ID</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
          <!-- Dynamically populated via AEF.loadUsersTable() -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add User Modal -->
  <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark border-secondary text-white">
        <div class="modal-header border-secondary">
          <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Tambah User Baru</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="form-add-user" onsubmit="event.preventDefault(); AEF.createUser();">
            <div class="mb-3">
              <label class="form-label text-muted small">Nama Lengkap</label>
              <input type="text" id="new-user-name" class="form-control bg-dark border-secondary text-white" placeholder="Contoh: Budi Santoso" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Email Address</label>
              <input type="email" id="new-user-email" class="form-control bg-dark border-secondary text-white" placeholder="user@aef.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Password</label>
              <input type="password" id="new-user-password" class="form-control bg-dark border-secondary text-white" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Role</label>
              <select id="new-user-role" class="form-select bg-dark border-secondary text-white">
                <option value="ROLE_USER">Standard User (ROLE_USER)</option>
                <option value="ROLE_ADMIN">System Administrator (ROLE_ADMIN)</option>
              </select>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="btn btn-aef-primary">Simpan User</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</template>
