<!-- Bootstrap 5 CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<!-- Google Fonts (Inter) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --aef-bg-primary: #0f172a;
    --aef-bg-card: #1e293b;
    --aef-text-main: #f8fafc;
    --aef-text-muted: #94a3b8;
    --aef-accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    --aef-sidebar-width: 260px;
    --aef-header-height: 64px;
    --aef-border-color: rgba(255, 255, 255, 0.08);
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--aef-bg-primary);
    color: var(--aef-text-main);
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  /* Glassmorphism Cards */
  .aef-card {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--aef-border-color);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  }

  /* Top Navigation Header */
  .aef-header {
    height: var(--aef-header-height);
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--aef-border-color);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1030;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
  }

  .aef-brand {
    font-weight: 700;
    font-size: 1.25rem;
    background: var(--aef-accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* Sidebar */
  .aef-sidebar {
    width: var(--aef-sidebar-width);
    position: fixed;
    top: var(--aef-header-height);
    bottom: 0;
    left: 0;
    background: rgba(15, 23, 42, 0.95);
    border-right: 1px solid var(--aef-border-color);
    padding: 1rem 0.75rem;
    z-index: 1020;
    overflow-y: auto;
    transition: transform 0.3s ease;
  }

  .aef-nav-link {
    color: var(--aef-text-muted);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s ease;
    margin-bottom: 0.25rem;
  }

  .aef-nav-link:hover, .aef-nav-link.active {
    color: #ffffff;
    background: rgba(99, 102, 241, 0.2);
    border-left: 3px solid #6366f1;
  }

  /* Main Wrapper */
  .aef-main-wrapper {
    margin-top: var(--aef-header-height);
    margin-left: var(--aef-sidebar-width);
    padding: 2rem;
    min-height: calc(100vh - var(--aef-header-height));
    transition: margin-left 0.3s ease;
  }

  /* Buttons */
  .btn-aef-primary {
    background: var(--aef-accent-gradient);
    border: none;
    color: #fff;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    transition: opacity 0.2s ease;
  }

  .btn-aef-primary:hover {
    opacity: 0.9;
    color: #fff;
  }

  /* Table styling */
  .table-aef {
    color: var(--aef-text-main);
    border-color: var(--aef-border-color);
  }

  .table-aef th {
    background: rgba(15, 23, 42, 0.6);
    color: var(--aef-text-muted);
    font-weight: 600;
    border-bottom: 1px solid var(--aef-border-color);
  }

  .table-aef td {
    border-bottom: 1px solid var(--aef-border-color);
    vertical-align: middle;
  }

  /* Hide elements */
  .d-none-important {
    display: none !important;
  }
</style>
