<!-- Bootstrap 5 CSS, Icons & JS Bundle -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
<!-- Google Fonts (Inter) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --metronic-bg: #f5f8fa;
    --metronic-card-bg: #ffffff;
    --metronic-text-heading: #181c32;
    --metronic-text-body: #3f4254;
    --metronic-text-muted: #a1a5b7;
    --metronic-border: #e4e6ef;
    --metronic-primary: #009ef7;
    --metronic-primary-hover: #0086d1;
    --metronic-primary-light: #f0f8ff;
    --metronic-sidebar-width: 265px;
    --metronic-header-height: 70px;
    --metronic-shadow: 0px 0px 20px 0px rgba(76, 87, 125, 0.03);
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--metronic-bg);
    color: var(--metronic-text-body);
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  /* Metronic Card System */
  .aef-card {
    background: var(--metronic-card-bg);
    border: 1px solid var(--metronic-border);
    border-radius: 0.75rem;
    padding: 1.75rem;
    box-shadow: var(--metronic-shadow);
    transition: all 0.2s ease-in-out;
  }

  /* Top Navigation Header */
  .aef-header {
    height: var(--metronic-header-height);
    background: #ffffff;
    border-bottom: 1px solid var(--metronic-border);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1030;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    box-shadow: 0px 10px 30px 0px rgba(82, 63, 105, 0.05);
  }

  .aef-brand {
    font-weight: 700;
    font-size: 1.35rem;
    color: var(--metronic-text-heading);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .aef-brand-icon {
    width: 38px;
    height: 38px;
    background: var(--metronic-primary-light);
    color: var(--metronic-primary);
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }

  /* Sidebar */
  .aef-sidebar {
    width: var(--metronic-sidebar-width);
    position: fixed;
    top: var(--metronic-header-height);
    bottom: 0;
    left: 0;
    background: #ffffff;
    border-right: 1px solid var(--metronic-border);
    padding: 1.5rem 1rem;
    z-index: 1020;
    overflow-y: auto;
  }

  .aef-nav-link {
    color: #5e6278;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.75rem 1rem;
    border-radius: 0.475rem;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
    transition: all 0.15s ease-in-out;
    margin-bottom: 0.35rem;
  }

  .aef-nav-link:hover {
    color: var(--metronic-primary);
    background: #f4f6f8;
  }

  .aef-nav-link.active {
    color: var(--metronic-primary);
    background: var(--metronic-primary-light);
    font-weight: 600;
  }

  .aef-nav-link.active i {
    color: var(--metronic-primary);
  }

  /* Main Wrapper */
  .aef-main-wrapper {
    margin-top: var(--metronic-header-height);
    margin-left: var(--metronic-sidebar-width);
    padding: 2.25rem;
    min-height: calc(100vh - var(--metronic-header-height));
  }

  /* Metronic Buttons */
  .btn-aef-primary {
    background-color: var(--metronic-primary);
    border: none;
    color: #ffffff;
    font-weight: 600;
    padding: 0.65rem 1.35rem;
    border-radius: 0.475rem;
    box-shadow: 0px 4px 12px rgba(0, 158, 247, 0.2);
    transition: all 0.2s ease;
  }

  .btn-aef-primary:hover {
    background-color: var(--metronic-primary-hover);
    color: #ffffff;
    box-shadow: 0px 6px 16px rgba(0, 158, 247, 0.3);
  }

  /* Metronic Soft Badges */
  .badge-light-primary {
    background-color: #f1f0fe !important;
    color: #7239ea !important;
  }

  .badge-light-success {
    background-color: #e8fff3 !important;
    color: #50cd89 !important;
  }

  .badge-light-danger {
    background-color: #fff5f8 !important;
    color: #f1416c !important;
  }

  .badge-light-info {
    background-color: #f0f8ff !important;
    color: #009ef7 !important;
  }

  .badge-light-warning {
    background-color: #fff8dd !important;
    color: #ffc700 !important;
  }

  /* Metronic Tables */
  .table-aef {
    color: var(--metronic-text-body);
    border-color: var(--metronic-border);
  }

  .table-aef th {
    background: #f8f9fa;
    color: var(--metronic-text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--metronic-border);
    padding: 0.85rem 1rem;
  }

  .table-aef td {
    border-bottom: 1px solid var(--metronic-border);
    vertical-align: middle;
    padding: 1rem;
    font-size: 0.95rem;
  }

  .table-aef tbody tr:hover {
    background-color: #fafbfc;
  }

  /* Metronic Inputs */
  .form-control, .form-select {
    background-color: #f5f8fa;
    border: 1px solid #e4e6ef;
    color: var(--metronic-text-body);
    border-radius: 0.475rem;
    padding: 0.65rem 1rem;
    font-size: 0.95rem;
  }

  .form-control:focus, .form-select:focus {
    background-color: #ffffff;
    border-color: var(--metronic-primary);
    box-shadow: 0 0 0 0.25rem rgba(0, 158, 247, 0.15);
    color: var(--metronic-text-body);
  }

  /* Headings & Text */
  h1, h2, h3, h4, h5, h6 {
    color: var(--metronic-text-heading);
    font-weight: 600;
  }

  .text-muted {
    color: var(--metronic-text-muted) !important;
  }

  /* Hide elements */
  .d-none-important {
    display: none !important;
  }
</style>
