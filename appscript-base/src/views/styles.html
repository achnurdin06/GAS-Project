<!-- Bootstrap 5 CSS, Icons & JS Bundle -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
<!-- Google Fonts (Inter) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --metronic-bg: #f5f8fa;
    --metronic-card-bg: #ffffff;
    --metronic-header-bg: #ffffff;
    --metronic-sidebar-bg: #ffffff;
    --metronic-primary: #009ef7;
    --metronic-primary-hover: #0086d1;
    --metronic-text-dark: #181c32;
    --metronic-text-body: #3f4254;
    --metronic-text-muted: #a1a5b7;
    --metronic-border: #e4e6ef;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--metronic-bg);
    color: var(--metronic-text-body);
    margin: 0;
    padding: 0;
  }

  /* Utility display class */
  .d-none-important {
    display: none !important;
  }

  /* Header Navbar */
  .aef-header {
    height: 70px;
    background-color: var(--metronic-header-bg);
    border-bottom: 1px solid var(--metronic-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.75rem;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    box-shadow: 0 0 40px 0 rgba(82, 63, 105, 0.04);
  }

  .aef-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--metronic-text-dark);
  }

  .aef-brand-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #009ef7, #7239ea);
    color: #fff;
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
  }

  /* Sidebar Navigation */
  .aef-sidebar {
    width: 260px;
    background-color: var(--metronic-sidebar-bg);
    border-right: 1px solid var(--metronic-border);
    position: fixed;
    top: 70px;
    bottom: 0;
    left: 0;
    padding: 1.5rem 0.75rem;
    overflow-y: auto;
    z-index: 999;
  }

  .aef-nav-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    color: #5e6278;
    font-weight: 500;
    border-radius: 0.475rem;
    text-decoration: none;
    transition: all 0.2s ease;
    margin-bottom: 0.25rem;
  }

  .aef-nav-link:hover, .aef-nav-link.active {
    background-color: #f1f0f8;
    color: var(--metronic-primary);
  }

  .aef-nav-link i {
    font-size: 1.15rem;
  }

  /* Main Wrapper */
  .aef-main-wrapper {
    margin-top: 70px;
    margin-left: 260px;
    padding: 2rem;
    min-height: calc(100vh - 70px);
  }

  /* Metronic Cards */
  .aef-card {
    background: var(--metronic-card-bg);
    border: 1px solid var(--metronic-border);
    border-radius: 0.75rem;
    padding: 1.75rem;
    box-shadow: 0 0 20px 0 rgba(76, 87, 125, 0.02);
    margin-bottom: 1.5rem;
  }

  .btn-aef-primary {
    background-color: var(--metronic-primary);
    color: #ffffff;
    border: none;
    font-weight: 500;
    border-radius: 0.475rem;
    padding: 0.6rem 1.25rem;
    transition: background-color 0.2s;
  }

  .btn-aef-primary:hover {
    background-color: var(--metronic-primary-hover);
    color: #ffffff;
  }

  /* Metronic Soft Badges */
  .badge-light-primary {
    background-color: #f8f5ff;
    color: #7239ea;
  }

  .badge-light-success {
    background-color: #e8fff3;
    color: #50cd89;
  }

  .badge-light-danger {
    background-color: #fff5f8;
    color: #f1416c;
  }

  .badge-light-info {
    background-color: #f1faff;
    color: #009ef7;
  }

  .badge-light-warning {
    background-color: #fff8dd;
    color: #ffc700;
  }

  /* Table Customization */
  .table-aef thead th {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #b5b5c3;
    border-bottom: 1px solid var(--metronic-border);
    padding-bottom: 0.75rem;
  }

  .table-aef tbody td {
    padding: 1rem 0.75rem;
    color: #464e5f;
    font-size: 0.9rem;
    border-bottom: 1px dashed var(--metronic-border);
  }

  /* Pagination Styling */
  .pagination .page-item .page-link {
    border-radius: 0.35rem;
    margin: 0 2px;
    color: #5e6278;
    border: 1px solid var(--metronic-border);
  }

  .pagination .page-item.active .page-link {
    background-color: var(--metronic-primary);
    border-color: var(--metronic-primary);
    color: #ffffff;
  }

  @media (max-width: 991.98px) {
    .aef-sidebar {
      transform: translateX(-100%);
    }
    .aef-main-wrapper {
      margin-left: 0;
    }
  }
</style>
