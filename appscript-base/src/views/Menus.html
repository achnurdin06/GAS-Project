<template id="tpl-menus">
  <!-- TOP HEADER & ACTION BUTTONS -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1" style="color: #181c32;">Menu Management</h3>
      <p class="text-muted small mb-0">Kelola hierarki dan data menu aplikasi.</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-light border text-muted fw-medium" onclick="AEF.toggleAllMenuTree()">
        <i class="bi bi-arrows-collapse me-1" id="btn-toggle-all-tree-icon"></i> <span id="btn-toggle-all-tree-text">Collapse All</span>
      </button>
      <button class="btn btn-aef-primary btn-sm" onclick="AEF.openAddMenuModal()">
        <i class="bi bi-plus-lg me-1"></i> Add New Menu
      </button>
    </div>
  </div>

  <!-- SEARCH & FILTER BAR -->
  <div class="aef-card p-3 mb-3">
    <div class="row g-3 align-items-center">
      <!-- Search -->
      <div class="col-md-5">
        <label class="form-label text-muted small fw-semibold mb-1">Search</label>
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
          <input type="text" id="menu-search-input" class="form-control border-start-0 ps-0" placeholder="Cari menu atau kode..." oninput="AEF.filterMenuTree()">
        </div>
      </div>

      <!-- Status Filter -->
      <div class="col-md-4">
        <label class="form-label text-muted small fw-semibold mb-1">Status</label>
        <div class="btn-group btn-group-sm w-100" role="group">
          <input type="radio" class="btn-check" name="menuStatusFilter" id="status-all" autocomplete="off" checked onclick="AEF.filterMenuStatus('ALL')">
          <label class="btn btn-outline-secondary" for="status-all">All</label>

          <input type="radio" class="btn-check" name="menuStatusFilter" id="status-active" autocomplete="off" onclick="AEF.filterMenuStatus('ACTIVE')">
          <label class="btn btn-outline-secondary" for="status-active">Active</label>

          <input type="radio" class="btn-check" name="menuStatusFilter" id="status-inactive" autocomplete="off" onclick="AEF.filterMenuStatus('INACTIVE')">
          <label class="btn btn-outline-secondary" for="status-inactive">Inactive</label>
        </div>
      </div>

      <!-- Parent Menu Filter -->
      <div class="col-md-3">
        <label class="form-label text-muted small fw-semibold mb-1">Parent Menu Filter</label>
        <select id="menu-parent-filter" class="form-select form-select-sm" onchange="AEF.filterMenuParent()">
          <option value="ALL">All Parent Menus</option>
          <option value="TOP">Top-Level Only</option>
        </select>
      </div>
    </div>
  </div>

  <!-- MAIN 2-COLUMN GRID (LEFT TREE TABLE + RIGHT DETAIL PANEL) -->
  <div class="row g-3">
    <!-- LEFT: TREE TABLE CONTAINER -->
    <div class="col-lg-7 col-xl-8">
      <div class="aef-card p-0 overflow-hidden">
        <div class="table-responsive">
          <table class="table table-aef align-middle mb-0">
            <thead>
              <tr class="bg-light">
                <th style="width: 38%;">Menu Name</th>
                <th style="width: 10%;">Icon</th>
                <th style="width: 14%;">Type</th>
                <th style="width: 12%;">Status</th>
                <th style="width: 26%; text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="menus-tree-tbody">
              <!-- Dynamically populated hierarchical tree rows -->
            </tbody>
          </table>
        </div>

        <!-- Pagination Controls -->
        <div class="d-flex justify-content-between align-items-center p-3 border-top border-light-subtle">
          <div class="text-muted small" id="menus-pagination-info">Memuat data menu...</div>
          <ul class="pagination pagination-sm mb-0" id="menus-pagination-controls"></ul>
        </div>
      </div>
    </div>

    <!-- RIGHT: READ-ONLY QUICK DETAIL MENU PANEL -->
    <div class="col-lg-5 col-xl-4">
      <div class="aef-card h-100" id="side-menu-detail-card">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-light">
          <h6 class="fw-bold text-dark mb-0"><i class="bi bi-info-circle text-primary me-2"></i>Detail Menu</h6>
          <span class="badge badge-light-primary" id="detail-menu-type-badge">Select a Menu</span>
        </div>

        <!-- Placeholder when no menu selected -->
        <div id="detail-empty-state" class="text-center py-5">
          <i class="bi bi-menu-button-wide text-muted display-6 mb-2 d-block"></i>
          <p class="text-muted small mb-0">Klik salah satu baris menu di tabel untuk melihat detail informasi.</p>
        </div>

        <!-- Detail Contents -->
        <div id="detail-content-state" class="d-none">
          <div class="d-flex align-items-center gap-3 mb-4 p-3 bg-light rounded">
            <div class="aef-icon-box bg-white text-primary shadow-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; font-size: 1.5rem;" id="detail-icon-preview">
              <i class="bi bi-grid"></i>
            </div>
            <div class="overflow-hidden">
              <h5 class="fw-bold text-dark mb-1 text-truncate" id="detail-menu-name">-</h5>
              <div class="d-flex gap-2">
                <span class="badge bg-success-subtle text-success border border-success-subtle" id="detail-menu-status-badge">ACTIVE</span>
                <span class="text-muted small" id="detail-menu-code">-</span>
              </div>
            </div>
          </div>

          <div class="table-responsive mb-3">
            <table class="table table-sm table-borderless align-middle mb-0 text-dark small">
              <tbody>
                <tr>
                  <td class="text-muted" style="width: 40%;">Menu ID:</td>
                  <td class="fw-medium text-break" id="detail-menu-id">-</td>
                </tr>
                <tr>
                  <td class="text-muted">Parent Menu:</td>
                  <td class="fw-medium" id="detail-menu-parent-name">Top Level</td>
                </tr>
                <tr>
                  <td class="text-muted">URL / Route:</td>
                  <td class="fw-medium text-primary text-break" id="detail-menu-route">-</td>
                </tr>
                <tr>
                  <td class="text-muted">Slug:</td>
                  <td class="fw-medium" id="detail-menu-slug">-</td>
                </tr>
                <tr>
                  <td class="text-muted">Icon Class:</td>
                  <td class="fw-medium font-monospace" id="detail-menu-icon-class">-</td>
                </tr>
                <tr>
                  <td class="text-muted">Sort Order:</td>
                  <td class="fw-medium" id="detail-menu-sort">-</td>
                </tr>
                <tr>
                  <td class="text-muted">Permission:</td>
                  <td class="fw-medium text-break" id="detail-menu-perm">-</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="mb-4 p-3 border border-light-subtle rounded bg-body-tertiary">
            <div class="text-muted fs-8 fw-bold text-uppercase mb-1">Deskripsi</div>
            <div class="text-dark small" id="detail-menu-desc">Tidak ada deskripsi.</div>
          </div>

          <div class="d-flex gap-2 pt-2 border-top border-light">
            <button type="button" class="btn btn-aef-primary btn-sm flex-fill" onclick="AEF.openEditFromDetail()">
              <i class="bi bi-pencil me-1"></i> Edit Menu
            </button>
            <button type="button" class="btn btn-light border btn-sm text-muted" onclick="AEF.openAddSubFromDetail()">
              <i class="bi bi-plus-lg me-1"></i> Sub-Menu
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
