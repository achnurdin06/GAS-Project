<template id="tpl-menus">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1" style="color: #181c32;">Menu Management</h3>
      <p class="text-muted small mb-0">Kelola struktur menu navigasi sidebar, rute, ikon, dan otorisasi secara dinamis.</p>
    </div>
    <button class="btn btn-aef-primary" onclick="AEF.showModal('addMenuModal')">
      <i class="bi bi-plus-lg me-1"></i> Tambah Menu
    </button>
  </div>

  <div class="aef-card">
    <div class="table-responsive">
      <table class="table table-aef align-middle mb-0">
        <thead>
          <tr>
            <th>Menu Code</th>
            <th>Nama Menu</th>
            <th>Route</th>
            <th>Icon</th>
            <th>Urutan</th>
            <th>Permission</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="menus-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light-subtle">
      <div class="text-muted small" id="menus-pagination-info">Memuat menu...</div>
      <ul class="pagination pagination-sm mb-0" id="menus-pagination-controls"></ul>
    </div>
  </div>
</template>
