<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
<!-- Chart.js for Dashboard (Canvas-based) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  /**
   * AppScript Enterprise Framework (AEF) Client Engine
   */
  const AEF = {
    state: {
      user: null,
      session: null,
      permissions: [],
      currentRoute: '/dashboard'
    },

    init: function () {
      this.checkSessionState();
      
      // Global manual tab switching fallback when bootstrap is not defined
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-bs-toggle="tab"]');
        if (btn && typeof bootstrap === 'undefined') {
          e.preventDefault();
          const targetId = btn.getAttribute('data-bs-target');
          if (targetId) {
            const nav = btn.closest('.nav-tabs');
            if (nav) {
              nav.querySelectorAll('[data-bs-toggle="tab"]').forEach(b => b.classList.remove('active'));
            }
            btn.classList.add('active');
            
            const pane = document.querySelector(targetId);
            if (pane) {
              const parent = pane.parentElement;
              if (parent) {
                parent.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('show', 'active'));
              }
              pane.classList.add('show', 'active');
            }
          }
        }
      });
    },

    checkSessionState: function () {
      const stored = localStorage.getItem('AEF_AUTH_DATA');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          this.state.user = parsed.user;
          this.state.session = parsed.session;
          this.state.permissions = parsed.permissions;
          this.showAppShell();
          this.loadSidebarMenu();
          this.navigateTo('/dashboard');
          return;
        } catch (e) {
          localStorage.removeItem('AEF_AUTH_DATA');
        }
      }
      this.showLoginShell();
    },

    showLoginShell: function () {
      document.getElementById('aef-app-shell').classList.add('d-none-important');
      document.getElementById('aef-login-shell').classList.remove('d-none-important');
    },

    showAppShell: function () {
      document.getElementById('aef-login-shell').classList.add('d-none-important');
      document.getElementById('aef-app-shell').classList.remove('d-none-important');
      if (this.state.user) {
        document.getElementById('user-display-name').innerText = this.state.user.name;
        const displayEmail = document.getElementById('user-display-email');
        if (displayEmail) displayEmail.innerText = this.state.user.email;

        // Render header profile avatar/image
        const headerInitials = document.getElementById('header-avatar-initials');
        const headerImg = document.getElementById('header-avatar-img');
        if (headerInitials && headerImg) {
          if (this.state.user.profile_pic_url) {
            headerImg.src = this.state.user.profile_pic_url;
            headerImg.classList.remove('d-none');
            headerInitials.classList.add('d-none');
          } else {
            headerImg.src = '';
            headerImg.classList.add('d-none');
            headerInitials.classList.remove('d-none');
            headerInitials.innerText = this.state.user.name ? this.state.user.name.substring(0, 2).toUpperCase() : 'A';
          }
        }
      }
    },

    login: function (email, password) {
      const btn = document.getElementById('btn-login-submit');
      const errorAlert = document.getElementById('login-error-alert');
      errorAlert.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In Super Admin';
          if (res.success) {
            if (res.data && res.data.require_2fa) {
              // Redirect to 2FA layout
              this.state.pending2FAEmail = email;
              document.getElementById('login-form-container').classList.add('d-none');
              document.getElementById('twofa-email-display').innerText = email;
              document.getElementById('twofa-form-container').classList.remove('d-none');
              document.getElementById('twofa-code').value = '';
              document.getElementById('twofa-error-alert').classList.add('d-none');
            } else {
              this.state.user = res.data.user;
              this.state.session = res.data.session;
              this.state.permissions = res.data.permissions;
              localStorage.setItem('AEF_AUTH_DATA', JSON.stringify(res.data));
              this.showAppShell();
              this.loadSidebarMenu();
              this.navigateTo('/dashboard');
            }
          } else {
            errorAlert.innerText = res.message || 'Login Gagal';
            errorAlert.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In Super Admin';
          errorAlert.innerText = 'Error: ' + err.message;
          errorAlert.classList.remove('d-none');
        })
        .apiLogin({ email, password });
    },

    verify2FA: function (otpCode) {
      const btn = document.getElementById('btn-twofa-submit');
      const errorAlert = document.getElementById('twofa-error-alert');
      errorAlert.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';

      const email = this.state.pending2FAEmail;

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML = 'Verifikasi & Masuk';
          if (res.success) {
            this.state.user = res.data.user;
            this.state.session = res.data.session;
            this.state.permissions = res.data.permissions;
            localStorage.setItem('AEF_AUTH_DATA', JSON.stringify(res.data));
            
            document.getElementById('twofa-form-container').classList.add('d-none');
            document.getElementById('login-form-container').classList.remove('d-none');
            document.getElementById('twofa-code').value = '';
            this.state.pending2FAEmail = null;

            this.showAppShell();
            this.loadSidebarMenu();
            this.navigateTo('/dashboard');
          } else {
            errorAlert.innerText = res.message || 'Verification Failed';
            errorAlert.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML = 'Verifikasi & Masuk';
          errorAlert.innerText = 'Error: ' + err.message;
          errorAlert.classList.remove('d-none');
        })
        .apiVerify2FA({ email, otp_code: otpCode });
    },

    cancel2FA: function () {
      document.getElementById('twofa-form-container').classList.add('d-none');
      document.getElementById('login-form-container').classList.remove('d-none');
      document.getElementById('twofa-code').value = '';
      this.state.pending2FAEmail = null;
    },

    getFileBase64: function (fileInputId) {
      return new Promise((resolve) => {
        const input = document.getElementById(fileInputId);
        if (!input || !input.files || input.files.length === 0) {
          resolve({ base64: null, name: null });
          return;
        }
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function (e) {
          resolve({ base64: e.target.result, name: file.name });
        };
        reader.onerror = function () {
          resolve({ base64: null, name: null });
        };
        reader.readAsDataURL(file);
      });
    },

    logout: function () {
      google.script.run.apiLogout({
        session_id: this.state.session ? this.state.session.session_id : '',
        user_id: this.state.user ? this.state.user.id : ''
      });

      this.state.user = null;
      this.state.session = null;
      this.state.permissions = [];
      localStorage.removeItem('AEF_AUTH_DATA');
      this.showLoginShell();
    },

    loadSidebarMenu: function () {
      const navContainer = document.getElementById('aef-sidebar-nav');
      if (!navContainer) return;
      navContainer.innerHTML = '<div class="text-center p-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div>';

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success && Array.isArray(res.data)) {
            let html = '';
            
            // Fixed Dashboard link at top of sidebar
            html += `
              <a href="#" class="aef-nav-link" onclick="AEF.navigateTo('/dashboard'); return false;" id="nav-item-dashboard">
                <div class="aef-nav-left">
                  <i class="bi bi-grid-1x2-fill"></i>
                  <span>Dashboard</span>
                </div>
              </a>
            `;

            res.data.forEach(item => {
              const route = item.route || (item.slug ? '/' + item.slug : '#');
              const menuTitle = item.name || item.menu_name || item.code || 'Menu';
              const menuCode = item.code || item.menu_code || item.id;

              // Ensure Dashboard is not duplicated
              if (route === '/dashboard' || item.slug === 'dashboard' || item.menu_code === 'MENU_DASHBOARD' || menuTitle === 'Dashboard') {
                return;
              }

              // If the menu item has children (Parent Module), render section title & child items
              if (Array.isArray(item.children) && item.children.length > 0) {
                html += `<div class="aef-sidebar-section-title mt-3">${menuTitle.toUpperCase()}</div>`;
                item.children.forEach(child => {
                  const childRoute = child.route || (child.slug ? '/' + child.slug : '#');
                  const childTitle = child.name || child.menu_name || child.code || 'Submenu';
                  const childCode = child.code || child.menu_code || child.id;
                  const childIcon = child.icon || 'bi-circle';
                  html += `
                    <a href="#" class="aef-nav-link" onclick="AEF.navigateTo('${childRoute}'); return false;" id="nav-item-${childCode}">
                      <div class="aef-nav-left">
                        <i class="bi ${childIcon}"></i>
                        <span>${childTitle}</span>
                      </div>
                    </a>
                  `;
                });
              } else {
                const iconClass = item.icon || 'bi-circle';
                html += `
                  <a href="#" class="aef-nav-link" onclick="AEF.navigateTo('${route}'); return false;" id="nav-item-${menuCode}">
                    <div class="aef-nav-left">
                      <i class="bi ${iconClass}"></i>
                      <span>${menuTitle}</span>
                    </div>
                  </a>
                `;
              }
            });
            navContainer.innerHTML = html;
          }
        })
        .withFailureHandler((err) => {
          navContainer.innerHTML = '<div class="text-danger small p-2">Gagal memuat menu.</div>';
        })
        .apiGetMenu({ role_id: this.state.user ? this.state.user.role_id : 'ROLE_SUPER_ADMIN' });
    },

    navigateTo: function (route) {
      this.state.currentRoute = route;

      // Active state highlight
      document.querySelectorAll('.aef-nav-link').forEach(el => el.classList.remove('active'));
      const activeNav = document.querySelector(`.aef-nav-link[onclick*="${route}"]`);
      if (activeNav) activeNav.classList.add('active');

      const contentCanvas = document.getElementById('aef-main-content');
      
      if (route === '/dashboard') {
        contentCanvas.innerHTML = document.getElementById('tpl-dashboard').innerHTML;
        this.initDashboardChart();
      } else if (route === '/users') {
        contentCanvas.innerHTML = document.getElementById('tpl-users').innerHTML;
        this.loadUsersTable();
      } else if (route === '/roles') {
        contentCanvas.innerHTML = document.getElementById('tpl-roles').innerHTML;
        this.loadRolesTable();
      } else if (route === '/permissions') {
        contentCanvas.innerHTML = document.getElementById('tpl-permissions').innerHTML;
        this.loadPermissionsTable();
      } else if (route === '/config') {
        contentCanvas.innerHTML = document.getElementById('tpl-config').innerHTML;
        this.loadConfigsTable();
      } else if (route === '/audit') {
        contentCanvas.innerHTML = document.getElementById('tpl-audit').innerHTML;
        this.loadAuditLogsTable();
      } else if (route === '/menus') {
        contentCanvas.innerHTML = document.getElementById('tpl-menus').innerHTML;
        this.loadMenusTable();
      } else {
        contentCanvas.innerHTML = `
          <div class="aef-card text-center py-5">
            <i class="bi bi-compass fs-1 text-muted"></i>
            <h4 class="mt-3">Halaman ${route}</h4>
            <p class="text-muted">Modul ini siap dikembangkan sesuai metadata AEF.</p>
          </div>
        `;
      }
    },

    // PAGINATION ENGINE
    paginationState: {
      users: { page: 1, pageSize: 5, data: [] },
      roles: { page: 1, pageSize: 5, data: [] },
      perms: { page: 1, pageSize: 5, data: [] },
      configs: { page: 1, pageSize: 5, data: [] },
      audit: { page: 1, pageSize: 5, data: [] },
      menus: { page: 1, pageSize: 5, data: [] }
    },

    renderTablePagination: function (key, renderRowFn, tbodyId, infoId, controlsId) {
      const state = this.paginationState[key];
      if (!state) return;

      const tbody = document.getElementById(tbodyId);
      const infoElem = document.getElementById(infoId);
      const controlsElem = document.getElementById(controlsId);
      if (!tbody) return;

      const data = state.data || [];
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">Tidak ada data ditemukan.</td></tr>';
        if (infoElem) infoElem.innerText = 'Showing 0 to 0 of 0 entries';
        if (controlsElem) controlsElem.innerHTML = '';
        return;
      }

      const totalItems = data.length;
      const pageSize = state.pageSize || 5;
      const totalPages = Math.ceil(totalItems / pageSize);
      state.page = Math.max(1, Math.min(state.page || 1, totalPages));
      const currentPage = state.page;

      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, totalItems);
      const pageSlice = data.slice(startIdx, endIdx);

      let rowsHtml = '';
      pageSlice.forEach((item, idx) => {
        rowsHtml += renderRowFn(item, startIdx + idx);
      });
      tbody.innerHTML = rowsHtml;

      if (infoElem) {
        infoElem.innerText = `Showing ${startIdx + 1} to ${endIdx} of ${totalItems} entries`;
      }

      if (controlsElem) {
        let html = '';
        const prevDisabled = currentPage === 1 ? 'disabled' : '';
        html += `<li class="page-item ${prevDisabled}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${currentPage - 1}); return false;">Prev</a></li>`;

        for (let p = 1; p <= totalPages; p++) {
          const activeClass = p === currentPage ? 'active' : '';
          html += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${p}); return false;">${p}</a></li>`;
        }

        const nextDisabled = currentPage === totalPages ? 'disabled' : '';
        html += `<li class="page-item ${nextDisabled}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${currentPage + 1}); return false;">Next</a></li>`;

        controlsElem.innerHTML = html;
      }
    },

    changeTablePage: function (key, newPage) {
      if (!this.paginationState[key]) return;
      this.paginationState[key].page = newPage;
      if (key === 'users') this.renderUsersPage();
      else if (key === 'roles') this.renderRolesPage();
      else if (key === 'perms') this.renderPermissionsPage();
      else if (key === 'configs') this.renderConfigsPage();
      else if (key === 'audit') this.renderAuditPage();
      else if (key === 'menus') this.renderMenusPage();
    },

    // USERS CRUD
    loadUsersTable: function () {
      const tableBody = document.getElementById('users-table-body');
      if (!tableBody) return;
      tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success && Array.isArray(res.data)) {
            this.usersCache = res.data;
            this.paginationState.users.data = res.data;
            this.paginationState.users.page = 1;
            this.renderUsersPage();
          }
        })
        .apiGetUsers({ actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    renderUsersPage: function () {
      this.renderTablePagination('users', (u) => `
        <tr>
          <td class="fw-semibold" style="color: #181c32;">${u.name}</td>
          <td>${u.email}</td>
          <td>${u.phone || '-'}</td>
          <td><span class="badge badge-light-primary px-3 py-2 fs-7">${u.role_id}</span></td>
          <td><span class="badge badge-light-success px-3 py-2 fs-7">${u.status}</span></td>
          <td>
            <button class="btn btn-sm btn-light border text-muted me-1" onclick="AEF.showUserDetail('${u.id}')" title="Detail User">
              <i class="bi bi-eye"></i>
            </button>
            <button class="btn btn-sm btn-light border text-muted me-1" onclick="AEF.openEditUserModal('${u.id}')" title="Edit User">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-light-danger text-danger border border-danger-subtle" onclick="AEF.openDeleteUserModal('${u.id}')" title="Hapus User">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `, 'users-table-body', 'users-pagination-info', 'users-pagination-controls');
    },

    showModal: function (modalId) {
      if (modalId === 'addUserModal') {
        this.populateRoleDropdowns('', ['new-user-role']);
        // Pre-set new-user-expired-at to 1 year from now
        const oneYearFromNow = new Date();
        oneYearFromNow.setFullYear(oneYearFromNow.getFullYear() + 1);
        const yyyy = oneYearFromNow.getFullYear();
        const mm = String(oneYearFromNow.getMonth() + 1).padStart(2, '0');
        const dd = String(oneYearFromNow.getDate()).padStart(2, '0');
        document.getElementById('new-user-expired-at').value = `${yyyy}-${mm}-${dd}`;
        document.getElementById('new-user-profile-pic').value = '';
        document.getElementById('new-user-two-fa').checked = false;
      }
      if (modalId === 'addPermModal') this.populateRoleDropdowns('', ['new-perm-role']);
      if (modalId === 'addMenuModal') {
        this.populatePermissionDropdowns('', ['new-menu-perm']);
        this.populateParentMenuDropdowns('', ['new-menu-parent']);
      }

      const modalEl = document.getElementById(modalId);
      if (!modalEl) return;
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Modal) {
          let modal = bootstrap.Modal.getInstance(modalEl);
          if (!modal) modal = new bootstrap.Modal(modalEl);
          modal.show();
          return;
        }
      } catch (e) {}

      // Fallback
      modalEl.classList.add('show');
      modalEl.style.display = 'block';
      document.body.classList.add('modal-open');
    },

    populateRoleDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Pilih Role --</option>';
            res.data.forEach(r => {
              const isSelected = String(selectedVal).trim().toUpperCase() === String(r.role_code).trim().toUpperCase() ? 'selected' : '';
              options += `<option value="${r.role_code}" ${isSelected}>${r.role_name} (${r.role_code})</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetRoles();
    },

    populatePermissionDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Pilih Permission --</option>';
            res.data.forEach(p => {
              const isSelected = String(selectedVal).trim().toUpperCase() === String(p.permission_code).trim().toUpperCase() ? 'selected' : '';
              options += `<option value="${p.permission_code}" ${isSelected}>${p.permission_name} (${p.permission_code})</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetPermissions();
    },

    populateParentMenuDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Main Top-Level Menu --</option>';
            res.data.forEach(m => {
              const mId = m.menu_id || m.id;
              const isSelected = String(selectedVal).trim() === String(mId).trim() ? 'selected' : '';
              options += `<option value="${mId}" ${isSelected}>${m.menu_name || m.name}</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetAllMenus();
    },

    hideModal: function (modalId) {
      const modalEl = document.getElementById(modalId);
      if (!modalEl) return;
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Modal) {
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
        }
      } catch (e) {}

      // Fallback cleanup
      modalEl.classList.remove('show');
      modalEl.style.display = 'none';
      document.body.classList.remove('modal-open');
      const backdrop = document.querySelector('.modal-backdrop');
      if (backdrop) backdrop.remove();
    },

    createUser: async function () {
      const name = document.getElementById('new-user-name').value;
      const email = document.getElementById('new-user-email').value;
      const phone = document.getElementById('new-user-phone').value;
      const username = document.getElementById('new-user-username').value;
      const password = document.getElementById('new-user-password').value;
      const roleId = document.getElementById('new-user-role').value;
      const forceChange = document.getElementById('new-user-force-change').checked;
      const expiredAt = document.getElementById('new-user-expired-at').value;
      const twoFaEnabled = document.getElementById('new-user-two-fa').checked;

      if (!name || !email || !password || !username || !expiredAt) {
        alert('Mohon isi semua field wajib termasuk Masa Berlaku!');
        return;
      }

      // Show loader
      const form = document.getElementById('form-add-user');
      const submitBtn = form.querySelector('button[type="submit"]');
      const origText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...';

      const fileData = await this.getFileBase64('new-user-profile-pic');

      google.script.run
        .withSuccessHandler((res) => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
          if (res.success) {
            this.hideModal('addUserModal');
            document.getElementById('form-add-user').reset();
            this.loadUsersTable();
          } else {
            alert('Gagal membuat user: ' + res.message);
          }
        })
        .withFailureHandler((err) => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
          alert('Error: ' + err.message);
        })
        .apiCreateUser({
          name: name,
          email: email,
          phone: phone,
          username: username,
          force_password_change: forceChange,
          password: password,
          role_id: roleId,
          expired_at: expiredAt,
          two_fa_enabled: twoFaEnabled,
          profile_pic_base64: fileData.base64,
          profile_pic_name: fileData.name,
          actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
        });
    },

    openEditUserModal: function (userId) {
      const user = (this.usersCache || []).find(u => u.id === userId);
      if (!user) return;
      document.getElementById('edit-user-id').value = user.id;
      document.getElementById('edit-user-name').value = user.name;
      document.getElementById('edit-user-email').value = user.email;
      document.getElementById('edit-user-phone').value = user.phone || '';
      document.getElementById('edit-user-username').value = user.username || '';
      document.getElementById('edit-user-password').value = '';
      document.getElementById('edit-user-force-change').checked = (user.force_password_change === 1);
      document.getElementById('edit-user-status').value = user.status || 'ACTIVE';
      
      // Load new fields
      if (user.expired_at) {
        document.getElementById('edit-user-expired-at').value = user.expired_at.substring(0, 10);
      } else {
        document.getElementById('edit-user-expired-at').value = '';
      }
      document.getElementById('edit-user-two-fa').checked = (user.two_fa_enabled === 1 || user.two_fa_enabled === '1' || user.two_fa_enabled === true);
      document.getElementById('edit-user-profile-pic').value = '';

      // Set avatar initials
      const initials = (user.name || 'US').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('edit-user-avatar').textContent = initials;

    loadUserAuditLogs: function (user) {
      google.script.run.withSuccessHandler((res) => {
        const tbody = document.getElementById('detail-activity-tbody');
        const fullTbody = document.getElementById('detail-full-activity-tbody');
        if (!tbody || !fullTbody) return;

        if (res.success && Array.isArray(res.data)) {
          const userLogs = res.data.filter(log => 
            String(log.actor_id).toLowerCase() === String(user.email).toLowerCase() ||
            String(log.actor_id).toLowerCase() === String(user.id).toLowerCase() ||
            String(log.details).toLowerCase().includes(String(user.email).toLowerCase()) ||
            String(log.details).toLowerCase().includes(String(user.id).toLowerCase())
          );

          this.currentUserDetailLogs = userLogs;

          if (userLogs.length === 0) {
            const emptyRow = `<tr><td colspan="4" class="text-center py-2 text-muted">Belum ada aktivitas tercatat</td></tr>`;
            tbody.innerHTML = emptyRow;
            fullTbody.innerHTML = emptyRow;
            return;
          }

          let recentHtml = '';
          userLogs.slice(0, 5).forEach(log => {
            recentHtml += `<tr>
              <td>${log.timestamp || '-'}</td>
              <td><span class="badge badge-light-secondary px-2 py-1 fs-8">${log.action}</span></td>
              <td>${log.module}</td>
              <td>${log.ip_address || '192.168.1.1'}</td>
            </tr>`;
          });
          tbody.innerHTML = recentHtml;

          let fullHtml = '';
          userLogs.forEach(log => {
            fullHtml += `<tr>
              <td>${log.timestamp || '-'}</td>
              <td><span class="badge badge-light-secondary px-2 py-1 fs-8">${log.action}</span></td>
              <td>${log.module}</td>
              <td>${log.details || '-'}</td>
            </tr>`;
          });
          fullTbody.innerHTML = fullHtml;
        } else {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Gagal memuat log</td></tr>`;
          fullTbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Gagal memuat log</td></tr>`;
        }
      }).apiGetAuditLogs();
    },

    downloadUserDetailAuditCsv: function () {
      const logs = this.currentUserDetailLogs || [];
      if (logs.length === 0) {
        alert('Tidak ada log aktivitas untuk diunduh.');
        return;
      }

      let csvContent = 'data:text/csv;charset=utf-8,Timestamp,Action,Module,IP Address,Details\n';
      logs.forEach(log => {
        const row = [
          log.timestamp,
          log.action,
          log.module,
          log.ip_address || '192.168.1.1',
          `"${(log.details || '').replace(/"/g, '""')}"`
        ].join(',');
        csvContent += row + '\n';
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `audit_log_${this.currentUserDetailLogs[0].actor_id || 'user'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    },

    toggleAllMenuTree: function () {
      const parents = (this.menusCache || []).filter(m => !m.parent_id);
      const anyExpanded = parents.some(p => !this.menuTreeState.collapsed[p.menu_id || p.id]);
      
      parents.forEach(p => {
        const pId = p.menu_id || p.id;
        this.menuTreeState.collapsed[pId] = anyExpanded;
      });

      const btnIcon = document.getElementById('btn-toggle-all-tree-icon');
      const btnText = document.getElementById('btn-toggle-all-tree-text');
      if (btnIcon) btnIcon.className = anyExpanded ? 'bi bi-arrows-expand me-1' : 'bi bi-arrows-collapse me-1';
      if (btnText) btnText.innerText = anyExpanded ? 'Expand All' : 'Collapse All';

      this.renderMenusTreeTable(this.menusCache);

    renderMenusTreeTable: function (dataList) {
      const tbody = document.getElementById('menus-tree-tbody');
      const infoElem = document.getElementById('menus-pagination-info');
      const controlsElem = document.getElementById('menus-pagination-controls');
      if (!tbody) return;

      const data = dataList || this.menusCache || [];
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Tidak ada data menu ditemukan.</td></tr>';
        if (infoElem) infoElem.innerText = 'Showing 0 of 0 entries';
        if (controlsElem) controlsElem.innerHTML = '';
        return;
      }

      // Group into top-level parents and child map
      const parents = data.filter(m => !m.parent_id);
      const childrenMap = {};
      data.forEach(m => {
        if (m.parent_id) {
          if (!childrenMap[m.parent_id]) childrenMap[m.parent_id] = [];
          childrenMap[m.parent_id].push(m);
        }
      });

      // Build hierarchical row structures
      const flatTreeRows = [];

      parents.forEach(p => {
        const pId = p.menu_id || p.id;
        const pChildren = childrenMap[pId] || [];
        const isCollapsed = !!this.menuTreeState.collapsed[pId];

        flatTreeRows.push({
          item: p,
          isParent: true,
          parentId: null,
          hasChildren: pChildren.length > 0,
          isCollapsed: isCollapsed
        });

        if (!isCollapsed) {
          pChildren.forEach(c => {
            flatTreeRows.push({
              item: c,
              isParent: false,
              parentId: pId,
              hasChildren: false,
              isCollapsed: false
            });
          });
        }
      });

      // Apply Pagination
      const totalItems = flatTreeRows.length;
      const pageSize = this.menuPagination.pageSize || 20;
      const totalPages = Math.ceil(totalItems / pageSize) || 1;
      
      if (this.menuPagination.page > totalPages) this.menuPagination.page = totalPages;
      if (this.menuPagination.page < 1) this.menuPagination.page = 1;

      const currentPage = this.menuPagination.page;
      const startIndex = (currentPage - 1) * pageSize;
      const pageItems = flatTreeRows.slice(startIndex, startIndex + pageSize);

      let html = '';
      pageItems.forEach(row => {
        const m = row.item;
        const mId = m.menu_id || m.id;
        const typeBadge = m.type === 'Internal Link' ? 'bg-info bg-opacity-10 text-info' : (m.type === 'Sub Menu' ? 'bg-secondary bg-opacity-10 text-secondary' : 'bg-primary bg-opacity-10 text-primary');
        const statusBadge = (m.status || 'ACTIVE').toUpperCase() === 'INACTIVE' ? 'badge-light-danger' : 'badge-light-success';

        if (row.isParent) {
          const toggleIconClass = row.hasChildren ? (row.isCollapsed ? 'bi-chevron-right text-muted' : 'bi-chevron-down text-primary') : 'bi-dot text-muted';
          html += `
            <tr class="align-middle fw-semibold cursor-pointer" onclick="AEF.showMenuDetail('${mId}')" style="background-color: #ffffff;">
              <td>
                <span class="tree-toggle-btn me-2" onclick="AEF.toggleSubTree(event, '${mId}')">
                  <i class="bi ${toggleIconClass} fs-7"></i>
                </span>
                <i class="bi ${m.icon || 'bi-folder'} me-2 text-primary"></i>
                <span class="text-dark fw-bold">${m.menu_name || m.name}</span>
                <span class="text-muted ms-2 fs-8 fw-normal">(${m.menu_code || m.code})</span>
              </td>
              <td><i class="bi ${m.icon || 'bi-circle'} me-1 text-muted"></i></td>
              <td><span class="badge ${typeBadge} border-0 px-2.5 py-1.5 fs-8">${m.type || 'Module'}</span></td>
              <td><span class="badge ${statusBadge} px-2.5 py-1.5 fs-8">${m.status || 'ACTIVE'}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-link text-primary p-0 me-2 text-decoration-none" onclick="event.stopPropagation(); AEF.openEditMenuModal('${mId}')"><i class="bi bi-pencil me-1"></i>Edit</button>
                <button class="btn btn-sm btn-link text-danger p-0 me-2 text-decoration-none" onclick="event.stopPropagation(); AEF.deleteMenu('${mId}')"><i class="bi bi-trash me-1"></i>Delete</button>
                <button class="btn btn-sm btn-link text-success p-0 text-decoration-none" onclick="event.stopPropagation(); AEF.openAddSubMenuModal('${mId}')"><i class="bi bi-plus-circle me-1"></i>Sub-Menu</button>
              </td>
            </tr>
          `;
        } else {
          html += `
            <tr class="align-middle cursor-pointer" onclick="AEF.showMenuDetail('${mId}')" style="background-color: #f8fafc;">
              <td class="ps-4">
                <span class="text-muted me-2" style="font-family: monospace;">├─</span>
                <i class="bi ${m.icon || 'bi-file-earmark'} me-2 text-muted"></i>
                <span class="text-dark fw-medium">${m.menu_name || m.name}</span>
                <span class="text-muted ms-2 fs-8">(${m.menu_code || m.code})</span>
              </td>
              <td><i class="bi ${m.icon || 'bi-circle'} me-1 text-muted"></i></td>
              <td><span class="badge ${typeBadge} border-0 px-2.5 py-1.5 fs-8">${m.type || 'Sub Menu'}</span></td>
              <td><span class="badge ${statusBadge} px-2.5 py-1.5 fs-8">${m.status || 'ACTIVE'}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-link text-primary p-0 me-2 text-decoration-none" onclick="event.stopPropagation(); AEF.openEditMenuModal('${mId}')"><i class="bi bi-pencil me-1"></i>Edit</button>
                <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none" onclick="event.stopPropagation(); AEF.deleteMenu('${mId}')"><i class="bi bi-trash me-1"></i>Delete</button>
              </td>
            </tr>
          `;
        }
      });

      tbody.innerHTML = html;

      // Update Pagination UI Info & Controls
      if (infoElem) {
        const fromCount = startIndex + 1;
        const toCount = Math.min(startIndex + pageSize, totalItems);
        infoElem.innerText = `Showing ${fromCount} to ${toCount} of ${totalItems} entries`;
      }

      if (controlsElem) {
        let pagHtml = '';
        pagHtml += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${currentPage - 1});">Prev</a></li>`;
        
        for (let p = 1; p <= totalPages; p++) {
          pagHtml += `<li class="page-item ${p === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${p});">${p}</a></li>`;
        }

        pagHtml += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${currentPage + 1});">Next</a></li>`;
        controlsElem.innerHTML = pagHtml;
      }
    },

    changeMenuPage: function (page) {
      this.menuPagination.page = page;
      this.renderMenusTreeTable(this.menusCache);
    },

    changeMenuPageSize: function (size) {
      this.menuPagination.pageSize = size;
      this.menuPagination.page = 1;
      this.renderMenusTreeTable(this.menusCache);
    },

    showMenuDetail: function (menuId) {
      const menu = (this.menusCache || []).find(m => (m.menu_id === menuId || m.id === menuId));
      if (!menu) return;

      this.selectedMenuDetailId = menu.menu_id || menu.id;

      const parentMenu = (this.menusCache || []).find(m => (m.menu_id === menu.parent_id || m.id === menu.parent_id));
      const parentName = parentMenu ? (parentMenu.menu_name || parentMenu.name) : 'Top Level Module';

      document.getElementById('detail-empty-state').classList.add('d-none');
      document.getElementById('detail-content-state').classList.remove('d-none');

      document.getElementById('detail-menu-name').innerText = menu.menu_name || menu.name || '-';
      document.getElementById('detail-menu-code').innerText = menu.menu_code || menu.code || '-';
      document.getElementById('detail-menu-id').innerText = menu.menu_id || menu.id || '-';
      document.getElementById('detail-menu-parent-name').innerText = parentName;
      document.getElementById('detail-menu-route').innerText = menu.route || '-';
      document.getElementById('detail-menu-slug').innerText = menu.slug || '-';
      document.getElementById('detail-menu-icon-class').innerText = menu.icon || 'bi-circle';
      document.getElementById('detail-menu-sort').innerText = menu.sort_order !== undefined ? menu.sort_order : '1';
      document.getElementById('detail-menu-perm').innerText = menu.permission_code || 'DASHBOARD_VIEW';
      document.getElementById('detail-menu-desc').innerText = menu.description || 'Tidak ada deskripsi.';

      document.getElementById('detail-icon-preview').innerHTML = `<i class="bi ${menu.icon || 'bi-grid'}"></i>`;
      document.getElementById('detail-menu-type-badge').innerText = menu.type || 'Module';

      const statusBadge = document.getElementById('detail-menu-status-badge');
      if (statusBadge) {
        const isInactive = (menu.status || 'ACTIVE').toUpperCase() === 'INACTIVE';
        statusBadge.className = isInactive ? 'badge bg-danger-subtle text-danger border border-danger-subtle' : 'badge bg-success-subtle text-success border border-success-subtle';
        statusBadge.innerText = isInactive ? 'INACTIVE' : 'ACTIVE';
      }
    },

    openEditFromDetail: function () {
      if (this.selectedMenuDetailId) {
        this.openEditMenuModal(this.selectedMenuDetailId);
      }
    },

    openAddSubFromDetail: function () {
      if (this.selectedMenuDetailId) {
        this.openAddMenuModal(this.selectedMenuDetailId);
      }
    },

    openAddMenuModal: function (parentId) {
      const form = document.getElementById('form-add-menu');
      if (form) form.reset();

      this.populatePermissionDropdowns('', ['new-menu-perm']);
      this.populateParentMenuDropdowns('', ['new-menu-parent']);

      if (parentId) {
        const parentSelect = document.getElementById('new-menu-parent');
        if (parentSelect) parentSelect.value = parentId;

        const typeSelect = document.getElementById('new-menu-type');
        if (typeSelect) typeSelect.value = 'Sub Menu';
      }

      this.updateIconPreviewForModal('new');
      this.showModal('addMenuModal');
    },

    openAddSubMenuModal: function (parentId) {
      this.openAddMenuModal(parentId);
    },

    openEditMenuModal: function (menuId) {
      const menu = (this.menusCache || []).find(m => (m.menu_id === menuId || m.id === menuId));
      if (!menu) return;

      this.populatePermissionDropdowns(menu.permission_code || '', ['edit-menu-perm']);
      this.populateParentMenuDropdowns(menu.parent_id || '', ['edit-menu-parent']);

      document.getElementById('edit-menu-id').value = menu.menu_id || menu.id;
      document.getElementById('edit-menu-code').value = menu.menu_code || menu.code || '';
      document.getElementById('edit-menu-name').value = menu.menu_name || menu.name || '';
      document.getElementById('edit-menu-slug').value = menu.slug || '';
      document.getElementById('edit-menu-type').value = menu.type || 'Module';
      document.getElementById('edit-menu-route').value = menu.route || '';
      document.getElementById('edit-menu-icon').value = menu.icon || 'bi-circle';
      document.getElementById('edit-menu-sort').value = menu.sort_order !== undefined ? menu.sort_order : 1;
      document.getElementById('edit-menu-perm').value = menu.permission_code || 'DASHBOARD_VIEW';
      document.getElementById('edit-menu-status').value = (menu.status || 'ACTIVE').toUpperCase();
      document.getElementById('edit-menu-desc').value = menu.description || '';

      this.updateIconPreviewForModal('edit');
      this.showModal('editMenuModal');
    },

    autoGenerateNewMenuSlug: function () {
      const name = document.getElementById('new-menu-name').value;
      const slugInput = document.getElementById('new-menu-slug');
      if (slugInput && name) {
        slugInput.value = name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');
      }
    },

    autoGenerateEditMenuSlug: function () {
      const name = document.getElementById('edit-menu-name').value;
      const slugInput = document.getElementById('edit-menu-slug');
      if (slugInput && name) {
        slugInput.value = name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');
      }
    },

    updateIconPreviewForModal: function (prefix) {
      const input = document.getElementById(prefix + '-menu-icon');
      const preview = document.getElementById(prefix + '-menu-icon-preview');
      if (input && preview) {
        const iconVal = input.value || 'bi-circle';
        preview.innerHTML = `<i class="bi ${iconVal}"></i>`;
      }
    },

    createMenu: function () {
      const parentId = document.getElementById('new-menu-parent').value;
      const menuCode = document.getElementById('new-menu-code').value;
      const name = document.getElementById('new-menu-name').value;
      const slug = document.getElementById('new-menu-slug').value;
      const type = document.getElementById('new-menu-type').value;
      const route = document.getElementById('new-menu-route').value;
      const icon = document.getElementById('new-menu-icon').value;
      const sortOrder = document.getElementById('new-menu-sort').value;
      const permCode = document.getElementById('new-menu-perm').value;
      const status = document.getElementById('new-menu-status').value;
      const desc = document.getElementById('new-menu-desc').value;

      if (!name || !route || !menuCode) return alert('Kode Menu, Nama Menu, dan Route wajib diisi!');

      const payload = {
        parent_id: parentId,
        menu_code: menuCode,
        menu_name: name,
        slug: slug,
        type: type,
        route: route,
        icon: icon,
        sort_order: Number(sortOrder) || 1,
        permission_code: permCode,
        status: status,
        description: desc,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      };

      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('addMenuModal');
          this.loadMenusTable();
          this.loadSidebarMenu();
        } else alert('Gagal membuat menu: ' + res.message);
      }).apiCreateMenu(payload);
    },

    submitUpdateMenu: function () {
      const menuId = document.getElementById('edit-menu-id').value;
      const parentId = document.getElementById('edit-menu-parent').value;
      const menuCode = document.getElementById('edit-menu-code').value;
      const name = document.getElementById('edit-menu-name').value;
      const slug = document.getElementById('edit-menu-slug').value;
      const type = document.getElementById('edit-menu-type').value;
      const route = document.getElementById('edit-menu-route').value;
      const icon = document.getElementById('edit-menu-icon').value;
      const sortOrder = document.getElementById('edit-menu-sort').value;
      const permCode = document.getElementById('edit-menu-perm').value;
      const status = document.getElementById('edit-menu-status').value;
      const desc = document.getElementById('edit-menu-desc').value;

      if (!menuId || !name || !route || !menuCode) return alert('Menu ID, Kode Menu, Nama Menu, dan Route wajib diisi!');

      const payload = {
        menu_id: menuId,
        parent_id: parentId,
        menu_code: menuCode,
        menu_name: name,
        slug: slug,
        type: type,
        route: route,
        icon: icon,
        sort_order: Number(sortOrder) || 1,
        permission_code: permCode,
        status: status,
        description: desc,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      };

      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('editMenuModal');
          this.loadMenusTable();
          this.loadSidebarMenu();
          if (this.selectedMenuDetailId === menuId) {
            this.showMenuDetail(menuId);
          }
        } else alert('Gagal memperbarui menu: ' + res.message);
      }).apiUpdateMenu(payload);
    },

    filterMenuTree: function () {
      const query = (document.getElementById('menu-search-input').value || '').toLowerCase();
      if (!query) return this.renderMenusTreeTable(this.menusCache);

      const filtered = (this.menusCache || []).filter(m => 
        (m.menu_name || m.name || '').toLowerCase().includes(query) ||
        (m.menu_code || m.code || '').toLowerCase().includes(query) ||
        (m.route || '').toLowerCase().includes(query)
      );
      this.menuPagination.page = 1;
      this.renderMenusTreeTable(filtered);
    },

    filterMenuStatus: function (statusVal) {
      if (statusVal === 'ALL') return this.renderMenusTreeTable(this.menusCache);
      const filtered = (this.menusCache || []).filter(m => String(m.status || 'ACTIVE').toUpperCase() === statusVal);
      this.menuPagination.page = 1;
      this.renderMenusTreeTable(filtered);
    },

    filterMenuParent: function () {
      const filterVal = document.getElementById('menu-parent-filter').value;
      if (filterVal === 'ALL') return this.renderMenusTreeTable(this.menusCache);
      if (filterVal === 'TOP') {
        const filtered = (this.menusCache || []).filter(m => !m.parent_id);
        this.menuPagination.page = 1;
        return this.renderMenusTreeTable(filtered);
      }
    },

    deleteMenu: function (menuId) {
      if (!confirm('Hapus menu ini dari hierarki?')) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.loadMenusTable();
          this.loadSidebarMenu();
        } else alert('Gagal: ' + res.message);
      }).apiDeleteMenu({ menu_id: menuId, actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    initDashboardChart: function () {
      // Update My Information & Welcome Header
      if (this.state.user) {
        const u = this.state.user;
        const wTitle = document.getElementById('dash-welcome-title');
        if (wTitle) wTitle.innerText = `Welcome back, ${u.name || 'Administrator'}! 👋`;
        
        const iName = document.getElementById('info-user-name');
        if (iName) iName.innerText = u.name || 'Administrator';

        const iEmail = document.getElementById('info-user-email');
        if (iEmail) iEmail.innerText = u.email || 'admin@example.com';

        const iRole = document.getElementById('info-user-role');
        if (iRole) iRole.innerText = u.role_id === 'ROLE_SUPER_ADMIN' ? 'Super Administrator' : (u.role_id || 'System Administrator');

        const iLogin = document.getElementById('info-user-login');
        if (iLogin) iLogin.innerText = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'medium' }) + ' WIB';
      }

      google.script.run.withSuccessHandler((res) => {
        if (!res || !res.success || !res.data) return;

        const data = res.data;
        const counts = data.counts || {};
        const actions = data.auditByAction || {};
        const modules = data.auditByModule || {};
        const trend = data.loginTrend || {};

        // Update Stat Cards Counts
        const renewalAlert = document.getElementById('renewal-warning-alert');
        const renewalText = document.getElementById('renewal-warning-text');
        if (renewalAlert && renewalText) {
          if (data.renewalWarning) {
            renewalText.innerText = data.renewalWarning.message;
            renewalAlert.classList.remove('d-none');
          } else {
            renewalAlert.classList.add('d-none');
          }
        }

        const cMenu = document.getElementById('dash-count-menu');
        if (cMenu) cMenu.innerText = counts.menus || 0;

        const cRole = document.getElementById('dash-count-role');
        if (cRole) cRole.innerText = counts.roles || 0;

        const cUser = document.getElementById('dash-count-user');
        if (cUser) cUser.innerText = counts.users || 0;

        const cPerm = document.getElementById('dash-count-perm');
        if (cPerm) cPerm.innerText = counts.permissions || 0;

        const cAudit = document.getElementById('dash-count-audit');
        if (cAudit) cAudit.innerText = (counts.audit || 0).toLocaleString();

        // 1. Chart Application Data Overview (Bar Chart)
        const ctxOverview = document.getElementById('chartAppOverview');
        if (ctxOverview) {
          if (this.chartOverviewInstance) this.chartOverviewInstance.destroy();
          this.chartOverviewInstance = new Chart(ctxOverview, {
            type: 'bar',
            data: {
              labels: ['Menu', 'Role', 'User', 'Permission'],
              datasets: [{
                label: 'Jumlah Entri',
                data: [counts.menus || 0, counts.roles || 0, counts.users || 0, counts.permissions || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316'],
                borderRadius: 6,
                barThickness: 32
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }

        // 2. Chart Audit Activity by Action (Bar Chart)
        const ctxAction = document.getElementById('chartAuditAction');
        if (ctxAction) {
          if (this.chartActionInstance) this.chartActionInstance.destroy();
          this.chartActionInstance = new Chart(ctxAction, {
            type: 'bar',
            data: {
              labels: ['Login', 'View', 'Insert', 'Update', 'Delete', 'Logout'],
              datasets: [{
                label: 'Aktivitas Hari Ini',
                data: [actions.LOGIN || 0, actions.VIEW || 0, actions.INSERT || 0, actions.UPDATE || 0, actions.DELETE || 0, actions.LOGOUT || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316', '#ef4444', '#14b8a6'],
                borderRadius: 6,
                barThickness: 28
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }

        // 3. Chart Audit Activity by Module (Horizontal Bar Chart)
        const ctxModule = document.getElementById('chartAuditModule');
        if (ctxModule) {
          if (this.chartModuleInstance) this.chartModuleInstance.destroy();
          this.chartModuleInstance = new Chart(ctxModule, {
            type: 'bar',
            data: {
              labels: ['USER', 'ROLE', 'MENU', 'PERMISSION', 'AUDIT'],
              datasets: [{
                label: 'Aktivitas Modul',
                data: [modules.USER || 0, modules.ROLE || 0, modules.MENU || 0, modules.PERMISSION || 0, modules.AUDIT || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316', '#14b8a6'],
                borderRadius: 6,
                barThickness: 16
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                y: { grid: { display: false } }
              }
            }
          });
        }

        // 4. Chart Login Trend (Last 7 Days) (Line Chart)
        const ctxTrend = document.getElementById('chartLoginTrend');
        if (ctxTrend) {
          if (this.chartTrendInstance) this.chartTrendInstance.destroy();
          this.chartTrendInstance = new Chart(ctxTrend, {
            type: 'line',
            data: {
              labels: trend.labels || ['14 Mei', '15 Mei', '16 Mei', '17 Mei', '18 Mei', '19 Mei', '20 Mei'],
              datasets: [{
                label: 'Login User',
                data: trend.data || [10, 8, 15, 12, 18, 14, 16],
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.08)',
                pointBackgroundColor: '#2563eb',
                pointRadius: 4,
                fill: true,
                tension: 0.4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }
      }).apiGetDashboardData({ actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    AEF.init();
  });
</script>
