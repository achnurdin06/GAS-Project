<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
<!-- Chart.js for Dashboard (Canvas-based) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  /**
   * AppScript Enterprise Framework (AEF) Client Engine
   */
  const AEF = {
    state: {
      user: null,
      session: null,
      permissions: [],
      currentRoute: '/dashboard'
    },

    init: function () {
      this.checkSessionState();
      
      // Global manual tab switching fallback when bootstrap is not defined
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-bs-toggle="tab"]');
        if (btn && typeof bootstrap === 'undefined') {
          e.preventDefault();
          const targetId = btn.getAttribute('data-bs-target');
          if (targetId) {
            const nav = btn.closest('.nav-tabs');
            if (nav) {
              nav.querySelectorAll('[data-bs-toggle="tab"]').forEach(b => b.classList.remove('active'));
            }
            btn.classList.add('active');
            
            const pane = document.querySelector(targetId);
            if (pane) {
              const parent = pane.parentElement;
              if (parent) {
                parent.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('show', 'active'));
              }
              pane.classList.add('show', 'active');
            }
          }
        }
      });
    },

    toggleProfileDropdown: function (event) {
      event.stopPropagation();
      const dropdown = document.querySelector('.dropdown-menu[aria-labelledby="profileDropdown"]');
      if (dropdown) {
        dropdown.classList.toggle('show');
      }
    },

    checkSessionState: function () {
      const stored = localStorage.getItem('AEF_AUTH_DATA');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          this.state.user = parsed.user;
          this.state.session = parsed.session;
          this.state.permissions = parsed.permissions;
          this.showAppShell();
          this.loadSidebarMenu();
          this.navigateTo('/dashboard');
          return;
        } catch (e) {
          localStorage.removeItem('AEF_AUTH_DATA');
        }
      }
      this.showLoginShell();
    },

    showLoginShell: function () {
      document.getElementById('aef-app-shell').classList.add('d-none-important');
      document.getElementById('aef-login-shell').classList.remove('d-none-important');
    },

    showAppShell: function () {
      document.getElementById('aef-login-shell').classList.add('d-none-important');
      document.getElementById('aef-app-shell').classList.remove('d-none-important');
      if (this.state.user) {
        document.getElementById('user-display-name').innerText = this.state.user.name;
        const displayEmail = document.getElementById('user-display-email');
        if (displayEmail) displayEmail.innerText = this.state.user.email;

        const dropdownName = document.getElementById('dropdown-user-name');
        const dropdownEmail = document.getElementById('dropdown-user-email');
        if (dropdownName) dropdownName.innerText = this.state.user.name;
        if (dropdownEmail) dropdownEmail.innerText = this.state.user.email;

        // Render header profile avatar/image
        const headerInitials = document.getElementById('header-avatar-initials');
        const headerImg = document.getElementById('header-avatar-img');
        if (headerInitials && headerImg) {
          if (this.state.user.profile_pic_url) {
            headerImg.src = this.state.user.profile_pic_url;
            headerImg.classList.remove('d-none');
            headerInitials.classList.add('d-none');
          } else {
            headerImg.src = '';
            headerImg.classList.add('d-none');
            headerInitials.classList.remove('d-none');
            headerInitials.innerText = this.state.user.name ? this.state.user.name.substring(0, 2).toUpperCase() : 'A';
          }
        }
      }
    },

    showLoginFormPanel: function (panelName) {
      // Hide all panels
      document.getElementById('login-form-container').classList.add('d-none');
      document.getElementById('twofa-form-container').classList.add('d-none');
      document.getElementById('forgot-form-container').classList.add('d-none');
      document.getElementById('register-form-container').classList.add('d-none');
      
      // Clear alert messages
      const errorAlert = document.getElementById('login-error-alert');
      const successAlert = document.getElementById('login-success-alert');
      errorAlert.classList.add('d-none');
      successAlert.classList.add('d-none');

      // Show targeted panel
      if (panelName === 'login') {
        document.getElementById('login-form-container').classList.remove('d-none');
      } else if (panelName === 'twofa') {
        document.getElementById('twofa-form-container').classList.remove('d-none');
      } else if (panelName === 'forgot') {
        document.getElementById('forgot-form-container').classList.remove('d-none');
      } else if (panelName === 'register') {
        document.getElementById('register-form-container').classList.remove('d-none');
      }
    },

    login: function (email, password) {
      const btn = document.getElementById('btn-login-submit');
      const errorAlert = document.getElementById('login-error-alert');
      const loader = document.getElementById('login-loader-bar');
      errorAlert.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
      if (loader) loader.classList.remove('d-none');

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
          if (loader) loader.classList.add('d-none');
          if (res.success) {
            if (res.data && res.data.require_2fa) {
              // Redirect to 2FA layout
              this.state.pending2FAEmail = email;
              this.showLoginFormPanel('twofa');
              document.getElementById('twofa-email-display').innerText = email;
              document.getElementById('twofa-code').value = '';
              document.getElementById('twofa-error-alert').classList.add('d-none');
            } else {
              this.state.user = res.data.user;
              this.state.session = res.data.session;
              this.state.permissions = res.data.permissions;
              localStorage.setItem('AEF_AUTH_DATA', JSON.stringify(res.data));
              this.showAppShell();
              this.loadSidebarMenu();
              this.navigateTo('/dashboard');
            }
          } else {
            errorAlert.innerText = res.message || 'Login Gagal';
            errorAlert.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
          if (loader) loader.classList.add('d-none');
          errorAlert.innerText = 'Error: ' + err.message;
          errorAlert.classList.remove('d-none');
        })
        .apiLogin({ email, password });
    },

    verify2FA: function (otpCode) {
      const btn = document.getElementById('btn-twofa-submit');
      const errorAlert = document.getElementById('twofa-error-alert');
      const loader = document.getElementById('login-loader-bar');
      errorAlert.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';
      if (loader) loader.classList.remove('d-none');

      const email = this.state.pending2FAEmail;

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML = 'Verifikasi & Masuk';
          if (loader) loader.classList.add('d-none');
          if (res.success) {
            this.state.user = res.data.user;
            this.state.session = res.data.session;
            this.state.permissions = res.data.permissions;
            localStorage.setItem('AEF_AUTH_DATA', JSON.stringify(res.data));
            
            document.getElementById('twofa-form-container').classList.add('d-none');
            document.getElementById('login-form-container').classList.remove('d-none');
            document.getElementById('twofa-code').value = '';
            this.state.pending2FAEmail = null;

            this.showAppShell();
            this.loadSidebarMenu();
            this.navigateTo('/dashboard');
          } else {
            errorAlert.innerText = res.message || 'Verification Failed';
            errorAlert.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML = 'Verifikasi & Masuk';
          if (loader) loader.classList.add('d-none');
          errorAlert.innerText = 'Error: ' + err.message;
          errorAlert.classList.remove('d-none');
        })
        .apiVerify2FA({ email, otpCode });
    },

    submitForgotPassword: function (email) {
      const btn = document.getElementById('btn-forgot-submit');
      const errorAlert = document.getElementById('login-error-alert');
      const successAlert = document.getElementById('login-success-alert');
      const loader = document.getElementById('login-loader-bar');
      errorAlert.classList.add('d-none');
      successAlert.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';
      if (loader) loader.classList.remove('d-none');

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML = 'Kirim Password Baru';
          if (loader) loader.classList.add('d-none');
          if (res.success) {
            successAlert.innerText = res.message;
            successAlert.classList.remove('d-none');
            document.getElementById('forgot-email').value = '';
            setTimeout(() => {
              this.showLoginFormPanel('login');
            }, 5000);
          } else {
            errorAlert.innerText = res.message;
            errorAlert.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML = 'Kirim Password Baru';
          if (loader) loader.classList.add('d-none');
          errorAlert.innerText = 'Error: ' + err.message;
          errorAlert.classList.remove('d-none');
        })
        .apiForgotPassword({ email });
    },

    submitRegister: function (payload) {
      const btn = document.getElementById('btn-register-submit');
      const errorAlert = document.getElementById('login-error-alert');
      const successAlert = document.getElementById('login-success-alert');
      const loader = document.getElementById('login-loader-bar');
      errorAlert.classList.add('d-none');
      successAlert.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registering...';
      if (loader) loader.classList.remove('d-none');

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML = 'Daftarkan Akun';
          if (loader) loader.classList.add('d-none');
          if (res.success) {
            successAlert.innerText = res.message;
            successAlert.classList.remove('d-none');
            // Clear inputs
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-phone').value = '';
            document.getElementById('reg-password').value = '';
            setTimeout(() => {
              this.showLoginFormPanel('login');
            }, 5000);
          } else {
            errorAlert.innerText = res.message;
            errorAlert.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML = 'Daftarkan Akun';
          if (loader) loader.classList.add('d-none');
          errorAlert.innerText = 'Error: ' + err.message;
          errorAlert.classList.remove('d-none');
        })
        .apiRegisterUser(payload);
    },

    cancel2FA: function () {
      document.getElementById('twofa-form-container').classList.add('d-none');
      document.getElementById('login-form-container').classList.remove('d-none');
      document.getElementById('twofa-code').value = '';
      this.state.pending2FAEmail = null;
    },

    getFileBase64: function (fileInputId) {
      return new Promise((resolve) => {
        const input = document.getElementById(fileInputId);
        if (!input || !input.files || input.files.length === 0) {
          resolve({ base64: null, name: null });
          return;
        }
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function (e) {
          resolve({ base64: e.target.result, name: file.name });
        };
        reader.onerror = function () {
          resolve({ base64: null, name: null });
        };
        reader.readAsDataURL(file);
      });
    },

    showToast: function (message, type = 'success') {
      const containerId = 'aef-toast-container';
      let container = document.getElementById(containerId);
      if (!container) {
        container = document.createElement('div');
        container.id = containerId;
        container.className = 'toast-container position-fixed bottom-0 end-0 p-3';
        container.style.zIndex = '9999';
        document.body.appendChild(container);
      }

      const toastId = 'toast-' + Date.now();
      const bgClass = type === 'success' ? 'bg-success text-white' : 'bg-danger text-white';
      const icon = type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';
      
      const toastHtml = `
        <div id="${toastId}" class="toast align-items-center ${bgClass} border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
              <i class="bi ${icon} fs-5"></i>
              <span>${message}</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      `;

      container.insertAdjacentHTML('beforeend', toastHtml);
      const toastEl = document.getElementById(toastId);
      
      if (typeof bootstrap !== 'undefined' && bootstrap.Toast) {
        const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => {
          toastEl.remove();
        });
      } else {
        toastEl.classList.add('show');
        setTimeout(() => {
          toastEl.classList.remove('show');
          setTimeout(() => toastEl.remove(), 300);
        }, 4000);
      }
    },

    logout: function () {
      this.handleLogout();
    },

    handleLogout: function () {
      // 1. Create and show full screen loading overlay
      const loader = document.createElement('div');
      loader.className = 'logout-loader-overlay';
      loader.id = 'logout-loader';
      loader.innerHTML = `
        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <h5 class="fw-bold text-dark mb-1">Logging Out...</h5>
        <p class="text-muted small">Menghapus sesi Anda secara aman...</p>
      `;
      document.body.appendChild(loader);

      // 2. Call server-side logout
      google.script.run
        .withSuccessHandler(() => {
          this.completeClientLogout();
        })
        .withFailureHandler(() => {
          this.completeClientLogout();
        })
        .apiLogout({
          session_id: this.state.session ? this.state.session.session_id : '',
          user_id: this.state.user ? this.state.user.id : ''
        });
    },

    completeClientLogout: function () {
      // Clear client state
      this.state.user = null;
      this.state.session = null;
      this.state.permissions = [];
      localStorage.removeItem('AEF_AUTH_DATA');

      setTimeout(() => {
        // Remove loader overlay
        const loader = document.getElementById('logout-loader');
        if (loader) loader.remove();
        // Redirect to login shell
        this.showLoginShell();
      }, 1000); // 1-second delay for smooth animation
    },

    showProfileDetails: function () {
      const u = this.state.user;
      if (!u) return;

      const formatDateString = (dateStr) => {
        if (!dateStr) return '-';
        try {
          const d = new Date(dateStr);
          if (isNaN(d.getTime())) return dateStr;
          return d.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {
          return dateStr;
        }
      };

      document.getElementById('profile-modal-name').textContent = u.name || '-';
      document.getElementById('profile-modal-role').textContent = u.role_code || 'GUEST';
      document.getElementById('profile-modal-email').textContent = u.email || '-';
      
      const statusBadge = document.getElementById('profile-modal-status');
      if (statusBadge) {
        const statusVal = (u.status || 'ACTIVE').toUpperCase();
        statusBadge.textContent = statusVal;
        if (statusVal === 'ACTIVE') {
          statusBadge.className = 'badge bg-success py-1 px-2 text-white';
        } else {
          statusBadge.className = 'badge bg-danger py-1 px-2 text-white';
        }
      }

      const expEl = document.getElementById('profile-modal-expired');
      if (expEl) {
        if (u.expired_at) {
          expEl.textContent = formatDateString(u.expired_at);
        } else {
          expEl.textContent = 'Selamanya (Permanent)';
        }
      }

      const createdEl = document.getElementById('profile-modal-created');
      if (createdEl) {
        createdEl.textContent = u.created_at ? formatDateString(u.created_at) : '-';
      }

      const modalInitials = document.getElementById('profile-modal-avatar-initials');
      const modalImg = document.getElementById('profile-modal-avatar-img');
      if (modalInitials && modalImg) {
        if (u.profile_pic_url) {
          modalImg.src = u.profile_pic_url;
          modalImg.classList.remove('d-none');
          modalInitials.classList.add('d-none');
        } else {
          modalImg.src = '';
          modalImg.classList.add('d-none');
          modalInitials.classList.remove('d-none');
          modalInitials.textContent = u.name ? u.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'US';
        }
      }

      this.showModal('userProfileModal');
    },

    loadSidebarMenu: function () {
      const navContainer = document.getElementById('aef-sidebar-nav');
      if (!navContainer) return;
      navContainer.innerHTML = '<div class="text-center p-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div>';

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success && Array.isArray(res.data)) {
            let html = '';
            
            // Fixed Dashboard link at top of sidebar
            html += `
              <a href="#" class="aef-nav-link" onclick="AEF.navigateTo('/dashboard'); return false;" id="nav-item-dashboard">
                <div class="aef-nav-left">
                  <i class="bi bi-grid-1x2-fill"></i>
                  <span>Dashboard</span>
                </div>
              </a>
            `;

            res.data.forEach(item => {
              const route = item.route || (item.slug ? '/' + item.slug : '#');
              const menuTitle = item.name || item.menu_name || item.code || 'Menu';
              const menuCode = item.code || item.menu_code || item.id;

              // Ensure Dashboard is not duplicated
              if (route === '/dashboard' || item.slug === 'dashboard' || item.menu_code === 'MENU_DASHBOARD' || menuTitle === 'Dashboard') {
                return;
              }

              // If the menu item has children (Parent Module), render section title & child items
              if (Array.isArray(item.children) && item.children.length > 0) {
                html += `<div class="aef-sidebar-section-title mt-3">${menuTitle.toUpperCase()}</div>`;
                item.children.forEach(child => {
                  const childRoute = child.route || (child.slug ? '/' + child.slug : '#');
                  const childTitle = child.name || child.menu_name || child.code || 'Submenu';
                  const childCode = child.code || child.menu_code || child.id;
                  const childIcon = child.icon || 'bi-circle';
                  html += `
                    <a href="#" class="aef-nav-link" onclick="AEF.navigateTo('${childRoute}'); return false;" id="nav-item-${childCode}">
                      <div class="aef-nav-left">
                        <i class="bi ${childIcon}"></i>
                        <span>${childTitle}</span>
                      </div>
                    </a>
                  `;
                });
              } else {
                const iconClass = item.icon || 'bi-circle';
                html += `
                  <a href="#" class="aef-nav-link" onclick="AEF.navigateTo('${route}'); return false;" id="nav-item-${menuCode}">
                    <div class="aef-nav-left">
                      <i class="bi ${iconClass}"></i>
                      <span>${menuTitle}</span>
                    </div>
                  </a>
                `;
              }
            });
            navContainer.innerHTML = html;
          }
        })
        .withFailureHandler((err) => {
          navContainer.innerHTML = '<div class="text-danger small p-2">Gagal memuat menu.</div>';
        })
        .apiGetMenu({ actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    hasPermission: function (requiredPermission) {
      if (!this.state.user) return false;
      const userRole = String(this.state.user.role_id).trim().toUpperCase();
      if (userRole === 'ROLE_SUPER_ADMIN' || userRole === 'ROLE_ADMIN') return true;
      return Array.isArray(this.state.permissions) && this.state.permissions.includes(requiredPermission);
    },

    switchTab: function (triggerElementOrId) {
      let trigger = typeof triggerElementOrId === 'string' ? document.getElementById(triggerElementOrId) : triggerElementOrId;
      if (!trigger) return;

      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Tab) {
          const tab = bootstrap.Tab.getOrCreateInstance(trigger);
          tab.show();
          return;
        }
      } catch (e) {
        console.warn('Bootstrap Tab trigger failed, using manual fallback', e);
      }

      // Manual Fallback
      const targetId = trigger.getAttribute('data-bs-target');
      if (!targetId) return;
      const targetPane = document.querySelector(targetId);
      if (!targetPane) return;

      // Deactivate all sibling triggers in the same tab list
      const nav = trigger.closest('.nav-tabs');
      if (nav) {
        nav.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      }
      trigger.classList.add('active');

      // Deactivate all sibling panes in the same tab content
      const tabContent = targetPane.closest('.tab-content');
      if (tabContent) {
        tabContent.querySelectorAll('.tab-pane').forEach(el => {
          el.classList.remove('show', 'active');
        });
      }
      targetPane.classList.add('show', 'active');
    },

    navigateTo: function (route) {
      this.state.currentRoute = route;

      const contentCanvas = document.getElementById('aef-main-content');
      if (!contentCanvas) return;

      // 1. Route guarding validation
      const routePermissions = {
        '/users': 'USER_VIEW',
        '/roles': 'ROLE_VIEW',
        '/permissions': 'PERMISSION_VIEW',
        '/config': 'CONFIG_VIEW',
        '/audit': 'AUDIT_VIEW',
        '/menus': 'MENU_VIEW'
      };

      const requiredPerm = routePermissions[route];
      if (requiredPerm) {
        const userRole = this.state.user ? String(this.state.user.role_id).trim().toUpperCase() : '';
        const isSuperOrAdmin = (userRole === 'ROLE_SUPER_ADMIN' || userRole === 'ROLE_ADMIN');
        const hasPerm = isSuperOrAdmin || (this.state.permissions && this.state.permissions.includes(requiredPerm));

        if (!hasPerm) {
          contentCanvas.innerHTML = `
            <div class="aef-card text-center py-5 border-0 shadow-sm" style="border-radius: 0.5rem; background-color: #ffffff; margin-top: 1rem;">
              <div class="mx-auto bg-light-danger rounded-circle d-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px; background-color: #ffeef0;">
                <i class="bi bi-shield-slash text-danger" style="font-size: 2.2rem; color: #f1416c;"></i>
              </div>
              <h4 class="fw-bold mt-3 text-dark" style="color: #181c32;">Akses Ditolak</h4>
              <p class="text-muted mx-auto px-4" style="max-width: 500px;">Anda tidak memiliki hak otorisasi (hak akses <code>${requiredPerm}</code>) untuk melihat halaman ini. Silakan hubungi administrator jika Anda merasa ini adalah kesalahan.</p>
            </div>
          `;
          return;
        }
      }

      // Active state highlight
      document.querySelectorAll('.aef-nav-link').forEach(el => el.classList.remove('active'));
      const activeNav = document.querySelector(`.aef-nav-link[onclick*="${route}"]`);
      if (activeNav) activeNav.classList.add('active');
      
      if (route === '/dashboard') {
        contentCanvas.innerHTML = document.getElementById('tpl-dashboard').innerHTML;
        this.initDashboardChart();
      } else if (route === '/users') {
        contentCanvas.innerHTML = document.getElementById('tpl-users').innerHTML;
        this.loadUsersTable();
      } else if (route === '/roles') {
        contentCanvas.innerHTML = document.getElementById('tpl-roles').innerHTML;
        this.loadRolesTable();
      } else if (route === '/permissions') {
        contentCanvas.innerHTML = document.getElementById('tpl-permissions').innerHTML;
        this.loadPermissionsTable();
      } else if (route === '/config') {
        contentCanvas.innerHTML = document.getElementById('tpl-config').innerHTML;
        this.loadConfigsTable();
      } else if (route === '/audit') {
        contentCanvas.innerHTML = document.getElementById('tpl-audit').innerHTML;
        this.loadAuditLogsTable();
      } else if (route === '/menus') {
        contentCanvas.innerHTML = document.getElementById('tpl-menus').innerHTML;

    // PAGINATION ENGINE
    paginationState: {
      users: { page: 1, pageSize: 20, data: [] },
      roles: { page: 1, pageSize: 20, data: [] },
      perms: { page: 1, pageSize: 20, data: [] },
      configs: { page: 1, pageSize: 5, data: [] },
      audit: { page: 1, pageSize: 5, data: [] },
      menus: { page: 1, pageSize: 5, data: [] },
      userDetailRecentLogs: { page: 1, pageSize: 20, data: [] },
      userDetailFullLogs: { page: 1, pageSize: 20, data: [] }
    },

    renderTablePagination: function (key, renderRowFn, tbodyId, infoId, controlsId) {
      const state = this.paginationState[key];
      if (!state) return;

      const tbody = document.getElementById(tbodyId);
      const infoElem = document.getElementById(infoId);
      const controlsElem = document.getElementById(controlsId);
      if (!tbody) return;

      const data = state.data || [];
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">Tidak ada data ditemukan.</td></tr>';
        if (infoElem) infoElem.innerText = 'Showing 0 to 0 of 0 entries';
        if (controlsElem) controlsElem.innerHTML = '';
        return;
      }

      const totalItems = data.length;
      const pageSize = state.pageSize || 5;
      const totalPages = Math.ceil(totalItems / pageSize);
      state.page = Math.max(1, Math.min(state.page || 1, totalPages));
      const currentPage = state.page;

      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, totalItems);
      const pageSlice = data.slice(startIdx, endIdx);

      let rowsHtml = '';
      pageSlice.forEach((item, idx) => {
        rowsHtml += renderRowFn(item, startIdx + idx);
      });
      tbody.innerHTML = rowsHtml;

      if (infoElem) {
        infoElem.innerText = `Showing ${startIdx + 1} to ${endIdx} of ${totalItems} entries`;
      }

      if (controlsElem) {
        let html = '';
        const prevDisabled = currentPage === 1 ? 'disabled' : '';
        html += `<li class="page-item ${prevDisabled}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${currentPage - 1}); return false;">Prev</a></li>`;

        for (let p = 1; p <= totalPages; p++) {
          const activeClass = p === currentPage ? 'active' : '';
          html += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${p}); return false;">${p}</a></li>`;
        }

        const nextDisabled = currentPage === totalPages ? 'disabled' : '';
        html += `<li class="page-item ${nextDisabled}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${currentPage + 1}); return false;">Next</a></li>`;

        controlsElem.innerHTML = html;
      }
    },

    changeTablePage: function (key, newPage) {
      if (!this.paginationState[key]) return;
      this.paginationState[key].page = newPage;
      if (key === 'users') this.renderUsersPage();
      else if (key === 'roles') this.renderRolesPage();
      else if (key === 'perms') this.renderPermissionsPage();
      else if (key === 'configs') this.renderConfigsPage();
      else if (key === 'audit') this.renderAuditPage();
      else if (key === 'menus') this.renderMenusPage();
      else if (key === 'userDetailRecentLogs') this.renderUserDetailRecentLogsPage();
      else if (key === 'userDetailFullLogs') this.renderUserDetailFullLogsPage();
    },

    handleUsersSort: function (colName) {
      if (!this.state.usersSort) {
        this.state.usersSort = { column: 'name', asc: true };
      }
      if (this.state.usersSort.column === colName) {
        this.state.usersSort.asc = !this.state.usersSort.asc;
      } else {
        this.state.usersSort.column = colName;
        this.state.usersSort.asc = true;
      }
      this.applyUsersFiltersAndSort();
    },

    applyUsersFiltersAndSort: function () {
      let filtered = [...(this.usersCache || [])];

      // 1. Global Search Filter
      const query = (document.getElementById('users-search')?.value || '').trim().toLowerCase();
      if (query) {
        filtered = filtered.filter(u => {
          return (
            String(u.name || '').toLowerCase().includes(query) ||
            String(u.email || '').toLowerCase().includes(query) ||
            String(u.phone || '').toLowerCase().includes(query) ||
            String(u.role_id || '').toLowerCase().includes(query) ||
            String(u.status || '').toLowerCase().includes(query) ||
            String(u.expired_at || '').toLowerCase().includes(query)
          );
        });
      }

      // 2. Column-specific filters (only active if row is visible)
      const filterRow = document.getElementById('users-filter-row');
      if (filterRow && !filterRow.classList.contains('d-none')) {
        const filterName = (document.getElementById('users-filter-name')?.value || '').trim().toLowerCase();
        const filterEmail = (document.getElementById('users-filter-email')?.value || '').trim().toLowerCase();
        const filterPhone = (document.getElementById('users-filter-phone')?.value || '').trim().toLowerCase();
        const filterRole = (document.getElementById('users-filter-role_id')?.value || '').trim().toLowerCase();
        const filterStatus = (document.getElementById('users-filter-status')?.value || '').trim().toLowerCase();
        const filterExpired = (document.getElementById('users-filter-expired_at')?.value || '').trim().toLowerCase();

        if (filterName) filtered = filtered.filter(u => String(u.name || '').toLowerCase().includes(filterName));
        if (filterEmail) filtered = filtered.filter(u => String(u.email || '').toLowerCase().includes(filterEmail));
        if (filterPhone) filtered = filtered.filter(u => String(u.phone || '').toLowerCase().includes(filterPhone));
        if (filterRole) filtered = filtered.filter(u => String(u.role_id || '').toLowerCase().includes(filterRole));
        if (filterStatus) filtered = filtered.filter(u => String(u.status || '').toLowerCase().includes(filterStatus));
        if (filterExpired) filtered = filtered.filter(u => String(u.expired_at || '').toLowerCase().includes(filterExpired));
      }

      // 3. Sorting
      if (this.state.usersSort) {
        const col = this.state.usersSort.column;
        const asc = this.state.usersSort.asc;
        filtered.sort((a, b) => {
          let valA = String(a[col] || '').toLowerCase();
          let valB = String(b[col] || '').toLowerCase();

          if (!isNaN(valA) && !isNaN(valB)) {
            valA = Number(valA);
            valB = Number(valB);
          }

          if (valA < valB) return asc ? -1 : 1;
          if (valA > valB) return asc ? 1 : -1;
          return 0;
        });
      } else {
        // Default sort by name asc
        filtered.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      }

      this.paginationState.users.data = filtered;
      this.paginationState.users.page = 1;
      this.renderUsersPage();

      // Update header sorting icons
      const cols = ['name', 'email', 'phone', 'role_id', 'status', 'expired_at'];
      cols.forEach(c => {
        const icon = document.getElementById(`users-sort-icon-${c}`);
        if (icon) {
          if (this.state.usersSort && this.state.usersSort.column === c) {
            icon.className = this.state.usersSort.asc ? 'bi bi-sort-up ms-1' : 'bi bi-sort-down ms-1';
            icon.style.color = '#2563eb';
            icon.classList.remove('opacity-50', 'text-muted');
          } else {
            icon.className = 'bi bi-arrow-down-up ms-1 text-muted opacity-50';
            icon.style.color = '';
          }
        }
      });
    },

    showModal: function (modalId) {
      if (modalId === 'addUserModal') {
        this.populateRoleDropdowns('', ['new-user-role']);
        // Pre-set new-user-expired-at to 1 year from now
        const oneYearFromNow = new Date();
        oneYearFromNow.setFullYear(oneYearFromNow.getFullYear() + 1);
        const yyyy = oneYearFromNow.getFullYear();
        const mm = String(oneYearFromNow.getMonth() + 1).padStart(2, '0');
        const dd = String(oneYearFromNow.getDate()).padStart(2, '0');
        document.getElementById('new-user-expired-at').value = `${yyyy}-${mm}-${dd}`;
        document.getElementById('new-user-profile-pic').value = '';
        document.getElementById('new-user-two-fa').checked = false;
      }
      if (modalId === 'addPermModal') this.populateRoleDropdowns('', ['new-perm-role']);
      if (modalId === 'addMenuModal') {
        this.populatePermissionDropdowns('', ['new-menu-perm']);
        this.populateParentMenuDropdowns('', ['new-menu-parent']);
      }

      const modalEl = document.getElementById(modalId);
      if (!modalEl) return;
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Modal) {
          let modal = bootstrap.Modal.getInstance(modalEl);
          if (!modal) modal = new bootstrap.Modal(modalEl);
          modal.show();
          return;
        }
      } catch (e) {}

      // Fallback
      modalEl.classList.add('show');
      modalEl.style.display = 'block';
      document.body.classList.add('modal-open');
    },

    populateRoleDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Pilih Role --</option>';
            res.data.forEach(r => {
              const isSelected = String(selectedVal).trim().toUpperCase() === String(r.role_code).trim().toUpperCase() ? 'selected' : '';
              options += `<option value="${r.role_code}" ${isSelected}>${r.role_name} (${r.role_code})</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetRoles();
    },

    populatePermissionDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Pilih Permission --</option>';
            res.data.forEach(p => {
              const isSelected = String(selectedVal).trim().toUpperCase() === String(p.permission_code).trim().toUpperCase() ? 'selected' : '';
              options += `<option value="${p.permission_code}" ${isSelected}>${p.permission_name} (${p.permission_code})</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetPermissions();
    },

    populateParentMenuDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Main Top-Level Menu --</option>';
            res.data.forEach(m => {
              const mId = m.menu_id || m.id;
              const isSelected = String(selectedVal).trim() === String(mId).trim() ? 'selected' : '';
              options += `<option value="${mId}" ${isSelected}>${m.menu_name || m.name}</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetAllMenus();
    },

    hideModal: function (modalId) {
      const modalEl = document.getElementById(modalId);
      if (!modalEl) return;
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Modal) {
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
        }
      } catch (e) {}

      // Fallback cleanup
      modalEl.classList.remove('show');
      modalEl.style.display = 'none';
      document.body.classList.remove('modal-open');
      const backdrop = document.querySelector('.modal-backdrop');

    createUser: async function () {
      const name = document.getElementById('new-user-name').value;
      const email = document.getElementById('new-user-email').value;
      const phone = document.getElementById('new-user-phone').value;
      const username = document.getElementById('new-user-username').value;
      const password = document.getElementById('new-user-password').value;
      const roleId = document.getElementById('new-user-role').value;
      const forceChange = document.getElementById('new-user-force-change').checked;
      const expiredAt = document.getElementById('new-user-expired-at').value;
      const twoFaEnabled = document.getElementById('new-user-two-fa').checked;

      if (!name || !email || !password || !username || !expiredAt) {
        alert('Mohon isi semua field wajib termasuk Masa Berlaku!');
        return;
      }

      // Show loader
      const form = document.getElementById('form-add-user');
      const submitBtn = form.querySelector('button[type="submit"]');
      const origText = submitBtn.innerHTML;

      const fileData = await this.getFileBase64('new-user-profile-pic');

      google.script.run
        .withSuccessHandler((res) => {

          submitBtn.innerHTML = origText;

            this.loadUsersTable();
          } else {

          }
        })
        .withFailureHandler((err) => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
          alert('Error: ' + err.message);
        })
        .apiCreateUser({
          name: name,
          email: email,
          phone: phone,
          username: username,
          force_password_change: forceChange,
          password: password,
          role_id: roleId,
          expired_at: expiredAt,
          two_fa_enabled: twoFaEnabled,
          profile_pic_base64: fileData.base64,
          profile_pic_name: fileData.name,
          actor_id: this.state.user ? this.state.user.id : 'SYSTEM'

    openEditUserModal: function (userId) {
      const user = (this.usersCache || []).find(u => u.id === userId);
      if (!user) return;
      document.getElementById('edit-user-id').value = user.id;
      document.getElementById('edit-user-name').value = user.name;
      document.getElementById('edit-user-email').value = user.email;
      document.getElementById('edit-user-phone').value = user.phone || '';
      document.getElementById('edit-user-username').value = user.username || '';
      document.getElementById('edit-user-password').value = '';
      document.getElementById('edit-user-force-change').checked = (user.force_password_change === 1);
      document.getElementById('edit-user-status').value = user.status || 'ACTIVE';
      
      // Load new fields
      if (user.expired_at) {
        document.getElementById('edit-user-expired-at').value = user.expired_at.substring(0, 10);
      } else {
        document.getElementById('edit-user-expired-at').value = '';
      }
      document.getElementById('edit-user-two-fa').checked = (user.two_fa_enabled === 1 || user.two_fa_enabled === '1' || user.two_fa_enabled === true);
      document.getElementById('edit-user-profile-pic').value = '';

      const initials = (user.name || 'US').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('edit-user-avatar').textContent = initials;
      document.getElementById('edit-user-title-text').textContent = `Edit User: ${user.name}`;
      document.getElementById('edit-user-subtitle-text').textContent = `UID: ${user.id.substring(0, 8).toUpperCase()}`;

      // Reset tabs
      const firstTab = document.querySelector('#editUserTabs button:first-child');
      if (firstTab) {

          const tabTrigger = new bootstrap.Tab(firstTab);
          tabTrigger.show();

          // Manual Fallback
          document.querySelectorAll('#editUserTabs button').forEach(b => b.classList.remove('active'));

          }
        }
      }

      this.populateRoleDropdowns(user.role_id, ['edit-user-role']);
      this.showModal('editUserModal');
    },

    showUserDetail: function (userId) {

          imgEl.src = user.profile_pic_url;
          imgEl.classList.remove('d-none');
          textEl.classList.add('d-none');
        } else {

          imgEl.classList.add('d-none');
          textEl.classList.remove('d-none');
          textEl.textContent = initials;
        }
      } else {
        document.getElementById('detail-avatar').textContent = initials;

      document.getElementById('detail-profile-name').textContent = user.name;
      document.getElementById('detail-profile-email').textContent = user.email;
      document.getElementById('detail-profile-phone').textContent = user.phone || '-';

      document.getElementById('detail-info-name').textContent = user.name;
      document.getElementById('detail-info-username').textContent = user.username || '-';
      document.getElementById('detail-info-email').textContent = user.email;
      document.getElementById('detail-info-phone').textContent = user.phone || '-';
      document.getElementById('detail-info-expired').textContent = user.expired_at || '-';
      document.getElementById('detail-info-two-fa').textContent = (user.two_fa_enabled === 1 || user.two_fa_enabled === '1' || user.two_fa_enabled === true) ? 'Aktif' : 'Non-Aktif';
      document.getElementById('detail-info-created').textContent = user.created_at || '-';
      document.getElementById('detail-info-updated').textContent = user.updated_at || '-';

      document.getElementById('detail-access-role').textContent = user.role_id;
      document.getElementById('detail-access-force').checked = (user.force_password_change === 1);

      // Buttons binding
      document.getElementById('detail-edit-btn').onclick = () => this.openEditUserModal(user.id);
      document.getElementById('detail-reset-pass-btn').onclick = () => this.openEditUserModal(user.id);
      document.getElementById('detail-delete-user-btn').onclick = () => this.openDeleteUserModal(user.id);

      // Apply permission checks
      const editBtn = document.getElementById('detail-edit-btn');
      if (editBtn) {
        if (this.hasPermission('USER_UPDATE')) {
          editBtn.classList.remove('d-none');
        } else {
          editBtn.classList.add('d-none');
        }
      }

      const resetPassContainer = document.getElementById('detail-reset-pass-btn').closest('.p-3');
      const deleteUserContainer = document.getElementById('detail-delete-user-btn').closest('.p-3');
      const canUpdate = this.hasPermission('USER_UPDATE');
      const canDelete = this.hasPermission('USER_DELETE');

      if (resetPassContainer) {
        if (canUpdate) {
          resetPassContainer.classList.remove('d-none');
        } else {
          resetPassContainer.classList.add('d-none');
        }
      }
      if (deleteUserContainer) {
        if (canDelete) {
          deleteUserContainer.classList.remove('d-none');
        } else {
          deleteUserContainer.classList.add('d-none');
        }
      }

      const controlTabHeader = document.getElementById('detail-tab-control');
      if (controlTabHeader) {
        if (canUpdate || canDelete) {
          controlTabHeader.parentElement.classList.remove('d-none');
        } else {
          controlTabHeader.parentElement.classList.add('d-none');
        }
      }

      // Reset tabs on detail view
      const firstTab = document.querySelector('#userDetailTabs button:first-child');
      if (firstTab) {
        if (typeof bootstrap !== 'undefined' && bootstrap.Tab) {
          const tabTrigger = new bootstrap.Tab(firstTab);
          tabTrigger.show();
        } else {
          // Manual Fallback
          document.querySelectorAll('#userDetailTabs button').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('#userDetailTabsContent .tab-pane').forEach(p => p.classList.remove('show', 'active'));
          firstTab.classList.add('active');
          const targetId = firstTab.getAttribute('data-bs-target');
          if (targetId) {
            const pane = document.querySelector(targetId);
            if (pane) pane.classList.add('show', 'active');
          }
        }
      }

      // Load user activity logs from global audit state
      this.loadUserAuditLogs(user);

      // Toggle views
      document.getElementById('users-list-view').style.display = 'none';
      document.getElementById('users-detail-view').style.display = 'block';
    },

    loadUserAuditLogs: function (user) {
      // Reset limits back to default 20
      this.paginationState.userDetailRecentLogs.pageSize = 20;
      this.paginationState.userDetailRecentLogs.page = 1;
      this.paginationState.userDetailFullLogs.pageSize = 20;
      this.paginationState.userDetailFullLogs.page = 1;

      const rSelect = document.getElementById('recent-logs-limit-select');
      const fSelect = document.getElementById('full-logs-limit-select');
      if (rSelect) rSelect.value = "20";
      if (fSelect) fSelect.value = "20";

      const tbody = document.getElementById('detail-activity-tbody');
      const fullTbody = document.getElementById('detail-full-activity-tbody');
      if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center py-2 text-muted"><div class="spinner-border spinner-border-sm"></div> Memuat...</td></tr>';
      if (fullTbody) fullTbody.innerHTML = '<tr><td colspan="4" class="text-center py-2 text-muted"><div class="spinner-border spinner-border-sm"></div> Memuat...</td></tr>';

      google.script.run.withSuccessHandler((res) => {
        if (!tbody || !fullTbody) return;

        if (res.success && Array.isArray(res.data)) {
          const userLogs = res.data.filter(log => {
            const userIdStr = String(log.user_id || '').toLowerCase();
            const descStr = String(log.description || '').toLowerCase();
            const emailStr = String(user.email || '').toLowerCase();
            const idStr = String(user.id || '').toLowerCase();
            const usernameStr = String(user.username || '').toLowerCase();

            return (
              (emailStr && userIdStr === emailStr) ||
              (idStr && userIdStr === idStr) ||
              (usernameStr && userIdStr === usernameStr) ||
              (emailStr && descStr.includes(emailStr)) ||
              (idStr && descStr.includes(idStr)) ||
              (usernameStr && descStr.includes(usernameStr))
            );
          });

          this.currentUserDetailLogs = userLogs;
          this.paginationState.userDetailRecentLogs.data = userLogs;
          this.paginationState.userDetailFullLogs.data = userLogs;

          this.renderUserDetailRecentLogsPage();
          this.renderUserDetailFullLogsPage();
        } else {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Gagal memuat log</td></tr>`;
          fullTbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Gagal memuat log</td></tr>`;
        }
      }).apiGetAuditLogs();
    },

    downloadUserDetailAuditCsv: function () {
      const logs = this.currentUserDetailLogs || [];
      if (logs.length === 0) {
        alert('Tidak ada log aktivitas untuk diunduh.');
        return;
      }

      let csvContent = 'data:text/csv;charset=utf-8,Timestamp,Action,Module,Description\n';
      logs.forEach(log => {
        const row = [
          log.timestamp,
          log.action,
          log.module,
          `"${(log.description || '').replace(/"/g, '""')}"`
        ].join(',');
        csvContent += row + '\n';
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `audit_log_${this.currentUserDetailLogs[0].user_id || 'user'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    },

    handleRolesSort: function (colName) {
      if (!this.state.rolesSort) {
        this.state.rolesSort = { column: 'role_code', asc: true };
      }
      if (this.state.rolesSort.column === colName) {
        this.state.rolesSort.asc = !this.state.rolesSort.asc;
      } else {
        this.state.rolesSort.column = colName;
        this.state.rolesSort.asc = true;
      }
      this.applyRolesFiltersAndSort();
    },

    applyRolesFiltersAndSort: function () {
      let filtered = [...(this.rolesCache || [])];

      // 1. Global Search Filter
      const query = (document.getElementById('roles-search')?.value || '').trim().toLowerCase();
      if (query) {
        filtered = filtered.filter(r => {
          return (
            String(r.role_code || '').toLowerCase().includes(query) ||
            String(r.role_name || '').toLowerCase().includes(query) ||
            String(r.description || '').toLowerCase().includes(query) ||
            String(r.user_count || '0').includes(query) ||
            String(r.status || '').toLowerCase().includes(query)
          );
        });
      }

      // 2. Column-specific filters (only active if row is visible)
      const filterRow = document.getElementById('roles-filter-row');
      if (filterRow && !filterRow.classList.contains('d-none')) {
        const filterCode = (document.getElementById('roles-filter-role_code')?.value || '').trim().toLowerCase();
        const filterName = (document.getElementById('roles-filter-role_name')?.value || '').trim().toLowerCase();
        const filterDesc = (document.getElementById('roles-filter-description')?.value || '').trim().toLowerCase();
        const filterCount = (document.getElementById('roles-filter-user_count')?.value || '').trim().toLowerCase();
        const filterStatus = (document.getElementById('roles-filter-status')?.value || '').trim().toLowerCase();

        if (filterCode) filtered = filtered.filter(r => String(r.role_code || '').toLowerCase().includes(filterCode));
        if (filterName) filtered = filtered.filter(r => String(r.role_name || '').toLowerCase().includes(filterName));
        if (filterDesc) filtered = filtered.filter(r => String(r.description || '').toLowerCase().includes(filterDesc));
        if (filterCount) filtered = filtered.filter(r => String(r.user_count || '0').includes(filterCount));
        if (filterStatus) filtered = filtered.filter(r => String(r.status || '').toLowerCase().includes(filterStatus));
      }

      // 3. Sorting
      if (this.state.rolesSort) {
        const col = this.state.rolesSort.column;
        const asc = this.state.rolesSort.asc;
        filtered.sort((a, b) => {
          let valA = String(a[col] || '').toLowerCase();
          let valB = String(b[col] || '').toLowerCase();

          if (!isNaN(valA) && !isNaN(valB)) {
            valA = Number(valA);
            valB = Number(valB);
          }

          if (valA < valB) return asc ? -1 : 1;
          if (valA > valB) return asc ? 1 : -1;
          return 0;
        });
      }

      this.paginationState.roles.data = filtered;
      this.paginationState.roles.page = 1;
      this.renderRolesPage();

      // Update header sorting icons
      const cols = ['role_code', 'role_name', 'description', 'user_count', 'status'];
      cols.forEach(c => {
        const icon = document.getElementById(`roles-sort-icon-${c}`);
        if (icon) {
          if (this.state.rolesSort && this.state.rolesSort.column === c) {
            icon.className = this.state.rolesSort.asc ? 'bi bi-sort-up ms-1' : 'bi bi-sort-down ms-1';
            icon.style.color = '#2563eb';
            icon.classList.remove('opacity-50', 'text-muted');
          } else {
            icon.className = 'bi bi-arrow-down-up ms-1 text-muted opacity-50';
            icon.style.color = '';
          }
        }
      });
    },
