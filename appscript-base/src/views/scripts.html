    // Dynamic Form Builders for Roles Modal Checkboxes
    renderRoleFormCheckboxes: function (mode) {
      const menuListDiv = document.getElementById(mode + '-role-menu-list');
      const permListDiv = document.getElementById(mode + '-role-perms-list');

      if (menuListDiv) {
        menuListDiv.innerHTML = '<div class="col-12 text-center py-2"><span class="spinner-border spinner-border-sm"></span> Memuat menu...</div>';
        google.script.run.withSuccessHandler((res) => {
          if (res && res.success && Array.isArray(res.data)) {
            AEF.menusCache = res.data; // Cache menus for permission delete validations
            menuListDiv.innerHTML = '';

            // Group menus into parent and children
            const parents = res.data.filter(m => !m.parent_id);
            const childrenMap = {};
            res.data.forEach(m => {
              if (m.parent_id) {
                if (!childrenMap[m.parent_id]) childrenMap[m.parent_id] = [];
                childrenMap[m.parent_id].push(m);
              }
            });

            const isDisabled = mode === 'add' ? 'disabled' : '';

            parents.forEach(p => {
              const pId = p.menu_id || p.id;
              const pChildren = childrenMap[pId] || [];

              const parentCol = document.createElement('div');
              parentCol.className = 'col-12 mb-3';

              let childrenHtml = '';
              pChildren.forEach(c => {
                childrenHtml += `
                  <div class="form-check ms-4 mb-2">
                    <input class="form-check-input role-menu-checkbox" type="checkbox" ${isDisabled} value="${c.permission_code || ''}" id="${mode}-role-menu-${c.menu_code}">
                    <label class="form-check-label text-dark" for="${mode}-role-menu-${c.menu_code}">
                      <i class="bi ${c.icon || 'bi-circle'} me-1 text-muted"></i>${c.menu_name} <span class="text-muted small">(${c.permission_code || 'Publik'})</span>
                    </label>
                  </div>
                `;
              });

              parentCol.innerHTML = `
                <div class="form-check mb-2">
                  <input class="form-check-input role-menu-checkbox" type="checkbox" ${isDisabled} value="${p.permission_code || ''}" id="${mode}-role-menu-${p.menu_code}">
                  <label class="form-check-label fw-bold text-dark" for="${mode}-role-menu-${p.menu_code}">
                    <i class="bi ${p.icon || 'bi-folder'} me-1 text-primary"></i>${p.menu_name} <span class="text-muted small">(${p.permission_code || 'Publik'})</span>
                  </label>
                </div>
                ${childrenHtml}
              `;
              menuListDiv.appendChild(parentCol);
            });

            // Recheck menu list if editing
            if (mode === 'edit' && AEF.state.activeEditRolePermissions) {
              AEF.state.activeEditRolePermissions.forEach(code => {
                if (!code) return;
                const cb = menuListDiv.querySelector(`input[value="${code}"]`);
                if (cb) cb.checked = true;
              });
            }
          }
        }).apiGetAllMenus();
      }

      if (permListDiv) {
        permListDiv.innerHTML = '<div class="col-12 text-center py-2"><span class="spinner-border spinner-border-sm"></span> Memuat hak akses...</div>';
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success && Array.isArray(res.data)) {
              // Group existing permissions to extract unique prefixes, seeded with default cores
              const prefixes = new Set(['DASHBOARD', 'USER', 'ROLE', 'PERMISSION', 'CONFIG', 'AUDIT', 'MENU']);
              res.data.forEach(p => {
                const code = String(p.permission_code || '').trim().toUpperCase();
                if (!code) return;
                const parts = code.split('_');
                if (parts.length > 1) {
                  parts.pop();
                  prefixes.add(parts.join('_'));
                } else {
                  prefixes.add(code);
                }
              });

              AEF.state.granularPrefixes = Array.from(prefixes).sort();
              
              // Reset granular pagination page
              if (!AEF.state.granularCurrentPage) AEF.state.granularCurrentPage = { add: 1, edit: 1 };
              AEF.state.granularCurrentPage[mode] = 1;

              AEF.renderGranularTable(mode);
            } else {
              permListDiv.innerHTML = `<div class="text-danger p-3 text-center">Gagal: ${res ? res.message : 'Respon kosong'}</div>`;
            }
          })
          .withFailureHandler((err) => {
            permListDiv.innerHTML = `<div class="text-danger p-3 text-center">Error koneksi: ${err.message || 'Koneksi ke Apps Script terputus'}</div>`;
          })
          .apiGetPermissions();
      }
    },

    renderGranularTable: function (mode) {
      const permListDiv = document.getElementById(mode + '-role-perms-list');
      const pagContainer = document.getElementById(mode + '-role-granular-pagination');
      if (!permListDiv) return;

      if (!AEF.state.granularCurrentPage) AEF.state.granularCurrentPage = { add: 1, edit: 1 };
      if (!AEF.state.granularPageSize) AEF.state.granularPageSize = { add: 20, edit: 20 };

      const prefixes = AEF.state.granularPrefixes || [];
      const page = AEF.state.granularCurrentPage[mode] || 1;
      const pageSize = AEF.state.granularPageSize[mode] || 20;
      const totalItems = prefixes.length;
      const totalPages = Math.ceil(totalItems / pageSize) || 1;

      const startIdx = (page - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, totalItems);
      const pageSlice = prefixes.slice(startIdx, endIdx);

      let tableHtml = `
        <div class="table-responsive w-100">
          <table class="table table-aef align-middle mb-0">
            <thead>
              <tr class="text-muted fw-bold fs-7 text-uppercase gs-0">
                <th style="min-width: 180px;">Permission Code</th>
                <th class="text-center" style="width: 90px;">Select All</th>
                <th class="text-center" style="width: 90px;">Create (C)</th>
                <th class="text-center" style="width: 90px;">Read (R)</th>
                <th class="text-center" style="width: 90px;">Update (U)</th>
                <th class="text-center" style="width: 90px;">Delete (D)</th>
                <th class="text-center" style="width: 110px;">Export/Import (E)</th>
              </tr>
            </thead>
            <tbody>
      `;

      const iconMap = {
        'USER': 'bi-people-fill',
        'ROLE': 'bi-shield-check',
        'PERMISSION': 'bi-key-fill',
        'CONFIG': 'bi-sliders',
        'AUDIT': 'bi-journal-text',
        'MENU': 'bi-menu-button-wide-fill',
        'DASHBOARD': 'bi-grid-1x2-fill'
      };

      const activePerms = (mode === 'add' ? AEF.state.activeAddRolePermissions : AEF.state.activeEditRolePermissions) || [];

      pageSlice.forEach(prefix => {
        const viewCode = `${prefix}_VIEW`;
        const createCode = `${prefix}_CREATE`;
        const updateCode = `${prefix}_UPDATE`;
        const deleteCode = `${prefix}_DELETE`;
        const exportImportCode = `${prefix}_EXPORT,${prefix}_IMPORT`;
        const icon = iconMap[prefix] || 'bi-shield-lock-fill';

        tableHtml += `
          <tr id="${mode}-row-${prefix}">
            <td class="fw-semibold text-dark">
              <div class="d-flex align-items-center justify-content-between">
                <span><i class="bi ${icon} me-2 text-secondary"></i>${viewCode}</span>
                <button type="button" class="btn btn-link text-danger p-0 ms-2" onclick="AEF.deletePermissionPrefix('${mode}', '${prefix}')" title="Hapus Permission Code">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
            <td class="text-center">
              <input class="form-check-input select-all-row-cb" type="checkbox" onchange="AEF.toggleRowCheckboxes('${mode}', '${prefix}', this.checked)">
            </td>
            <td class="text-center">
              <input class="form-check-input role-perm-checkbox" type="checkbox" value="${createCode}" id="${mode}-cb-${createCode}" onchange="AEF.handleGranularCheckboxChange('${mode}', '${createCode}', this.checked)">
            </td>
            <td class="text-center">
              <input class="form-check-input role-perm-checkbox" type="checkbox" value="${viewCode}" id="${mode}-cb-${viewCode}" onchange="AEF.handleGranularCheckboxChange('${mode}', '${viewCode}', this.checked)">
            </td>
            <td class="text-center">
              <input class="form-check-input role-perm-checkbox" type="checkbox" value="${updateCode}" id="${mode}-cb-${updateCode}" onchange="AEF.handleGranularCheckboxChange('${mode}', '${updateCode}', this.checked)">
            </td>
            <td class="text-center">
              <input class="form-check-input role-perm-checkbox" type="checkbox" value="${deleteCode}" id="${mode}-cb-${deleteCode}" onchange="AEF.handleGranularCheckboxChange('${mode}', '${deleteCode}', this.checked)">
            </td>
            <td class="text-center">
              <input class="form-check-input role-perm-checkbox" type="checkbox" value="${exportImportCode}" id="${mode}-cb-${prefix}-exportimport" onchange="AEF.handleGranularCheckboxChange('${mode}', '${exportImportCode}', this.checked)">
            </td>
          </tr>
        `;
      });

      tableHtml += `
            </tbody>
          </table>
        </div>
      `;

      permListDiv.innerHTML = tableHtml;

      // Recheck checkboxes and update Select All state for rendered page rows
      pageSlice.forEach(prefix => {
        const viewCode = `${prefix}_VIEW`;
        const createCode = `${prefix}_CREATE`;
        const updateCode = `${prefix}_UPDATE`;
        const deleteCode = `${prefix}_DELETE`;
        const exportImportCode = `${prefix}_EXPORT,${prefix}_IMPORT`;

        const viewCb = document.getElementById(`${mode}-cb-${viewCode}`);
        const createCb = document.getElementById(`${mode}-cb-${createCode}`);
        const updateCb = document.getElementById(`${mode}-cb-${updateCode}`);
        const deleteCb = document.getElementById(`${mode}-cb-${deleteCode}`);
        const expImpCb = document.getElementById(`${mode}-cb-${prefix}-exportimport`);

        if (viewCb) viewCb.checked = activePerms.includes(viewCode);
        if (createCb) createCb.checked = activePerms.includes(createCode);
        if (updateCb) updateCb.checked = activePerms.includes(updateCode);
        if (deleteCb) deleteCb.checked = activePerms.includes(deleteCode);
        if (expImpCb) {
          expImpCb.checked = activePerms.includes(`${prefix}_EXPORT`) && activePerms.includes(`${prefix}_IMPORT`);
        }

        AEF.updateRowSelectAll(mode, prefix);
      });

      // Render Pagination controls
      if (pagContainer) {
        if (totalItems === 0) {
          pagContainer.innerHTML = '';
          return;
        }

        const sizeOptions = [20, 50, 100].map(s => {
          const sel = s === pageSize ? 'selected' : '';
          return `<option value="${s}" ${sel}>${s}</option>`;
        }).join('');

        pagContainer.innerHTML = `
          <div class="d-flex align-items-center gap-2">
            <select class="form-select form-select-sm" onchange="AEF.handleGranularPageSizeChange('${mode}', this.value)" style="width: 70px;">
              ${sizeOptions}
            </select>
            <div class="text-muted small">Showing ${startIdx + 1} to ${endIdx} of ${totalItems} entries</div>
          </div>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item ${page === 1 ? 'disabled' : ''}">
              <a class="page-link py-1" href="javascript:void(0)" onclick="AEF.handleGranularPageChange('${mode}', ${page - 1})"><i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item ${page === totalPages ? 'disabled' : ''}">
              <a class="page-link py-1" href="javascript:void(0)" onclick="AEF.handleGranularPageChange('${mode}', ${page + 1})"><i class="bi bi-chevron-right"></i></a>
            </li>
          </ul>
        `;
      }
    },

    handleGranularPageChange: function (mode, newPage) {
      if (!AEF.state.granularCurrentPage) AEF.state.granularCurrentPage = { add: 1, edit: 1 };
      AEF.state.granularCurrentPage[mode] = newPage;
      AEF.renderGranularTable(mode);
    },

    handleGranularPageSizeChange: function (mode, newSize) {
      if (!AEF.state.granularCurrentPage) AEF.state.granularCurrentPage = { add: 1, edit: 1 };
      if (!AEF.state.granularPageSize) AEF.state.granularPageSize = { add: 20, edit: 20 };
      AEF.state.granularPageSize[mode] = parseInt(newSize, 10);
      AEF.state.granularCurrentPage[mode] = 1;
      AEF.renderGranularTable(mode);
    },

    handleGranularCheckboxChange: function (mode, permCode, checked) {
      const stateKey = mode === 'add' ? 'activeAddRolePermissions' : 'activeEditRolePermissions';
      if (!AEF.state[stateKey]) AEF.state[stateKey] = [];

      const codes = permCode.split(',');
      codes.forEach(code => {
        if (checked) {
          if (!AEF.state[stateKey].includes(code)) {
            AEF.state[stateKey].push(code);
          }
        } else {
          AEF.state[stateKey] = AEF.state[stateKey].filter(c => c !== code);
        }
      });

      const prefix = codes[0].split('_')[0];
      AEF.updateRowSelectAll(mode, prefix);
    },

    togglePermissionForm: function(mode) {
      const formEl = document.getElementById(`${mode}-role-perm-form`);
      if (formEl) {
        formEl.classList.toggle('d-none');
      }
    },

    addNewPermissionPrefix: function (mode) {
      const prefixEl = document.getElementById(`${mode}-role-new-perm-prefix`);
      const nameEl = document.getElementById(`${mode}-role-new-perm-name`);
      const statusEl = document.getElementById(`${mode}-role-new-perm-status`);
      
      if (!prefixEl) return;
      const prefix = prefixEl.value.trim().toUpperCase().replace(/[^A-Z0-9_]/g, '');
      const name = nameEl ? nameEl.value.trim() : '';
      const status = statusEl ? statusEl.value : 'ACTIVE';
      
      if (!prefix) {
        alert('Gagal menambahkan: Masukkan prefix permission yang valid (huruf, angka, dan underscore)!');
        return;
      }

      if (!AEF.state.pendingNewPrefixes) AEF.state.pendingNewPrefixes = {};
      if (!AEF.state.pendingNewPrefixes[mode]) AEF.state.pendingNewPrefixes[mode] = [];
      
      // Check if already exists in granularPrefixes
      if (AEF.state.granularPrefixes && AEF.state.granularPrefixes.includes(prefix)) {
        alert(`Gagal menambahkan: Prefix "${prefix}" sudah ada di daftar.`);
        return;
      }

      AEF.state.pendingNewPrefixes[mode].push({ prefix, name, status });
      if (AEF.state.granularPrefixes) {
        AEF.state.granularPrefixes.push(prefix);
        AEF.state.granularPrefixes.sort();
      }
      
      // Select all for this new prefix by default
      if (!AEF.state.activeAddRolePermissions) AEF.state.activeAddRolePermissions = [];
      if (!AEF.state.activeEditRolePermissions) AEF.state.activeEditRolePermissions = [];
      const stateArr = mode === 'add' ? AEF.state.activeAddRolePermissions : AEF.state.activeEditRolePermissions;
      const suffixes = ['VIEW', 'CREATE', 'UPDATE', 'DELETE', 'EXPORT', 'IMPORT'];
      suffixes.forEach(s => {
        const code = `${prefix}_${s}`;
        if (!stateArr.includes(code)) {
          stateArr.push(code);
        }
      });

      prefixEl.value = '';
      if(nameEl) nameEl.value = '';
      if(statusEl) statusEl.value = 'ACTIVE';
      
      alert(`Berhasil: Permission code dengan prefix "${prefix}" berhasil ditambahkan ke state lokal.`);
      AEF.renderGranularTable(mode);
    },

    deletePermissionPrefix: function (mode, prefix) {
      const viewCode = `${prefix}_VIEW`;

      if (!AEF.menusCache) {
        alert('Gagal menghapus: Data menu sedang dimuat, mohon tunggu sebentar...');
        return;
      }

      const isUsed = AEF.menusCache.some(m => m.permission_code && String(m.permission_code).trim().toUpperCase() === viewCode);
      if (isUsed) {
        const menuObj = AEF.menusCache.find(m => m.permission_code && String(m.permission_code).trim().toUpperCase() === viewCode);
        alert(`Gagal menghapus: Tidak boleh dihapus karena masih digunakan di Menu Management khususnya menu: "${menuObj.menu_name}"`);
        return;
      }

      if (!confirm(`Apakah Anda yakin ingin menghapus sementara kode permission untuk prefix "${prefix}"? Perubahan baru permanen setelah simpan role.`)) {
        return;
      }

      // Check if it's a newly added pending prefix
      if (AEF.state.pendingNewPrefixes && AEF.state.pendingNewPrefixes[mode]) {
        const pendingIndex = AEF.state.pendingNewPrefixes[mode].findIndex(p => p.prefix === prefix);
        if (pendingIndex !== -1) {
          // Remove from pending new
          AEF.state.pendingNewPrefixes[mode].splice(pendingIndex, 1);
        } else {
          // It's an existing prefix, mark for deletion
          if (!AEF.state.pendingDeletePrefixes) AEF.state.pendingDeletePrefixes = {};
          if (!AEF.state.pendingDeletePrefixes[mode]) AEF.state.pendingDeletePrefixes[mode] = [];
          AEF.state.pendingDeletePrefixes[mode].push(prefix);
        }
      } else {
        if (!AEF.state.pendingDeletePrefixes) AEF.state.pendingDeletePrefixes = {};
        if (!AEF.state.pendingDeletePrefixes[mode]) AEF.state.pendingDeletePrefixes[mode] = [];
        AEF.state.pendingDeletePrefixes[mode].push(prefix);
      }

      // Remove from granularPrefixes array
      if (AEF.state.granularPrefixes) {
        const index = AEF.state.granularPrefixes.indexOf(prefix);
        if (index > -1) {
          AEF.state.granularPrefixes.splice(index, 1);
        }
      }
      
      // Remove from active permissions array
      const stateArr = mode === 'add' ? AEF.state.activeAddRolePermissions : AEF.state.activeEditRolePermissions;
      if (stateArr) {
        const suffixes = ['VIEW', 'CREATE', 'UPDATE', 'DELETE', 'EXPORT', 'IMPORT'];
        suffixes.forEach(s => {
          const code = `${prefix}_${s}`;
          const codeIdx = stateArr.indexOf(code);
          if (codeIdx > -1) {
            stateArr.splice(codeIdx, 1);
          }
        });
      }

      alert(`Berhasil: Permission code dengan prefix "${prefix}" berhasil dihapus dari daftar.`);
      AEF.renderGranularTable(mode);
    },

    toggleRowCheckboxes: function (mode, prefix, checked) {
      const row = document.getElementById(`${mode}-row-${prefix}`);
      if (!row) return;

      const stateKey = mode === 'add' ? 'activeAddRolePermissions' : 'activeEditRolePermissions';
      if (!AEF.state[stateKey]) AEF.state[stateKey] = [];

      row.querySelectorAll('.role-perm-checkbox').forEach(cb => {
        cb.checked = checked;
        const codes = cb.value.split(',');
        codes.forEach(code => {
          if (checked) {
            if (!AEF.state[stateKey].includes(code)) AEF.state[stateKey].push(code);
          } else {
            AEF.state[stateKey] = AEF.state[stateKey].filter(c => c !== code);
          }
        });
      });
    },

    updateRowSelectAll: function (mode, prefix) {
      const row = document.getElementById(`${mode}-row-${prefix}`);
      if (!row) return;
      const selectAllCb = row.querySelector('.select-all-row-cb');
      if (!selectAllCb) return;
      const checkboxes = Array.from(row.querySelectorAll('.role-perm-checkbox'));
      selectAllCb.checked = checkboxes.every(cb => cb.checked);
      this.updateMasterSelectAll(mode);
    },

    updateMasterSelectAll: function (mode) {
      const container = document.getElementById(mode + '-role-perms-list');
      if (!container) return;
      const checkboxes = container.querySelectorAll('.role-perm-checkbox');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      const selectAllCb = document.getElementById(mode + '-role-select-all-perms');
      if (selectAllCb) selectAllCb.checked = allChecked;
    },

    toggleAllGranularPerms: function (mode, checked) {
      const container = document.getElementById(mode + '-role-perms-list');
      if (container) {
        const checkboxes = container.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(cb => {
          cb.checked = checked;
        });
      }
    },

    // User Assignment Autocomplete Logic
    searchUsersForRole: function (mode, query) {
      const resultsDiv = document.getElementById(mode + '-role-user-results');
      if (!resultsDiv) return;
      const clean = query.trim().toLowerCase();
      if (!clean) {
        resultsDiv.innerHTML = '';
        resultsDiv.classList.add('d-none');
        return;
      }
      
      const matches = (this.usersCache || []).filter(u => {
        return (
          String(u.name || '').toLowerCase().includes(clean) || 
          String(u.email || '').toLowerCase().includes(clean)
        );
      });
      
      if (matches.length === 0) {
        resultsDiv.innerHTML = '<div class="p-2 text-muted small">User tidak ditemukan</div>';
        resultsDiv.classList.remove('d-none');
        return;
      }
      
      resultsDiv.innerHTML = '';
      resultsDiv.classList.remove('d-none');
      
      matches.forEach(u => {
        const item = document.createElement('div');
        item.className = 'p-2 border-bottom autocomplete-item text-dark';
        item.style.cursor = 'pointer';
        item.innerHTML = `<div class="fw-semibold" style="font-size: 0.9rem;">${u.name}</div><div class="text-muted small">${u.email}</div>`;
        item.onclick = () => {
          this.addUserToRole(mode, u);
          resultsDiv.innerHTML = '';
          resultsDiv.classList.add('d-none');
          const searchInput = document.getElementById(mode + '-role-user-search');
          if (searchInput) searchInput.value = '';
        };
        resultsDiv.appendChild(item);
      });
    },

    addUserToRole: function (mode, user) {
      const stateList = mode === 'add' ? 'addRoleAssignedUsers' : 'editRoleAssignedUsers';
      if (!this.state[stateList]) this.state[stateList] = [];
      if (!this.state[stateList].some(u => u.id === user.id)) {
        this.state[stateList].push(user);
      }
      this.renderRoleUserChips(mode);
    },

    removeUserFromRole: function (mode, userId) {
      const stateList = mode === 'add' ? 'addRoleAssignedUsers' : 'editRoleAssignedUsers';
      if (this.state[stateList]) {
        this.state[stateList] = this.state[stateList].filter(u => u.id !== userId);
      }
      this.renderRoleUserChips(mode);
    },

    renderRoleUserChips: function (mode) {
      const container = document.getElementById(mode + '-role-user-chips');
      if (!container) return;
      const list = mode === 'add' ? this.state.addRoleAssignedUsers : this.state.editRoleAssignedUsers;
      container.innerHTML = '';
      if (!list || list.length === 0) return;
      
      list.forEach(u => {
        const initials = (u.name || 'US').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const chip = document.createElement('div');
        chip.className = 'badge bg-light text-dark border d-flex align-items-center gap-2 py-2 px-3 rounded-pill';
        chip.style.fontSize = '0.85rem';
        chip.innerHTML = `
          <span class="badge bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 20px; height: 20px; font-size: 0.7rem; padding: 0;">${initials}</span>
          <span class="fw-semibold text-dark">${u.name}</span>
          <span class="text-muted" style="cursor: pointer;" onclick="AEF.removeUserFromRole('${mode}', '${u.id}')"><i class="bi bi-x-lg" style="font-size: 0.75rem;"></i></span>
        `;
        container.appendChild(chip);
      });
    },

    generateRoleCodeFromInput: function (mode, val) {
      let code = String(val).trim().toUpperCase().replace(/[^A-Z0-9]/g, '_').replace(/_+/g, '_');
      if (code && !code.startsWith('ROLE_')) {
        code = 'ROLE_' + code;
      }
      const el = document.getElementById(mode === 'add' ? 'new-role-code' : 'edit-role-code');
      if (el) el.value = code;
    },

    // Role Actions Triggers
    openAddRoleModal: function () {
      this.showModal('addRoleModal');
      document.getElementById('form-add-role').reset();
      
      // Initialize activeAddRolePermissions and pending prefixes
      AEF.state.activeAddRolePermissions = [];
      if (!AEF.state.pendingNewPrefixes) AEF.state.pendingNewPrefixes = {};
      if (!AEF.state.pendingDeletePrefixes) AEF.state.pendingDeletePrefixes = {};
      AEF.state.pendingNewPrefixes['add'] = [];
      AEF.state.pendingDeletePrefixes['add'] = [];

      // Clear add new permission form inputs
      const prefixEl = document.getElementById('add-role-new-perm-prefix');
      const nameEl = document.getElementById('add-role-new-perm-name');
      const statusEl = document.getElementById('add-role-new-perm-status');
      if (prefixEl) prefixEl.value = '';
      if (nameEl) nameEl.value = '';
      if (statusEl) statusEl.value = 'ACTIVE';

      if (formEl && !formEl.classList.contains('d-none')) {
        formEl.classList.add('d-none');
      }

      // Select Tab 1 by default
      AEF.switchTab('add-role-detail-tab');

      this.state.addRoleAssignedUsers = [];
      this.renderRoleUserChips('add');
      this.renderRoleFormCheckboxes('add');
    },

    submitCreateRole: function () {
      const name = document.getElementById('new-role-name').value;
      const code = document.getElementById('new-role-code').value;
      const desc = document.getElementById('new-role-desc').value;
      const status = document.getElementById('new-role-status').checked ? 'ACTIVE' : 'INACTIVE';

      // Gather Checked Permissions (Menu + Granular)
      const permissions = [...(AEF.state.activeAddRolePermissions || [])];
      document.querySelectorAll('#addRoleModal .role-menu-checkbox:checked').forEach(cb => {
        if (cb.value) {
          permissions.push(cb.value);
        }
      });

      // Gather assigned user IDs
      const assignedUsers = (this.state.addRoleAssignedUsers || []).map(u => u.id);

      // Gather pending prefixes
      const pendingNew = AEF.state.pendingNewPrefixes && AEF.state.pendingNewPrefixes['add'] ? AEF.state.pendingNewPrefixes['add'] : [];
      const pendingDelete = AEF.state.pendingDeletePrefixes && AEF.state.pendingDeletePrefixes['add'] ? AEF.state.pendingDeletePrefixes['add'] : [];

      if (!name || !code) return alert('Nama Role dan Role Code wajib diisi!');

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            this.hideModal('addRoleModal');
            // Clear pending prefixes
            if (AEF.state.pendingNewPrefixes) AEF.state.pendingNewPrefixes['add'] = [];
            if (AEF.state.pendingDeletePrefixes) AEF.state.pendingDeletePrefixes['add'] = [];
            this.loadRolesTable();
          } else {
            alert('Gagal membuat role: ' + res.message);
          }
        })
        .apiCreateRole({
          role_code: code,
          role_name: name,
          description: desc,
          status: status,
          permissions: permissions,
          assigned_users: assignedUsers,
          pending_new_prefixes: pendingNew,
          pending_delete_prefixes: pendingDelete,
          actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
        });
    },

      // Reset Select All Perms

      if (selectAllCb) selectAllCb.checked = false;

      if (!AEF.state.pendingNewPrefixes) AEF.state.pendingNewPrefixes = {};
      if (!AEF.state.pendingDeletePrefixes) AEF.state.pendingDeletePrefixes = {};
      AEF.state.pendingNewPrefixes['edit'] = [];
      AEF.state.pendingDeletePrefixes['edit'] = [];

      // Clear add new permission form inputs

      const nameEl = document.getElementById('edit-role-new-perm-name');
      const statusEl = document.getElementById('edit-role-new-perm-status');

      if (nameEl) nameEl.value = '';

        if (cachedRole) {

          document.getElementById('edit-role-subtitle-text').textContent = `ID: ${cachedRole.role_code}`;

            // Set title and subtitle

            document.getElementById('edit-role-subtitle-text').textContent = `ID: ${role.role_code}`;

            AEF.state.editRoleAssignedUsers = role.assigned_users || [];
            AEF.state.activeEditRolePermissions = role.permissions || [];

            AEF.renderRoleUserChips('edit');
            AEF.renderRoleFormCheckboxes('edit');
          } else {
            alert('Gagal memuat detail role: ' + res.message);
          }

          status: status,
          permissions: permissions,
          assigned_users: assignedUsers,
          pending_new_prefixes: pendingNew,
          pending_delete_prefixes: pendingDelete,
          actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
        });
    },

    // PERMISSIONS CRUD
    loadPermissionsTable: function () {
      const tbody = document.getElementById('perms-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';

      const addBtn = document.getElementById('btn-add-perm-trigger');
      if (addBtn) {
        if (this.hasPermission('PERMISSION_CREATE')) {
          addBtn.classList.remove('d-none');
        } else {
          addBtn.classList.add('d-none');
        }
      }

      const editBtn = document.getElementById('btn-edit-perm-matrix');
      if (editBtn) {
        if (this.hasPermission('PERMISSION_CREATE')) {
          editBtn.classList.remove('d-none');
        } else {
          editBtn.classList.add('d-none');
        }
      }

      const fetchPerms = () => {
        google.script.run.withSuccessHandler((res) => {
          if (res.success && Array.isArray(res.data)) {
            this.permissionsCache = res.data;
            
            // Extract prefixes
            const prefixes = new Set(['DASHBOARD', 'USER', 'ROLE', 'PERMISSION', 'CONFIG', 'AUDIT', 'MENU']);
            res.data.forEach(p => {
              const code = String(p.permission_code || '').trim().toUpperCase();
              if (!code) return;
              const parts = code.split('_');
              if (parts.length > 1) {
                parts.pop();
                prefixes.add(parts.join('_'));
              } else {
                prefixes.add(code);
              }
            });
            AEF.state.granularPrefixes = Array.from(prefixes).sort();
            
            this.renderPermissionsMatrix();
          } else {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-3">Gagal memuat matrix: ${res ? res.message : 'Respon kosong'}</td></tr>`;
          }
        }).apiGetPermissions();
      };

      if (!this.rolesCache) {
        google.script.run.withSuccessHandler((res) => {
          if (res && res.success && Array.isArray(res.data)) {
            this.rolesCache = res.data;
            fetchPerms();
          } else {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-3">Gagal memuat list role.</td></tr>`;
          }
        }).apiGetRoles();
      } else {
        fetchPerms();
      }
    },

    renderPermissionsMatrix: function () {
      const tbody = document.getElementById('perms-table-body');
      if (!tbody) return;

      if (!this.paginationState.perms) this.paginationState.perms = { page: 1, pageSize: 20 };
      const page = this.paginationState.perms.page || 1;
      const pageSize = this.paginationState.perms.pageSize || 20;

      const pageSizeSelect = document.getElementById('perm-page-size');
      if (pageSizeSelect) pageSizeSelect.value = String(pageSize);

      if (!AEF.state.permTreeCollapsed) AEF.state.permTreeCollapsed = {};

      const roles = (this.rolesCache || []).filter(r => String(r.status).toUpperCase() !== 'DELETED');
      const prefixes = AEF.state.granularPrefixes || [];

      // Build tree flat rows
      // Parent: Role
      // Child: Permission Prefix
      const flatRows = [];
      roles.forEach(r => {
        const rId = r.id || r.role_code;
        const isCollapsed = !!AEF.state.permTreeCollapsed[rId];
        
        flatRows.push({
          id: rId,
          name: r.role_name,
          code: r.role_code,
          isParent: true,
          hasChildren: prefixes.length > 0,
          prefix: null,
          roleCode: r.role_code,
          isCollapsed: isCollapsed
        });

        if (!isCollapsed) {
          prefixes.forEach(prefix => {
            flatRows.push({
              id: `${r.role_code}-${prefix}`,
              name: prefix,
              code: `${prefix}_VIEW`,
              isParent: false,
              hasChildren: false,
              prefix: prefix,
              roleCode: r.role_code,
              isCollapsed: false
            });
          });
        }
      });

      // Pagination slice
      const totalItems = flatRows.length;
      const totalPages = Math.ceil(totalItems / pageSize) || 1;
      const startIdx = (page - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, totalItems);
      const pageSlice = flatRows.slice(startIdx, endIdx);

      const isEditMode = AEF.state.permMatrixEditMode === true;
      const isDisabledAttr = isEditMode ? '' : 'disabled';
      const showDelete = (this.hasPermission('PERMISSION_DELETE') && !isEditMode) ? '' : 'd-none';

      // Disable/Enable Add button based on edit mode
      const addBtn = document.getElementById('btn-add-perm-trigger');
      if (addBtn) {
        if (isEditMode) {
          addBtn.setAttribute('disabled', 'true');
        } else {
          addBtn.removeAttribute('disabled');
        }
      }

      let html = '';
      pageSlice.forEach(row => {
        const prefix = row.prefix;
        const roleCode = row.roleCode;
        const toggleIconClass = row.hasChildren ? (row.isCollapsed ? 'bi-chevron-right text-muted' : 'bi-chevron-down text-primary') : 'bi-dot text-muted';
        
        let labelCellHtml = '';
        if (row.isParent) {
          labelCellHtml = `
            <span class="tree-toggle-btn me-2" onclick="AEF.togglePermTree(event, '${row.id}')" style="cursor: pointer;">
              <i class="bi ${toggleIconClass} fs-7"></i>
            </span>
            <i class="bi bi-shield-check me-2 text-primary"></i>
            <span class="text-dark fw-bold">${row.name}</span>
            <span class="text-muted ms-2 fs-8 fw-normal">(${row.code})</span>
          `;
        } else {
          labelCellHtml = `
            <span class="text-muted me-2" style="font-family: monospace;">├─</span>
            <i class="bi bi-key me-2 text-muted"></i>
            <span class="text-dark fw-medium">${row.name}_VIEW</span>
            <span class="text-muted ms-2 fs-8">(${row.code})</span>
          `;
        }

        // If this row has a prefix, display checkbox columns
        if (prefix) {
          const viewCode = `${prefix}_VIEW`;
          const createCode = `${prefix}_CREATE`;
          const updateCode = `${prefix}_UPDATE`;
          const deleteCode = `${prefix}_DELETE`;
          const exportImportCode = `${prefix}_EXPORT,${prefix}_IMPORT`;

          // Find description and status from permissionsCache
          const matchedPerm = (this.permissionsCache || []).find(p => p.permission_code === viewCode);
          const cleanName = matchedPerm ? String(matchedPerm.permission_name).replace(/\s*-\s*VIEW$/i, '') : `${prefix} Permission`;
          const statusVal = matchedPerm ? String(matchedPerm.status).toUpperCase() : 'ACTIVE';
          const statusBadge = statusVal === 'INACTIVE' ? 'badge-light-danger' : 'badge-light-success';

          // Get active permissions for this specific role from permissionsCache
          const rolePerms = (this.permissionsCache || [])
            .filter(p => p.role_id === roleCode && String(p.status).toUpperCase() === 'ACTIVE')
            .map(p => p.permission_code);

          const hasView = rolePerms.includes(viewCode);
          const hasCreate = rolePerms.includes(createCode);
          const hasUpdate = rolePerms.includes(updateCode);
          const hasDelete = rolePerms.includes(deleteCode);
          const hasExportImport = rolePerms.includes(`${prefix}_EXPORT`) && rolePerms.includes(`${prefix}_IMPORT`);

          html += `
            <tr id="matrix-row-${roleCode}-${prefix}">
              <td class="fw-semibold text-dark">
                ${labelCellHtml}
              </td>
              <td>
                <span class="text-dark fw-medium fs-7">${cleanName}</span>
              </td>
              <td class="text-center">
                <span class="badge ${statusBadge} px-2.5 py-1.5 fs-8">${statusVal}</span>
              </td>
              <td class="text-center">
                <input class="form-check-input matrix-select-all" type="checkbox" ${isDisabledAttr} onchange="AEF.toggleMatrixRow('${roleCode}', '${prefix}', this.checked)">
              </td>
              <td class="text-center">
                <input class="form-check-input matrix-cb" data-role="${roleCode}" type="checkbox" value="${createCode}" ${hasCreate ? 'checked' : ''} ${isDisabledAttr} onchange="AEF.updateMatrixRowSelectAll('${roleCode}', '${prefix}')">
              </td>
              <td class="text-center">
                <input class="form-check-input matrix-cb" data-role="${roleCode}" type="checkbox" value="${viewCode}" ${hasView ? 'checked' : ''} ${isDisabledAttr} onchange="AEF.updateMatrixRowSelectAll('${roleCode}', '${prefix}')">
              </td>
              <td class="text-center">
                <input class="form-check-input matrix-cb" data-role="${roleCode}" type="checkbox" value="${updateCode}" ${hasUpdate ? 'checked' : ''} ${isDisabledAttr} onchange="AEF.updateMatrixRowSelectAll('${roleCode}', '${prefix}')">
              </td>
              <td class="text-center">
                <input class="form-check-input matrix-cb" data-role="${roleCode}" type="checkbox" value="${deleteCode}" ${hasDelete ? 'checked' : ''} ${isDisabledAttr} onchange="AEF.updateMatrixRowSelectAll('${roleCode}', '${prefix}')">
              </td>
              <td class="text-center">
                <input class="form-check-input matrix-cb" data-role="${roleCode}" type="checkbox" value="${exportImportCode}" ${hasExportImport ? 'checked' : ''} ${isDisabledAttr} onchange="AEF.updateMatrixRowSelectAll('${roleCode}', '${prefix}')">
              </td>
              <td class="text-center">
                <button class="btn btn-sm btn-light-danger text-danger border border-danger-subtle ${showDelete}" onclick="AEF.deletePermissionPrefixFromControl('${prefix}')">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          `;
        } else {
          // Parent node (Role) with no prefix has blank cells in matrix columns
          html += `
            <tr id="matrix-row-${row.id}" style="background-color: #ffffff;">
              <td class="fw-semibold text-dark" colspan="9">
                ${labelCellHtml}
              </td>
              <td class="text-center"></td>
            </tr>
          `;
        }
      });

      tbody.innerHTML = html || '<tr><td colspan="8" class="text-center py-3">Tidak ada data.</td></tr>';

      // Update the select all checks for each row that has prefix
      pageSlice.forEach(row => {
        if (row.prefix) {
          this.updateMatrixRowSelectAll(row.roleCode, row.prefix);
        }
      });

      // Render Pagination controls
      const pagContainer = document.getElementById('perms-pagination-container');
      const pagInfo = document.getElementById('perms-pagination-info');
      const pagControls = document.getElementById('perms-pagination-controls');

      if (pagInfo && pagControls) {
        if (totalItems === 0) {
          pagContainer.classList.add('d-none');
          return;
        }
        pagContainer.classList.remove('d-none');
        pagInfo.textContent = `Showing ${startIdx + 1} to ${endIdx} of ${totalItems} entries`;

        let paginationHtml = `
          <li class="page-item ${page === 1 ? 'disabled' : ''}">
            <a class="page-link py-1" href="javascript:void(0)" onclick="AEF.handleMatrixPageChange(${page - 1})"><i class="bi bi-chevron-left"></i></a>
          </li>
        `;

        for (let i = 1; i <= totalPages; i++) {
          paginationHtml += `
            <li class="page-item ${page === i ? 'active' : ''}">
              <a class="page-link py-1" href="javascript:void(0)" onclick="AEF.handleMatrixPageChange(${i})">${i}</a>
            </li>
          `;
        }

        paginationHtml += `
          <li class="page-item ${page === totalPages ? 'disabled' : ''}">
            <a class="page-link py-1" href="javascript:void(0)" onclick="AEF.handleMatrixPageChange(${page + 1})"><i class="bi bi-chevron-right"></i></a>
          </li>
        `;

        pagControls.innerHTML = paginationHtml;
      }
    },

    handleMatrixPageChange: function (newPage) {
      if (!this.paginationState.perms) this.paginationState.perms = { page: 1, pageSize: 20 };
      this.paginationState.perms.page = newPage;
      this.renderPermissionsMatrix();
    },

    handleMatrixPageSizeChange: function (newSize) {
      if (!this.paginationState.perms) this.paginationState.perms = { page: 1, pageSize: 20 };
      this.paginationState.perms.pageSize = parseInt(newSize, 10);
      this.paginationState.perms.page = 1;
      this.renderPermissionsMatrix();
    },

    togglePermTree: function (event, parentId) {
      if (event) event.stopPropagation();
      if (!AEF.state.permTreeCollapsed) AEF.state.permTreeCollapsed = {};
      AEF.state.permTreeCollapsed[parentId] = !AEF.state.permTreeCollapsed[parentId];
      this.renderPermissionsMatrix();
    },

    toggleMatrixRow: function (roleCode, prefix, checked) {
      const row = document.getElementById(`matrix-row-${roleCode}-${prefix}`);
      if (!row) return;
      row.querySelectorAll('.matrix-cb').forEach(cb => {
        cb.checked = checked;
      });
    },

    updateMatrixRowSelectAll: function (roleCode, prefix) {
      const row = document.getElementById(`matrix-row-${roleCode}-${prefix}`);
      if (!row) return;
      const checkboxes = row.querySelectorAll('.matrix-cb');
      const selectAll = row.querySelector('.matrix-select-all');
      if (checkboxes.length > 0 && selectAll) {
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        selectAll.checked = allChecked;
      }
    },

    enablePermMatrixEdit: function () {
      AEF.state.permMatrixEditMode = true;
      this.renderPermissionsMatrix();

      // Toggle buttons
      document.getElementById('btn-edit-perm-matrix').classList.add('d-none');
      document.getElementById('btn-save-perm-matrix').classList.remove('d-none');
      document.getElementById('btn-cancel-perm-matrix').classList.remove('d-none');
    },

    cancelPermMatrixEdit: function () {
      AEF.state.permMatrixEditMode = false;
      this.renderPermissionsMatrix();

      // Toggle buttons
      document.getElementById('btn-edit-perm-matrix').classList.remove('d-none');
      document.getElementById('btn-save-perm-matrix').classList.add('d-none');
      document.getElementById('btn-cancel-perm-matrix').classList.add('d-none');
    },

    savePermMatrix: function () {
      const matrix = {};
      (this.rolesCache || []).forEach(r => {
        if (String(r.status).toUpperCase() !== 'DELETED') {
          matrix[r.role_code] = [];
        }
      });

      document.querySelectorAll('#perms-table-body .matrix-cb:checked').forEach(cb => {
        const rCode = cb.getAttribute('data-role');
        if (rCode && matrix[rCode]) {
          cb.value.split(',').forEach(val => {
            if (val && !matrix[rCode].includes(val)) {
              matrix[rCode].push(val);
            }
          });
        }
      });

      const tbody = document.getElementById('perms-table-body');
      const pagePrefixes = [];
      if (tbody) {
        tbody.querySelectorAll('tr').forEach(tr => {
          const idAttr = tr.getAttribute('id');
          if (idAttr && idAttr.startsWith('matrix-row-')) {
            const parts = idAttr.split('-');
            if (parts.length >= 4) {
              const prefix = parts.slice(3).join('-');
              if (prefix && !pagePrefixes.includes(prefix)) {
                pagePrefixes.push(prefix);
              }
            }
          }
        });
      }

      // Show loader
      const saveBtn = document.getElementById('btn-save-perm-matrix');
      const cancelBtn = document.getElementById('btn-cancel-perm-matrix');
      const origText = saveBtn ? saveBtn.innerHTML : '';
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...';
      }
      if (cancelBtn) cancelBtn.disabled = true;

      google.script.run.withSuccessHandler((res) => {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = origText;
        }
        if (cancelBtn) cancelBtn.disabled = false;

        if (res.success) {
          this.showToast('Matrix hak akses sistem berhasil diperbarui.', 'success');
          AEF.state.permMatrixEditMode = false;
          
          // Toggle buttons back
          document.getElementById('btn-edit-perm-matrix').classList.remove('d-none');
          document.getElementById('btn-save-perm-matrix').classList.add('d-none');
          document.getElementById('btn-cancel-perm-matrix').classList.add('d-none');

          this.loadPermissionsTable();
        } else {
          this.showToast('Gagal menyimpan matrix: ' + res.message, 'danger');
        }
      }).withFailureHandler((err) => {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = origText;
        }
        if (cancelBtn) cancelBtn.disabled = false;
        this.showToast('Gagal menyimpan matrix: Kesalahan server.', 'danger');
      }).apiBatchUpdateRolePermissions({
        matrix: matrix,
        prefixes: pagePrefixes,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      });
    },

    openAddPermissionModal: function () {
      document.getElementById('form-add-perm').reset();
      this.populateRoleDropdowns('', ['new-perm-role']);
      this.showModal('addPermModal');
    },

    createPermission: function () {
      const prefixEl = document.getElementById('new-perm-prefix');
      const nameEl = document.getElementById('new-perm-name');
      const roleEl = document.getElementById('new-perm-role');
      const statusEl = document.getElementById('new-perm-status');
      
      const prefix = prefixEl ? prefixEl.value.trim().toUpperCase().replace(/[^A-Z0-9_]/g, '') : '';
      const name = nameEl ? nameEl.value.trim() : '';
      const roleId = roleEl ? roleEl.value : '';
      const status = statusEl ? statusEl.value : 'ACTIVE';

      if (!prefix) return this.showToast('Gagal menambahkan: Prefix Code wajib diisi!', 'danger');
      if (!roleId) return this.showToast('Gagal menambahkan: Target Role wajib dipilih!', 'danger');

      // Show loader
      const form = document.getElementById('form-add-perm');
      const submitBtn = form ? form.querySelector('button[type="submit"]') : null;
      const origText = submitBtn ? submitBtn.innerHTML : '';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...';
      }

      google.script.run.withSuccessHandler((res) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
        }

        if (res.success) {
          this.showToast(`Permission code dengan prefix "${prefix}" berhasil ditambahkan.`, 'success');
          this.hideModal('addPermModal');
          this.loadPermissionsTable();
        } else {
          this.showToast('Gagal menambahkan: ' + res.message, 'danger');
        }
      }).withFailureHandler((err) => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
        }
        this.showToast('Gagal menambahkan: Kesalahan server.', 'danger');
      }).apiCreatePermissionsForPrefix({
        prefix: prefix,
        role_id: roleId,
        permission_name: name,
        status: status,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      });
    },

    deletePermissionPrefixFromControl: function (prefix) {
      const viewCode = `${prefix}_VIEW`;

      if (!AEF.menusCache) {
        alert('Gagal menghapus: Data menu sedang dimuat, mohon tunggu sebentar...');
        return;
      }

      const isUsed = AEF.menusCache.some(m => m.permission_code && String(m.permission_code).trim().toUpperCase() === viewCode);
      if (isUsed) {
        const menuObj = AEF.menusCache.find(m => m.permission_code && String(m.permission_code).trim().toUpperCase() === viewCode);
        alert(`Gagal menghapus: Tidak boleh dihapus karena masih digunakan di Menu Management khususnya menu: "${menuObj.menu_name}"`);
        return;
      }

      if (!confirm(`Apakah Anda yakin ingin menghapus permanent seluruh kode permission untuk prefix "${prefix}"?`)) {
        return;
      }

      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          alert(`Berhasil: Seluruh permission code dengan prefix "${prefix}" berhasil dihapus.`);
          this.loadPermissionsTable();
        } else {
          alert('Gagal menghapus: ' + res.message);
        }
      }).apiDeletePermissionsByPrefix({
        prefix: prefix,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      });
    },

    // CONFIG CRUD
    loadConfigsTable: function () {
      const tbody = document.getElementById('configs-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          this.configsCache = res.data;
          this.paginationState.configs.data = res.data;
          this.paginationState.configs.page = 1;
          this.renderConfigsPage();
        }
      }).apiGetConfigs();
    },

    renderConfigsPage: function () {

      this.renderTablePagination('configs', (c) => `
        <tr>
          <td><code>${c.config_key}</code></td>
          <td class="fw-bold text-primary">${c.config_value}</td>

    openEditConfigModal: function (configId) {

    submitUpdateConfig: function () {
      const id = document.getElementById('edit-config-id').value;
      const val = document.getElementById('edit-config-value').value;

    handleAuditSort: function (colName) {
      if (!this.state.auditSort) {
        this.state.auditSort = { column: 'timestamp', asc: false };
      }
      if (this.state.auditSort.column === colName) {
        this.state.auditSort.asc = !this.state.auditSort.asc;
      } else {
        this.state.auditSort.column = colName;
        this.state.auditSort.asc = true;
      }
      this.applyAuditFiltersAndSort();
    },

    applyAuditFiltersAndSort: function () {
      let filtered = [...(this.auditCache || [])];

      // Global Search Filter
      const query = (document.getElementById('audit-search')?.value || '').trim().toLowerCase();
      if (query) {
        filtered = filtered.filter(a => {
          return (
            String(a.timestamp || '').toLowerCase().includes(query) ||
            String(a.module || '').toLowerCase().includes(query) ||
            String(a.action || '').toLowerCase().includes(query) ||
            String(a.status || '').toLowerCase().includes(query) ||
            String(a.user_id || '').toLowerCase().includes(query) ||
            String(a.description || '').toLowerCase().includes(query) ||
            String(a.reference_id || '').toLowerCase().includes(query)
          );
        });
      }

      // Column-specific filters
      const filterRow = document.getElementById('audit-filter-row');
      if (filterRow && !filterRow.classList.contains('d-none')) {
        const filterTimestamp = (document.getElementById('audit-filter-timestamp')?.value || '').trim().toLowerCase();
        const filterModule = (document.getElementById('audit-filter-module')?.value || '').trim().toLowerCase();
        const filterAction = (document.getElementById('audit-filter-action')?.value || '').trim().toLowerCase();
        const filterUserId = (document.getElementById('audit-filter-user_id')?.value || '').trim().toLowerCase();
        const filterDescription = (document.getElementById('audit-filter-description')?.value || '').trim().toLowerCase();
        const filterReferenceId = (document.getElementById('audit-filter-reference_id')?.value || '').trim().toLowerCase();

        if (filterTimestamp) filtered = filtered.filter(a => String(a.timestamp || '').toLowerCase().includes(filterTimestamp));
        if (filterModule) filtered = filtered.filter(a => String(a.module || '').toLowerCase().includes(filterModule));
        if (filterAction) filtered = filtered.filter(a => String(a.action + '_' + a.status || '').toLowerCase().includes(filterAction));
        if (filterUserId) filtered = filtered.filter(a => String(a.user_id || '').toLowerCase().includes(filterUserId));
        if (filterDescription) filtered = filtered.filter(a => String(a.description || '').toLowerCase().includes(filterDescription));
        if (filterReferenceId) filtered = filtered.filter(a => String(a.reference_id || '').toLowerCase().includes(filterReferenceId));
      }

      // Sorting
      if (this.state.auditSort) {
        const col = this.state.auditSort.column;
        const asc = this.state.auditSort.asc;
        filtered.sort((a, b) => {
          let valA = String(a[col] || '').toLowerCase();
          let valB = String(b[col] || '').toLowerCase();

          if (col === 'action') {
            valA = String(a.action + '_' + a.status).toLowerCase();
            valB = String(b.action + '_' + b.status).toLowerCase();
          }

          if (!isNaN(valA) && !isNaN(valB)) {
            valA = Number(valA);
            valB = Number(valB);
          }

          if (valA < valB) return asc ? -1 : 1;
          if (valA > valB) return asc ? 1 : -1;
          return 0;
        });
      } else {
        // Default sort by timestamp desc
        filtered.sort((a, b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')));
      }

      this.paginationState.audit.data = filtered;
      this.paginationState.audit.page = 1;
      
      // Ensure pageSize is set correctly based on the dropdown
      const pageSizeEl = document.getElementById('audit-page-size');
      if (pageSizeEl) {
        this.paginationState.audit.pageSize = Number(pageSizeEl.value) || 20;
      }

      this.renderAuditPage();

      // Update header sorting icons
      const cols = ['timestamp', 'module', 'action', 'user_id', 'description', 'reference_id'];
      cols.forEach(c => {
        const icon = document.getElementById(`audit-sort-icon-${c}`);
        if (icon) {
          if (this.state.auditSort && this.state.auditSort.column === c) {
            icon.className = this.state.auditSort.asc ? 'bi bi-sort-up ms-1' : 'bi bi-sort-down ms-1';
            icon.style.color = '#2563eb';
            icon.classList.remove('opacity-50', 'text-muted');
          } else {
            icon.className = 'bi bi-arrow-down-up ms-1 text-muted opacity-50';
            icon.style.color = '';
          }
        }
      });
    },

    renderAuditPage: function () {
      this.renderTablePagination('audit', (a) => {
        const badgeClass = a.status === 'SUCCESS' ? 'badge-light-success' : 'badge-light-danger';
        return `<tr>

          <td><code>${a.module || '-'}</code></td>

          <td class="small text-muted"><code>${a.reference_id ? a.reference_id.substring(0, 8) + '...' : '-'}</code></td>

      }, 'audit-table-body', 'audit-pagination-info', 'audit-pagination-controls');
    },

    // MENUS MANAGEMENT CRUD & TREE HIERARCHY
    menuTreeState: { collapsed: {} },
    menuPagination: { page: 1, pageSize: 20 },
    selectedMenuDetailId: null,

    loadMenusTable: function () {
      const tbody = document.getElementById('menus-tree-tbody');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Memuat hierarki menu...</td></tr>';
      
      const addBtn = document.getElementById('btn-add-menu-trigger');
      if (addBtn) {
        if (this.hasPermission('MENU_CREATE')) {
          addBtn.classList.remove('d-none');
        } else {
          addBtn.classList.add('d-none');
        }
      }
      
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          this.menusCache = res.data;
          this.populatePermissionDropdowns('', ['new-menu-perm', 'edit-menu-perm']);
          this.populateParentMenuDropdowns('', ['new-menu-parent', 'edit-menu-parent']);
          this.renderMenusTreeTable(res.data);
        }
      }).apiGetAllMenus();
    },

    toggleSubTree: function (event, parentId) {
      if (event) event.stopPropagation();
      this.menuTreeState.collapsed[parentId] = !this.menuTreeState.collapsed[parentId];
      this.renderMenusTreeTable(this.menusCache);
    },

    toggleAllMenuTree: function () {
      const parents = (this.menusCache || []).filter(m => !m.parent_id);
      const anyExpanded = parents.some(p => !this.menuTreeState.collapsed[p.menu_id || p.id]);
      
      parents.forEach(p => {
        const pId = p.menu_id || p.id;
        this.menuTreeState.collapsed[pId] = anyExpanded;
      });

      const btnIcon = document.getElementById('btn-toggle-all-tree-icon');
      const btnText = document.getElementById('btn-toggle-all-tree-text');
      if (btnIcon) btnIcon.className = anyExpanded ? 'bi bi-arrows-expand me-1' : 'bi bi-arrows-collapse me-1';
      if (btnText) btnText.innerText = anyExpanded ? 'Expand All' : 'Collapse All';

      this.renderMenusTreeTable(this.menusCache);
    },

    renderMenusTreeTable: function (dataList) {
      const tbody = document.getElementById('menus-tree-tbody');
      const infoElem = document.getElementById('menus-pagination-info');
      const controlsElem = document.getElementById('menus-pagination-controls');
      if (!tbody) return;

      const data = dataList || this.menusCache || [];
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Tidak ada data menu ditemukan.</td></tr>';
        if (infoElem) infoElem.innerText = 'Showing 0 of 0 entries';
        if (controlsElem) controlsElem.innerHTML = '';
        return;
      }

      // Group into top-level parents and child map
      const parents = data.filter(m => !m.parent_id);
      const childrenMap = {};
      data.forEach(m => {
        if (m.parent_id) {
          if (!childrenMap[m.parent_id]) childrenMap[m.parent_id] = [];
          childrenMap[m.parent_id].push(m);
        }
      });

      // Build hierarchical row structures
      const flatTreeRows = [];

      parents.forEach(p => {
        const pId = p.menu_id || p.id;
        const pChildren = childrenMap[pId] || [];
        const isCollapsed = !!this.menuTreeState.collapsed[pId];

        flatTreeRows.push({
          item: p,
          isParent: true,
          parentId: null,
          hasChildren: pChildren.length > 0,
          isCollapsed: isCollapsed
        });

        if (!isCollapsed) {
          pChildren.forEach(c => {
            flatTreeRows.push({
              item: c,
              isParent: false,
              parentId: pId,
              hasChildren: false,
              isCollapsed: false
            });
          });
        }
      });

      // Apply Pagination
      const totalItems = flatTreeRows.length;
      const pageSize = this.menuPagination.pageSize || 20;
      const totalPages = Math.ceil(totalItems / pageSize) || 1;
      
      if (this.menuPagination.page > totalPages) this.menuPagination.page = totalPages;
      if (this.menuPagination.page < 1) this.menuPagination.page = 1;

      const currentPage = this.menuPagination.page;
      const startIndex = (currentPage - 1) * pageSize;
      const pageItems = flatTreeRows.slice(startIndex, startIndex + pageSize);

      let html = '';
      const showEdit = this.hasPermission('MENU_UPDATE') ? '' : 'd-none';
      const showDelete = this.hasPermission('MENU_DELETE') ? '' : 'd-none';
      const showAddSub = this.hasPermission('MENU_CREATE') ? '' : 'd-none';

      pageItems.forEach(row => {
        const m = row.item;
        const mId = m.menu_id || m.id;
        const typeBadge = m.type === 'Internal Link' ? 'bg-info bg-opacity-10 text-info' : (m.type === 'Sub Menu' ? 'bg-secondary bg-opacity-10 text-secondary' : 'bg-primary bg-opacity-10 text-primary');
        const statusBadge = (m.status || 'ACTIVE').toUpperCase() === 'INACTIVE' ? 'badge-light-danger' : 'badge-light-success';

        if (row.isParent) {
          const toggleIconClass = row.hasChildren ? (row.isCollapsed ? 'bi-chevron-right text-muted' : 'bi-chevron-down text-primary') : 'bi-dot text-muted';
          html += `
            <tr class="align-middle fw-semibold cursor-pointer" onclick="AEF.showMenuDetail('${mId}')" style="background-color: #ffffff;">
              <td>
                <span class="tree-toggle-btn me-2" onclick="AEF.toggleSubTree(event, '${mId}')">
                  <i class="bi ${toggleIconClass} fs-7"></i>
                </span>
                <i class="bi ${m.icon || 'bi-folder'} me-2 text-primary"></i>
                <span class="text-dark fw-bold">${m.menu_name || m.name}</span>
                <span class="text-muted ms-2 fs-8 fw-normal">(${m.menu_code || m.code})</span>
              </td>
              <td><i class="bi ${m.icon || 'bi-circle'} me-1 text-muted"></i></td>
              <td><span class="badge ${typeBadge} border-0 px-2.5 py-1.5 fs-8">${m.type || 'Module'}</span></td>
              <td><span class="badge ${statusBadge} px-2.5 py-1.5 fs-8">${m.status || 'ACTIVE'}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-link text-primary p-0 me-2 text-decoration-none ${showEdit}" onclick="event.stopPropagation(); AEF.openEditMenuModal('${mId}')"><i class="bi bi-pencil me-1"></i>Edit</button>
                <button class="btn btn-sm btn-link text-danger p-0 me-2 text-decoration-none ${showDelete}" onclick="event.stopPropagation(); AEF.deleteMenu('${mId}')"><i class="bi bi-trash me-1"></i>Delete</button>
                <button class="btn btn-sm btn-link text-success p-0 text-decoration-none ${showAddSub}" onclick="event.stopPropagation(); AEF.openAddSubMenuModal('${mId}')"><i class="bi bi-plus-circle me-1"></i>Sub-Menu</button>
              </td>
            </tr>
          `;
        } else {
          html += `
            <tr class="align-middle cursor-pointer" onclick="AEF.showMenuDetail('${mId}')" style="background-color: #f8fafc;">
              <td class="ps-4">
                <span class="text-muted me-2" style="font-family: monospace;">├─</span>
                <i class="bi ${m.icon || 'bi-file-earmark'} me-2 text-muted"></i>
                <span class="text-dark fw-medium">${m.menu_name || m.name}</span>
                <span class="text-muted ms-2 fs-8">(${m.menu_code || m.code})</span>
              </td>
              <td><i class="bi ${m.icon || 'bi-circle'} me-1 text-muted"></i></td>
              <td><span class="badge ${typeBadge} border-0 px-2.5 py-1.5 fs-8">${m.type || 'Sub Menu'}</span></td>
              <td><span class="badge ${statusBadge} px-2.5 py-1.5 fs-8">${m.status || 'ACTIVE'}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-link text-primary p-0 me-2 text-decoration-none ${showEdit}" onclick="event.stopPropagation(); AEF.openEditMenuModal('${mId}')"><i class="bi bi-pencil me-1"></i>Edit</button>
                <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none ${showDelete}" onclick="event.stopPropagation(); AEF.deleteMenu('${mId}')"><i class="bi bi-trash me-1"></i>Delete</button>
              </td>
            </tr>
          `;
        }
      });

      tbody.innerHTML = html;

      // Update Pagination UI Info & Controls
      if (infoElem) {
        const fromCount = startIndex + 1;
        const toCount = Math.min(startIndex + pageSize, totalItems);
        infoElem.innerText = `Showing ${fromCount} to ${toCount} of ${totalItems} entries`;
      }

      if (controlsElem) {
        let pagHtml = '';
        pagHtml += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${currentPage - 1});">Prev</a></li>`;
        
        for (let p = 1; p <= totalPages; p++) {
          pagHtml += `<li class="page-item ${p === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${p});">${p}</a></li>`;
        }

        pagHtml += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${currentPage + 1});">Next</a></li>`;
        controlsElem.innerHTML = pagHtml;
      }
    },

    showMenuDetail: function (menuId) {

      if (!menu) return;

      this.selectedMenuDetailId = menu.menu_id || menu.id;

      const parentMenu = (this.menusCache || []).find(m => (m.menu_id === menu.parent_id || m.id === menu.parent_id));
      const parentName = parentMenu ? (parentMenu.menu_name || parentMenu.name) : 'Top Level Module';

      document.getElementById('detail-empty-state').classList.add('d-none');
      document.getElementById('detail-content-state').classList.remove('d-none');

      document.getElementById('detail-menu-name').innerText = menu.menu_name || menu.name || '-';
      document.getElementById('detail-menu-code').innerText = menu.menu_code || menu.code || '-';
      document.getElementById('detail-menu-id').innerText = menu.menu_id || menu.id || '-';
      document.getElementById('detail-menu-parent-name').innerText = parentName;
      document.getElementById('detail-menu-route').innerText = menu.route || '-';
      document.getElementById('detail-menu-slug').innerText = menu.slug || '-';
      document.getElementById('detail-menu-icon-class').innerText = menu.icon || 'bi-circle';
      document.getElementById('detail-menu-sort').innerText = menu.sort_order !== undefined ? menu.sort_order : '1';
      document.getElementById('detail-menu-perm').innerText = menu.permission_code || 'DASHBOARD_VIEW';
      document.getElementById('detail-menu-desc').innerText = menu.description || 'Tidak ada deskripsi.';

      document.getElementById('detail-icon-preview').innerHTML = `<i class="bi ${menu.icon || 'bi-grid'}"></i>`;
      document.getElementById('detail-menu-type-badge').innerText = menu.type || 'Module';

      const statusBadge = document.getElementById('detail-menu-status-badge');
      if (statusBadge) {
        const isInactive = (menu.status || 'ACTIVE').toUpperCase() === 'INACTIVE';
        statusBadge.className = isInactive ? 'badge bg-danger-subtle text-danger border border-danger-subtle' : 'badge bg-success-subtle text-success border border-success-subtle';
        statusBadge.innerText = isInactive ? 'INACTIVE' : 'ACTIVE';

      // Check permissions for Edit Menu and Sub-Menu in details panel
      const detailEditBtn = document.querySelector('[onclick="AEF.openEditFromDetail()"]');

      if (detailSubBtn) {
        if (this.hasPermission('MENU_CREATE')) {
          detailSubBtn.classList.remove('d-none');
        } else {
          detailSubBtn.classList.add('d-none');
        }
