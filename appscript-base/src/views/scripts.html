    createMenu: function () {
      const parentId = document.getElementById('new-menu-parent').value;
      const menuCode = document.getElementById('new-menu-code').value;
      const name = document.getElementById('new-menu-name').value;
      const slug = document.getElementById('new-menu-slug').value;
      const type = document.getElementById('new-menu-type').value;
      const route = document.getElementById('new-menu-route').value;
      const icon = document.getElementById('new-menu-icon').value;
      const sortOrder = document.getElementById('new-menu-sort').value;
      const permCode = document.getElementById('new-menu-perm').value;
      const status = document.getElementById('new-menu-status').value;
      const desc = document.getElementById('new-menu-desc').value;

      if (!name || !route || !menuCode) return alert('Kode Menu, Nama Menu, dan Route wajib diisi!');

      const payload = {
        parent_id: parentId,
        menu_code: menuCode,
        menu_name: name,
        slug: slug,
        type: type,
        route: route,
        icon: icon,
        sort_order: Number(sortOrder) || 1,
        permission_code: permCode,
        status: status,
        description: desc,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      };

      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('addMenuModal');
          this.loadMenusTable();
          this.loadSidebarMenu();
        } else alert('Gagal membuat menu: ' + res.message);
      }).apiCreateMenu(payload);
    },

    submitUpdateMenu: function () {
      const menuId = document.getElementById('edit-menu-id').value;
      const parentId = document.getElementById('edit-menu-parent').value;
      const menuCode = document.getElementById('edit-menu-code').value;
      const name = document.getElementById('edit-menu-name').value;
      const slug = document.getElementById('edit-menu-slug').value;
      const type = document.getElementById('edit-menu-type').value;
      const route = document.getElementById('edit-menu-route').value;
      const icon = document.getElementById('edit-menu-icon').value;
      const sortOrder = document.getElementById('edit-menu-sort').value;
      const permCode = document.getElementById('edit-menu-perm').value;
      const status = document.getElementById('edit-menu-status').value;
      const desc = document.getElementById('edit-menu-desc').value;

      if (!menuId || !name || !route || !menuCode) return alert('Menu ID, Kode Menu, Nama Menu, dan Route wajib diisi!');

      const payload = {
        menu_id: menuId,
        parent_id: parentId,
        menu_code: menuCode,
        menu_name: name,
        slug: slug,
        type: type,
        route: route,
        icon: icon,
        sort_order: Number(sortOrder) || 1,
        permission_code: permCode,
        status: status,
        description: desc,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      };

      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('editMenuModal');
          this.loadMenusTable();
          this.loadSidebarMenu();
          if (this.selectedMenuDetailId === menuId) {
            this.showMenuDetail(menuId);
          }
        } else alert('Gagal memperbarui menu: ' + res.message);
      }).apiUpdateMenu(payload);
    },

    filterMenuTree: function () {
      const query = (document.getElementById('menu-search-input').value || '').toLowerCase();
      if (!query) return this.renderMenusTreeTable(this.menusCache);

      const filtered = (this.menusCache || []).filter(m => 
        (m.menu_name || m.name || '').toLowerCase().includes(query) ||
        (m.menu_code || m.code || '').toLowerCase().includes(query) ||
        (m.route || '').toLowerCase().includes(query)
      );
      this.menuPagination.page = 1;
      this.renderMenusTreeTable(filtered);
    },

    filterMenuStatus: function (statusVal) {
      if (statusVal === 'ALL') return this.renderMenusTreeTable(this.menusCache);
      const filtered = (this.menusCache || []).filter(m => String(m.status || 'ACTIVE').toUpperCase() === statusVal);
      this.menuPagination.page = 1;
      this.renderMenusTreeTable(filtered);
    },

    filterMenuParent: function () {
      const filterVal = document.getElementById('menu-parent-filter').value;
      if (filterVal === 'ALL') return this.renderMenusTreeTable(this.menusCache);
      if (filterVal === 'TOP') {
        const filtered = (this.menusCache || []).filter(m => !m.parent_id);
        this.menuPagination.page = 1;
        return this.renderMenusTreeTable(filtered);
      }
    },

    deleteMenu: function (menuId) {
      if (!confirm('Hapus menu ini dari hierarki?')) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.loadMenusTable();
          this.loadSidebarMenu();
        } else alert('Gagal: ' + res.message);
      }).apiDeleteMenu({ menu_id: menuId, actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    initDashboardChart: function () {
      // Update My Information & Welcome Header
      if (this.state.user) {
        const u = this.state.user;
        const wTitle = document.getElementById('dash-welcome-title');
        if (wTitle) wTitle.innerText = `Welcome back, ${u.name || 'Administrator'}! 👋`;
        
        const iName = document.getElementById('info-user-name');
        if (iName) iName.innerText = u.name || 'Administrator';

        const iEmail = document.getElementById('info-user-email');
        if (iEmail) iEmail.innerText = u.email || 'admin@example.com';

        const iRole = document.getElementById('info-user-role');
        if (iRole) iRole.innerText = u.role_id === 'ROLE_SUPER_ADMIN' ? 'Super Administrator' : (u.role_id || 'System Administrator');

        const iLogin = document.getElementById('info-user-login');
        if (iLogin) iLogin.innerText = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'medium' }) + ' WIB';
      }

      google.script.run.withSuccessHandler((res) => {
        if (!res || !res.success || !res.data) return;

        const data = res.data;
        const counts = data.counts || {};
        const actions = data.auditByAction || {};
        const modules = data.auditByModule || {};
        const trend = data.loginTrend || {};

        // Update Stat Cards Counts
        const renewalAlert = document.getElementById('renewal-warning-alert');
        const renewalText = document.getElementById('renewal-warning-text');
        if (renewalAlert && renewalText) {
          if (data.renewalWarning) {
            renewalText.innerText = data.renewalWarning.message;
            renewalAlert.classList.remove('d-none');
          } else {
            renewalAlert.classList.add('d-none');
          }
        }

        const cMenu = document.getElementById('dash-count-menu');
        if (cMenu) cMenu.innerText = counts.menus || 0;

        const cRole = document.getElementById('dash-count-role');
        if (cRole) cRole.innerText = counts.roles || 0;

        const cUser = document.getElementById('dash-count-user');
        if (cUser) cUser.innerText = counts.users || 0;

        const cPerm = document.getElementById('dash-count-perm');
        if (cPerm) cPerm.innerText = counts.permissions || 0;

        const cAudit = document.getElementById('dash-count-audit');
        if (cAudit) cAudit.innerText = (counts.audit || 0).toLocaleString();

        // 1. Chart Application Data Overview (Bar Chart)
        const ctxOverview = document.getElementById('chartAppOverview');
        if (ctxOverview) {
          if (this.chartOverviewInstance) this.chartOverviewInstance.destroy();
          this.chartOverviewInstance = new Chart(ctxOverview, {
            type: 'bar',
            data: {
              labels: ['Menu', 'Role', 'User', 'Permission'],
              datasets: [{
                label: 'Jumlah Entri',
                data: [counts.menus || 0, counts.roles || 0, counts.users || 0, counts.permissions || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316'],
                borderRadius: 6,
                barThickness: 32
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }

        // 2. Chart Audit Activity by Action (Bar Chart)
        const ctxAction = document.getElementById('chartAuditAction');
        if (ctxAction) {
          if (this.chartActionInstance) this.chartActionInstance.destroy();
          this.chartActionInstance = new Chart(ctxAction, {
            type: 'bar',
            data: {
              labels: ['Login', 'View', 'Insert', 'Update', 'Delete', 'Logout'],
              datasets: [{
                label: 'Aktivitas Hari Ini',
                data: [actions.LOGIN || 0, actions.VIEW || 0, actions.INSERT || 0, actions.UPDATE || 0, actions.DELETE || 0, actions.LOGOUT || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316', '#ef4444', '#14b8a6'],
                borderRadius: 6,
                barThickness: 28
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }

        // 3. Chart Audit Activity by Module (Horizontal Bar Chart)
        const ctxModule = document.getElementById('chartAuditModule');
        if (ctxModule) {
          if (this.chartModuleInstance) this.chartModuleInstance.destroy();
          this.chartModuleInstance = new Chart(ctxModule, {
            type: 'bar',
            data: {
              labels: ['USER', 'ROLE', 'MENU', 'PERMISSION', 'AUDIT'],
              datasets: [{
                label: 'Aktivitas Modul',
                data: [modules.USER || 0, modules.ROLE || 0, modules.MENU || 0, modules.PERMISSION || 0, modules.AUDIT || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316', '#14b8a6'],
                borderRadius: 6,
                barThickness: 16
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                y: { grid: { display: false } }
              }
            }
          });
        }

        // 4. Chart Login Trend (Last 7 Days) (Line Chart)
        const ctxTrend = document.getElementById('chartLoginTrend');
        if (ctxTrend) {
          if (this.chartTrendInstance) this.chartTrendInstance.destroy();
          this.chartTrendInstance = new Chart(ctxTrend, {
            type: 'line',
            data: {
              labels: trend.labels || ['14 Mei', '15 Mei', '16 Mei', '17 Mei', '18 Mei', '19 Mei', '20 Mei'],
              datasets: [{
                label: 'Login User',
                data: trend.data || [10, 8, 15, 12, 18, 14, 16],
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.08)',
                pointBackgroundColor: '#2563eb',
                pointRadius: 4,
                fill: true,
                tension: 0.4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }
      }).apiGetDashboardData({ actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    AEF.init();
    
    // Close profile dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const dropdown = document.querySelector('.dropdown-menu[aria-labelledby="profileDropdown"]');
      if (dropdown && !dropdown.contains(e.target) && !e.target.closest('#profileDropdown')) {
        dropdown.classList.remove('show');
      }
    });
  });
</script>
