<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
<!-- Chart.js for Dashboard (Canvas-based) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  /**
   * AppScript Enterprise Framework (AEF) Client Engine
   */
  const AEF = {
    state: {
      user: null,
      session: null,
      permissions: [],
      currentRoute: '/dashboard'
    },

    init: function () {
      this.checkSessionState();
    },

    checkSessionState: function () {
      const stored = localStorage.getItem('AEF_AUTH_DATA');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          this.state.user = parsed.user;
          this.state.session = parsed.session;
          this.state.permissions = parsed.permissions;
          this.showAppShell();
          this.loadSidebarMenu();
          this.navigateTo('/dashboard');
          return;
        } catch (e) {
          localStorage.removeItem('AEF_AUTH_DATA');
        }
      }
      this.showLoginShell();
    },

    showLoginShell: function () {
      document.getElementById('aef-app-shell').classList.add('d-none-important');
      document.getElementById('aef-login-shell').classList.remove('d-none-important');
    },

    showAppShell: function () {
      document.getElementById('aef-login-shell').classList.add('d-none-important');
      document.getElementById('aef-app-shell').classList.remove('d-none-important');
      if (this.state.user) {
        document.getElementById('user-display-name').innerText = this.state.user.name;
      }
    },

    login: function (email, password) {
      const btn = document.getElementById('btn-login-submit');
      const errorAlert = document.getElementById('login-error-alert');
      errorAlert.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
          if (res.success) {
            this.state.user = res.data.user;
            this.state.session = res.data.session;
            this.state.permissions = res.data.permissions;
            localStorage.setItem('AEF_AUTH_DATA', JSON.stringify(res.data));
            this.showAppShell();
            this.loadSidebarMenu();
            this.navigateTo('/dashboard');
          } else {
            errorAlert.innerText = res.message || 'Login Gagal';
            errorAlert.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
          errorAlert.innerText = 'Error: ' + err.message;
          errorAlert.classList.remove('d-none');
        })
        .apiLogin({ email, password });
    },

    logout: function () {
      google.script.run.apiLogout({
        session_id: this.state.session ? this.state.session.session_id : '',
        user_id: this.state.user ? this.state.user.id : ''
      });

      this.state.user = null;
      this.state.session = null;
      this.state.permissions = [];
      localStorage.removeItem('AEF_AUTH_DATA');
      this.showLoginShell();
    },

    loadSidebarMenu: function () {
      const navContainer = document.getElementById('aef-sidebar-nav');
      navContainer.innerHTML = '<div class="text-center p-3"><div class="spinner-border spinner-border-sm text-light"></div></div>';

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success && Array.isArray(res.data)) {
            let html = '';
            res.data.forEach(item => {
              const route = item.route || (item.slug ? '/' + item.slug : '#');
              const menuTitle = item.name || item.menu_name || item.code || 'Menu';
              const menuCode = item.code || item.menu_code || item.id;

              // Ensure only 1 Dashboard menu is rendered in the sidebar
              if (route === '/dashboard' || item.slug === 'dashboard' || item.menu_code === 'MENU_DASHBOARD' || menuTitle === 'Dashboard') {
                return;
              }

              const iconClass = item.icon || 'bi-circle';
              html += `
                <a href="#" class="aef-nav-link" onclick="AEF.navigateTo('${route}'); return false;" id="nav-item-${menuCode}">
                  <div class="aef-nav-left">
                    <span>${menuTitle}</span>
                    <i class="bi ${iconClass}"></i>
                  </div>
                </a>
              `;
            });
            navContainer.innerHTML = html;
          }
        })
        .apiGetMenu({ role_id: this.state.user ? this.state.user.role_id : 'ROLE_USER' });
    },

    navigateTo: function (route) {
      this.state.currentRoute = route;

      // Active state highlight
      document.querySelectorAll('.aef-nav-link').forEach(el => el.classList.remove('active'));
      const activeNav = document.querySelector(`.aef-nav-link[onclick*="${route}"]`);
      if (activeNav) activeNav.classList.add('active');

      const contentCanvas = document.getElementById('aef-main-content');
      
      if (route === '/dashboard') {
        contentCanvas.innerHTML = document.getElementById('tpl-dashboard').innerHTML;
        this.initDashboardChart();
      } else if (route === '/users') {
        contentCanvas.innerHTML = document.getElementById('tpl-users').innerHTML;
        this.loadUsersTable();
      } else if (route === '/roles') {
        contentCanvas.innerHTML = document.getElementById('tpl-roles').innerHTML;
        this.loadRolesTable();
      } else if (route === '/permissions') {
        contentCanvas.innerHTML = document.getElementById('tpl-permissions').innerHTML;
        this.loadPermissionsTable();
      } else if (route === '/config') {
        contentCanvas.innerHTML = document.getElementById('tpl-config').innerHTML;
        this.loadConfigsTable();
      } else if (route === '/audit') {
        contentCanvas.innerHTML = document.getElementById('tpl-audit').innerHTML;
        this.loadAuditLogsTable();
      } else if (route === '/menus') {
        contentCanvas.innerHTML = document.getElementById('tpl-menus').innerHTML;
        this.loadMenusTable();
      } else {
        contentCanvas.innerHTML = `
          <div class="aef-card text-center py-5">
            <i class="bi bi-compass fs-1 text-muted"></i>
            <h4 class="mt-3">Halaman ${route}</h4>
            <p class="text-muted">Modul ini siap dikembangkan sesuai metadata AEF.</p>
          </div>
        `;
      }
    },

    // PAGINATION ENGINE
    paginationState: {
      users: { page: 1, pageSize: 5, data: [] },
      roles: { page: 1, pageSize: 5, data: [] },
      perms: { page: 1, pageSize: 5, data: [] },
      configs: { page: 1, pageSize: 5, data: [] },
      audit: { page: 1, pageSize: 5, data: [] },
      menus: { page: 1, pageSize: 5, data: [] }
    },

    renderTablePagination: function (key, renderRowFn, tbodyId, infoId, controlsId) {
      const state = this.paginationState[key];
      if (!state) return;

      const tbody = document.getElementById(tbodyId);
      const infoElem = document.getElementById(infoId);
      const controlsElem = document.getElementById(controlsId);
      if (!tbody) return;

      const data = state.data || [];
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">Tidak ada data ditemukan.</td></tr>';
        if (infoElem) infoElem.innerText = 'Showing 0 to 0 of 0 entries';
        if (controlsElem) controlsElem.innerHTML = '';
        return;
      }

      const totalItems = data.length;
      const pageSize = state.pageSize || 5;
      const totalPages = Math.ceil(totalItems / pageSize);
      state.page = Math.max(1, Math.min(state.page || 1, totalPages));
      const currentPage = state.page;

      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, totalItems);
      const pageSlice = data.slice(startIdx, endIdx);

      let rowsHtml = '';
      pageSlice.forEach((item, idx) => {
        rowsHtml += renderRowFn(item, startIdx + idx);
      });
      tbody.innerHTML = rowsHtml;

      if (infoElem) {
        infoElem.innerText = `Showing ${startIdx + 1} to ${endIdx} of ${totalItems} entries`;
      }

      if (controlsElem) {
        let html = '';
        const prevDisabled = currentPage === 1 ? 'disabled' : '';
        html += `<li class="page-item ${prevDisabled}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${currentPage - 1}); return false;">Prev</a></li>`;

        for (let p = 1; p <= totalPages; p++) {
          const activeClass = p === currentPage ? 'active' : '';
          html += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${p}); return false;">${p}</a></li>`;
        }

        const nextDisabled = currentPage === totalPages ? 'disabled' : '';
        html += `<li class="page-item ${nextDisabled}"><a class="page-link" href="#" onclick="AEF.changeTablePage('${key}', ${currentPage + 1}); return false;">Next</a></li>`;

        controlsElem.innerHTML = html;
      }
    },

    changeTablePage: function (key, newPage) {
      if (!this.paginationState[key]) return;
      this.paginationState[key].page = newPage;
      if (key === 'users') this.renderUsersPage();
      else if (key === 'roles') this.renderRolesPage();
      else if (key === 'perms') this.renderPermissionsPage();
      else if (key === 'configs') this.renderConfigsPage();
      else if (key === 'audit') this.renderAuditPage();
      else if (key === 'menus') this.renderMenusPage();
    },

    // USERS CRUD
    loadUsersTable: function () {
      const tableBody = document.getElementById('users-table-body');
      if (!tableBody) return;
      tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success && Array.isArray(res.data)) {
            this.usersCache = res.data;
            this.paginationState.users.data = res.data;
            this.paginationState.users.page = 1;
            this.renderUsersPage();
          }
        })
        .apiGetUsers({ actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    renderUsersPage: function () {
      this.renderTablePagination('users', (u) => `
        <tr>
          <td class="fw-semibold" style="color: #181c32;">${u.name}</td>
          <td>${u.email}</td>
          <td><span class="badge badge-light-primary px-3 py-2 fs-7">${u.role_id}</span></td>
          <td><span class="badge badge-light-success px-3 py-2 fs-7">${u.status}</span></td>
          <td>
            <button class="btn btn-sm btn-light border text-muted me-1" onclick="AEF.openEditUserModal('${u.id}')" title="Edit User">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-light-danger text-danger border border-danger-subtle" onclick="AEF.deleteUser('${u.id}')" title="Hapus User">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `, 'users-table-body', 'users-pagination-info', 'users-pagination-controls');
    },

    showModal: function (modalId) {
      if (modalId === 'addUserModal') this.populateRoleDropdowns('', ['new-user-role']);
      if (modalId === 'addPermModal') this.populateRoleDropdowns('', ['new-perm-role']);
      if (modalId === 'addMenuModal') {
        this.populatePermissionDropdowns('', ['new-menu-perm']);
        this.populateParentMenuDropdowns('', ['new-menu-parent']);
      }

      const modalEl = document.getElementById(modalId);
      if (!modalEl) return;
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Modal) {
          let modal = bootstrap.Modal.getInstance(modalEl);
          if (!modal) modal = new bootstrap.Modal(modalEl);
          modal.show();
          return;
        }
      } catch (e) {}

      // Fallback
      modalEl.classList.add('show');
      modalEl.style.display = 'block';
      document.body.classList.add('modal-open');
    },

    populateRoleDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Pilih Role --</option>';
            res.data.forEach(r => {
              const isSelected = String(selectedVal).trim().toUpperCase() === String(r.role_code).trim().toUpperCase() ? 'selected' : '';
              options += `<option value="${r.role_code}" ${isSelected}>${r.role_name} (${r.role_code})</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetRoles();
    },

    populatePermissionDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Pilih Permission --</option>';
            res.data.forEach(p => {
              const isSelected = String(selectedVal).trim().toUpperCase() === String(p.permission_code).trim().toUpperCase() ? 'selected' : '';
              options += `<option value="${p.permission_code}" ${isSelected}>${p.permission_name} (${p.permission_code})</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetPermissions();
    },

    populateParentMenuDropdowns: function (selectedVal, elemIds) {
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          elemIds.forEach(id => {
            const selectElem = document.getElementById(id);
            if (!selectElem) return;
            let options = '<option value="">-- Main Top-Level Menu --</option>';
            res.data.forEach(m => {
              const mId = m.menu_id || m.id;
              const isSelected = String(selectedVal).trim() === String(mId).trim() ? 'selected' : '';
              options += `<option value="${mId}" ${isSelected}>${m.menu_name || m.name}</option>`;
            });
            selectElem.innerHTML = options;
          });
        }
      }).apiGetAllMenus();
    },

    hideModal: function (modalId) {
      const modalEl = document.getElementById(modalId);
      if (!modalEl) return;
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Modal) {
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
        }
      } catch (e) {}

      // Fallback cleanup
      modalEl.classList.remove('show');
      modalEl.style.display = 'none';
      document.body.classList.remove('modal-open');
      const backdrop = document.querySelector('.modal-backdrop');
      if (backdrop) backdrop.remove();
    },

    createUser: function () {
      const name = document.getElementById('new-user-name').value;
      const email = document.getElementById('new-user-email').value;
      const password = document.getElementById('new-user-password').value;
      const roleId = document.getElementById('new-user-role').value;

      if (!name || !email || !password) {
        alert('Mohon isi semua field!');
        return;
      }

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            this.hideModal('addUserModal');
            document.getElementById('form-add-user').reset();
            this.loadUsersTable();
          } else {
            alert('Gagal membuat user: ' + res.message);
          }
        })
        .apiCreateUser({
          name: name,
          email: email,
          password: password,
          role_id: roleId,
          actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
        });
    },

    openEditUserModal: function (userId) {
      const user = (this.usersCache || []).find(u => u.id === userId);
      if (!user) return;
      document.getElementById('edit-user-id').value = user.id;
      document.getElementById('edit-user-name').value = user.name;
      document.getElementById('edit-user-email').value = user.email;
      document.getElementById('edit-user-password').value = '';

      this.populateRoleDropdowns(user.role_id, ['edit-user-role']);
      this.showModal('editUserModal');
    },

    submitUpdateUser: function () {
      const userId = document.getElementById('edit-user-id').value;
      const name = document.getElementById('edit-user-name').value;
      const email = document.getElementById('edit-user-email').value;
      const roleId = document.getElementById('edit-user-role').value;
      const password = document.getElementById('edit-user-password').value;

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            this.hideModal('editUserModal');
            this.loadUsersTable();
          } else {
            alert('Gagal memperbarui user: ' + res.message);
          }
        })
        .apiUpdateUser({
          user_id: userId,
          name: name,
          email: email,
          role_id: roleId,
          password: password || undefined,
          actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
        });
    },

    deleteUser: function (userId) {
      if (!confirm('Apakah Anda yakin ingin menghapus user ini?')) return;
      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            this.loadUsersTable();
          } else {
            alert('Gagal menghapus user: ' + res.message);
          }
        })
        .apiDeleteUser({ userId: userId, actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    // ROLES CRUD
    loadRolesTable: function () {
      const tbody = document.getElementById('roles-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          this.paginationState.roles.data = res.data;
          this.paginationState.roles.page = 1;
          this.renderRolesPage();
        }
      }).apiGetRoles();
    },

    renderRolesPage: function () {
      this.renderTablePagination('roles', (r) => `
        <tr>
          <td><code>${r.role_code}</code></td>
          <td class="fw-semibold" style="color: #181c32;">${r.role_name}</td>
          <td>${r.description || '-'}</td>
          <td><span class="badge badge-light-success px-3 py-2 fs-7">${r.status}</span></td>
          <td>
            <button class="btn btn-sm btn-light-danger text-danger border border-danger-subtle" onclick="AEF.deleteRole('${r.id}')"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `, 'roles-table-body', 'roles-pagination-info', 'roles-pagination-controls');
    },

    createRole: function () {
      const code = document.getElementById('new-role-code').value;
      const name = document.getElementById('new-role-name').value;
      const desc = document.getElementById('new-role-desc').value;
      if (!code || !name) return alert('Role Code dan Nama Role wajib diisi!');
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('addRoleModal');
          document.getElementById('form-add-role').reset();
          this.loadRolesTable();
        } else alert('Gagal: ' + res.message);
      }).apiCreateRole({ role_code: code, role_name: name, description: desc });
    },

    deleteRole: function (roleId) {
      if (!confirm('Hapus role ini?')) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.success) this.loadRolesTable();
        else alert('Gagal: ' + res.message);
      }).apiDeleteRole({ role_id: roleId });
    },

    // PERMISSIONS CRUD
    loadPermissionsTable: function () {
      const tbody = document.getElementById('perms-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          this.paginationState.perms.data = res.data;
          this.paginationState.perms.page = 1;
          this.renderPermissionsPage();
        }
      }).apiGetPermissions();
    },

    renderPermissionsPage: function () {
      this.renderTablePagination('perms', (p) => `
        <tr>
          <td><span class="badge badge-light-primary px-3 py-2 fs-7">${p.role_id}</span></td>
          <td><code>${p.permission_code}</code></td>
          <td class="fw-semibold" style="color: #181c32;">${p.permission_name}</td>
          <td><span class="badge badge-light-success px-3 py-2 fs-7">${p.status}</span></td>
          <td>
            <button class="btn btn-sm btn-light-danger text-danger border border-danger-subtle" onclick="AEF.deletePermission('${p.id}')"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `, 'perms-table-body', 'perms-pagination-info', 'perms-pagination-controls');
    },

    createPermission: function () {
      const roleId = document.getElementById('new-perm-role').value;
      const code = document.getElementById('new-perm-code').value;
      const name = document.getElementById('new-perm-name').value;
      if (!roleId || !code) return alert('Role ID dan Permission Code wajib diisi!');
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('addPermModal');
          document.getElementById('form-add-perm').reset();
          this.loadPermissionsTable();
        } else alert('Gagal: ' + res.message);
      }).apiCreatePermission({ role_id: roleId, permission_code: code, permission_name: name });
    },

    deletePermission: function (permId) {
      if (!confirm('Hapus permission ini?')) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.success) this.loadPermissionsTable();
        else alert('Gagal: ' + res.message);
      }).apiDeletePermission({ perm_id: permId });
    },

    // CONFIG CRUD
    loadConfigsTable: function () {
      const tbody = document.getElementById('configs-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          this.configsCache = res.data;
          this.paginationState.configs.data = res.data;
          this.paginationState.configs.page = 1;
          this.renderConfigsPage();
        }
      }).apiGetConfigs();
    },

    renderConfigsPage: function () {
      this.renderTablePagination('configs', (c) => `
        <tr>
          <td><code>${c.config_key}</code></td>
          <td class="fw-bold text-primary">${c.config_value}</td>
          <td>${c.description || '-'}</td>
          <td>
            <button class="btn btn-sm btn-light border text-muted" onclick="AEF.openEditConfigModal('${c.id}')"><i class="bi bi-pencil me-1"></i> Edit</button>
          </td>
        </tr>
      `, 'configs-table-body', 'configs-pagination-info', 'configs-pagination-controls');
    },

    openEditConfigModal: function (configId) {
      const config = (this.configsCache || []).find(c => c.id === configId);
      if (!config) return;
      document.getElementById('edit-config-id').value = config.id;
      document.getElementById('edit-config-key').value = config.config_key;
      document.getElementById('edit-config-value').value = config.config_value;
      this.showModal('editConfigModal');
    },

    submitUpdateConfig: function () {
      const id = document.getElementById('edit-config-id').value;
      const val = document.getElementById('edit-config-value').value;
      if (!id || !val) return alert('Konfigurasi tidak boleh kosong!');
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('editConfigModal');
          this.loadConfigsTable();
        } else alert('Gagal: ' + res.message);
      }).apiUpdateConfig({ config_id: id, config_value: val });
    },

    // AUDIT LOGS VIEW
    loadAuditLogsTable: function () {
      const tbody = document.getElementById('audit-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat log...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          this.paginationState.audit.data = res.data;
          this.paginationState.audit.page = 1;
          this.renderAuditPage();
        }
      }).apiGetAuditLogs();
    },

    renderAuditPage: function () {
      this.renderTablePagination('audit', (a) => {
        const badgeClass = a.status === 'SUCCESS' ? 'badge-light-success' : 'badge-light-danger';
        return `<tr>
          <td class="small text-muted">${a.timestamp ? a.timestamp.replace('T', ' ').substring(0, 19) : '-'}</td>
          <td><code>${a.module || '-'}</code></td>
          <td><span class="badge ${badgeClass} px-3 py-2 fs-7">${a.action}_${a.status}</span></td>
          <td class="small fw-medium">${a.user_id}</td>
          <td class="small">${a.description || '-'}</td>
          <td class="small text-muted"><code>${a.reference_id ? a.reference_id.substring(0, 8) + '...' : '-'}</code></td>
        </tr>`;
      }, 'audit-table-body', 'audit-pagination-info', 'audit-pagination-controls');
    },

    // MENUS MANAGEMENT CRUD & TREE HIERARCHY
    loadMenusTable: function () {
      const tbody = document.getElementById('menus-tree-tbody');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Memuat hierarki menu...</td></tr>';
      
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          this.menusCache = res.data;
          this.populatePermissionDropdowns('', ['side-menu-perm', 'new-menu-perm']);
          this.populateParentMenuDropdowns('', ['side-menu-parent', 'new-menu-parent']);
          this.renderMenusTreeTable(res.data);
        }
      }).apiGetAllMenus();
    },

    renderMenusTreeTable: function (dataList) {
      const tbody = document.getElementById('menus-tree-tbody');
      const infoElem = document.getElementById('menus-pagination-info');
      if (!tbody) return;

      const data = dataList || this.menusCache || [];
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Tidak ada data menu ditemukan.</td></tr>';
        if (infoElem) infoElem.innerText = 'Showing 0 of 0 entries';
        return;
      }

      // Group into parents and children
      const parents = data.filter(m => !m.parent_id);
      const childrenMap = {};
      data.forEach(m => {
        if (m.parent_id) {
          if (!childrenMap[m.parent_id]) childrenMap[m.parent_id] = [];
          childrenMap[m.parent_id].push(m);
        }
      });

      let html = '';
      let totalCount = 0;

      parents.forEach(p => {
        totalCount++;
        const pId = p.menu_id || p.id;
        const pChildren = childrenMap[pId] || [];
        const hasChildren = pChildren.length > 0;
        const toggleIcon = hasChildren ? '<i class="bi bi-chevron-down text-primary me-2 fs-7"></i>' : '<i class="bi bi-chevron-right text-muted me-2 fs-7"></i>';
        const typeBadge = p.type === 'Internal Link' ? 'bg-info bg-opacity-10 text-info' : 'bg-primary bg-opacity-10 text-primary';
        const statusBadge = p.status === 'INACTIVE' ? 'badge-light-danger' : 'badge-light-success';

        html += `
          <tr class="align-middle fw-semibold" style="background-color: #ffffff;">
            <td>
              <span class="cursor-pointer me-1">${toggleIcon}</span>
              <i class="bi ${p.icon || 'bi-folder'} me-2 text-dark"></i>
              <span class="text-dark cursor-pointer" onclick="AEF.loadSideMenuForEdit('${pId}')">${p.menu_name || p.name}</span>
            </td>
            <td><i class="bi ${p.icon || 'bi-circle'} me-1"></i></td>
            <td><span class="badge ${typeBadge} border-0 px-2.5 py-1.5 fs-8">${p.type || 'Module'}</span></td>
            <td><span class="badge ${statusBadge} px-2.5 py-1.5 fs-8">${p.status || 'ACTIVE'}</span></td>
            <td>
              <button class="btn btn-sm btn-link text-primary p-0 me-2 text-decoration-none" onclick="AEF.loadSideMenuForEdit('${pId}')"><i class="bi bi-pencil me-1"></i>Edit</button>
              <button class="btn btn-sm btn-link text-danger p-0 me-2 text-decoration-none" onclick="AEF.deleteMenu('${pId}')"><i class="bi bi-trash me-1"></i>Delete</button>
              <button class="btn btn-sm btn-link text-primary p-0 text-decoration-none" onclick="AEF.openAddSubMenu('${pId}')"><i class="bi bi-plus-circle me-1"></i>Add Sub-Menu</button>
            </td>
          </tr>
        `;

        pChildren.forEach(c => {
          totalCount++;
          const cId = c.menu_id || c.id;
          const cTypeBadge = c.type === 'Internal Link' ? 'bg-info bg-opacity-10 text-info' : 'bg-secondary bg-opacity-10 text-secondary';
          const cStatusBadge = c.status === 'INACTIVE' ? 'badge-light-danger' : 'badge-light-success';

          html += `
            <tr class="align-middle" style="background-color: #f8fafc;">
              <td class="ps-4">
                <span class="text-muted me-2" style="font-family: monospace;">├─</span>
                <i class="bi ${c.icon || 'bi-file-earmark'} me-2 text-muted"></i>
                <span class="text-dark cursor-pointer fw-medium" onclick="AEF.loadSideMenuForEdit('${cId}')">${c.menu_name || c.name}</span>
              </td>
              <td><i class="bi ${c.icon || 'bi-circle'} me-1"></i></td>
              <td><span class="badge ${cTypeBadge} border-0 px-2.5 py-1.5 fs-8">${c.type || 'Sub Menu'}</span></td>
              <td><span class="badge ${cStatusBadge} px-2.5 py-1.5 fs-8">${c.status || 'ACTIVE'}</span></td>
              <td>
                <button class="btn btn-sm btn-link text-primary p-0 me-2 text-decoration-none" onclick="AEF.loadSideMenuForEdit('${cId}')"><i class="bi bi-pencil me-1"></i>Edit</button>
                <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none" onclick="AEF.deleteMenu('${cId}')"><i class="bi bi-trash me-1"></i>Delete</button>
              </td>
            </tr>
          `;
        });
      });

      tbody.innerHTML = html;
      if (infoElem) infoElem.innerText = `Showing ${totalCount} entries in hierarchy`;
    },

    loadSideMenuForEdit: function (menuId) {
      const menu = (this.menusCache || []).find(m => (m.menu_id === menuId || m.id === menuId));
      if (!menu) return;

      document.getElementById('side-menu-id').value = menu.menu_id || menu.id;
      document.getElementById('side-menu-name').value = menu.menu_name || menu.name || '';
      document.getElementById('side-menu-slug').value = menu.slug || String(menu.menu_name || menu.name).toLowerCase().replace(/\s+/g, '-');
      document.getElementById('side-menu-desc').value = menu.description || '';
      document.getElementById('side-menu-icon').value = menu.icon || 'bi-circle';
      document.getElementById('side-menu-type').value = menu.type || 'Module';
      document.getElementById('side-menu-parent').value = menu.parent_id || '';
      document.getElementById('side-menu-route').value = menu.route || '';
      document.getElementById('side-menu-perm').value = menu.permission_code || 'MENU_VIEW';

      const modeBadge = document.getElementById('side-form-mode');
      if (modeBadge) {
        modeBadge.className = 'badge badge-light-warning';
        modeBadge.innerText = 'Edit Menu';
      }

      this.updateIconPreview();
    },

    openAddSubMenu: function (parentId) {
      this.resetSideMenuForm();
      const parentSelect = document.getElementById('side-menu-parent');
      if (parentSelect) parentSelect.value = parentId;

      const typeSelect = document.getElementById('side-menu-type');
      if (typeSelect) typeSelect.value = 'Sub Menu';

      const modeBadge = document.getElementById('side-form-mode');
      if (modeBadge) {
        modeBadge.className = 'badge badge-light-primary';
        modeBadge.innerText = 'Add Sub-Menu';
      }

      const nameInput = document.getElementById('side-menu-name');
      if (nameInput) nameInput.focus();
    },

    resetSideMenuForm: function () {
      const form = document.getElementById('form-side-menu');
      if (form) form.reset();
      document.getElementById('side-menu-id').value = '';

      const modeBadge = document.getElementById('side-form-mode');
      if (modeBadge) {
        modeBadge.className = 'badge badge-light-primary';
        modeBadge.innerText = 'New Menu';
      }

      this.updateIconPreview();
    },

    autoGenerateSlug: function () {
      const name = document.getElementById('side-menu-name').value;
      const slugInput = document.getElementById('side-menu-slug');
      if (slugInput && name) {
        slugInput.value = name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');
      }
    },

    updateIconPreview: function () {
      const iconVal = document.getElementById('side-menu-icon').value || 'bi-circle';
      const preview = document.getElementById('side-menu-icon-preview');
      if (preview) preview.innerHTML = `<i class="bi ${iconVal}"></i>`;
    },

    saveSideMenu: function () {
      const menuId = document.getElementById('side-menu-id').value;
      const name = document.getElementById('side-menu-name').value;
      const slug = document.getElementById('side-menu-slug').value;
      const desc = document.getElementById('side-menu-desc').value;
      const icon = document.getElementById('side-menu-icon').value;
      const type = document.getElementById('side-menu-type').value;
      const parentId = document.getElementById('side-menu-parent').value;
      const route = document.getElementById('side-menu-route').value;
      const perm = document.getElementById('side-menu-perm').value;

      if (!name || !route) return alert('Nama Menu dan Route wajib diisi!');

      const payload = {
        menu_id: menuId,
        menu_name: name,
        slug: slug,
        description: desc,
        icon: icon,
        type: type,
        parent_id: parentId,
        route: route,
        permission_code: perm,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      };

      if (menuId) {
        google.script.run.withSuccessHandler((res) => {
          if (res.success) {
            this.resetSideMenuForm();
            this.loadMenusTable();
            this.loadSidebarMenu();
          } else alert('Gagal memperbarui menu: ' + res.message);
        }).apiUpdateMenu(payload);
      } else {
        google.script.run.withSuccessHandler((res) => {
          if (res.success) {
            this.resetSideMenuForm();
            this.loadMenusTable();
            this.loadSidebarMenu();
          } else alert('Gagal membuat menu: ' + res.message);
        }).apiCreateMenu(payload);
      }
    },

    filterMenuTree: function () {
      const query = (document.getElementById('menu-search-input').value || '').toLowerCase();
      if (!query) return this.renderMenusTreeTable(this.menusCache);

      const filtered = (this.menusCache || []).filter(m => 
        (m.menu_name || m.name || '').toLowerCase().includes(query) ||
        (m.menu_code || m.code || '').toLowerCase().includes(query) ||
        (m.route || '').toLowerCase().includes(query)
      );
      this.renderMenusTreeTable(filtered);
    },

    filterMenuStatus: function (statusVal) {
      if (statusVal === 'ALL') return this.renderMenusTreeTable(this.menusCache);
      const filtered = (this.menusCache || []).filter(m => String(m.status || 'ACTIVE').toUpperCase() === statusVal);
      this.renderMenusTreeTable(filtered);
    },

    filterMenuParent: function () {
      const filterVal = document.getElementById('menu-parent-filter').value;
      if (filterVal === 'ALL') return this.renderMenusTreeTable(this.menusCache);
      if (filterVal === 'TOP') {
        const filtered = (this.menusCache || []).filter(m => !m.parent_id);
        return this.renderMenusTreeTable(filtered);
      }
    },

    createMenu: function () {
      this.saveSideMenu();
    },

    openEditMenuModal: function (menuId) {
      this.loadSideMenuForEdit(menuId);
    },

    submitUpdateMenu: function () {
      this.saveSideMenu();
    },

    deleteMenu: function (menuId) {
      if (!confirm('Hapus menu ini dari hierarki?')) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.loadMenusTable();
          this.loadSidebarMenu();
        } else alert('Gagal: ' + res.message);
      }).apiDeleteMenu({ menu_id: menuId, actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    initDashboardChart: function () {
      // Update My Information & Welcome Header
      if (this.state.user) {
        const u = this.state.user;
        const wTitle = document.getElementById('dash-welcome-title');
        if (wTitle) wTitle.innerText = `Welcome back, ${u.name || 'Administrator'}! 👋`;
        
        const iName = document.getElementById('info-user-name');
        if (iName) iName.innerText = u.name || 'Administrator';

        const iEmail = document.getElementById('info-user-email');
        if (iEmail) iEmail.innerText = u.email || 'admin@example.com';

        const iRole = document.getElementById('info-user-role');
        if (iRole) iRole.innerText = u.role_id === 'ROLE_SUPER_ADMIN' ? 'Super Administrator' : (u.role_id || 'System Administrator');

        const iLogin = document.getElementById('info-user-login');
        if (iLogin) iLogin.innerText = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'medium' }) + ' WIB';
      }

      google.script.run.withSuccessHandler((res) => {
        if (!res || !res.success || !res.data) return;

        const data = res.data;
        const counts = data.counts || {};
        const actions = data.auditByAction || {};
        const modules = data.auditByModule || {};
        const trend = data.loginTrend || {};

        // Update Stat Cards Counts
        const cMenu = document.getElementById('dash-count-menu');
        if (cMenu) cMenu.innerText = counts.menus || 0;

        const cRole = document.getElementById('dash-count-role');
        if (cRole) cRole.innerText = counts.roles || 0;

        const cUser = document.getElementById('dash-count-user');
        if (cUser) cUser.innerText = counts.users || 0;

        const cPerm = document.getElementById('dash-count-perm');
        if (cPerm) cPerm.innerText = counts.permissions || 0;

        const cAudit = document.getElementById('dash-count-audit');
        if (cAudit) cAudit.innerText = (counts.audit || 0).toLocaleString();

        // 1. Chart Application Data Overview (Bar Chart)
        const ctxOverview = document.getElementById('chartAppOverview');
        if (ctxOverview) {
          if (this.chartOverviewInstance) this.chartOverviewInstance.destroy();
          this.chartOverviewInstance = new Chart(ctxOverview, {
            type: 'bar',
            data: {
              labels: ['Menu', 'Role', 'User', 'Permission'],
              datasets: [{
                label: 'Jumlah Entri',
                data: [counts.menus || 0, counts.roles || 0, counts.users || 0, counts.permissions || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316'],
                borderRadius: 6,
                barThickness: 32
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }

        // 2. Chart Audit Activity by Action (Bar Chart)
        const ctxAction = document.getElementById('chartAuditAction');
        if (ctxAction) {
          if (this.chartActionInstance) this.chartActionInstance.destroy();
          this.chartActionInstance = new Chart(ctxAction, {
            type: 'bar',
            data: {
              labels: ['Login', 'View', 'Insert', 'Update', 'Delete', 'Logout'],
              datasets: [{
                label: 'Aktivitas Hari Ini',
                data: [actions.LOGIN || 0, actions.VIEW || 0, actions.INSERT || 0, actions.UPDATE || 0, actions.DELETE || 0, actions.LOGOUT || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316', '#ef4444', '#14b8a6'],
                borderRadius: 6,
                barThickness: 28
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }

        // 3. Chart Audit Activity by Module (Horizontal Bar Chart)
        const ctxModule = document.getElementById('chartAuditModule');
        if (ctxModule) {
          if (this.chartModuleInstance) this.chartModuleInstance.destroy();
          this.chartModuleInstance = new Chart(ctxModule, {
            type: 'bar',
            data: {
              labels: ['USER', 'ROLE', 'MENU', 'PERMISSION', 'AUDIT'],
              datasets: [{
                label: 'Aktivitas Modul',
                data: [modules.USER || 0, modules.ROLE || 0, modules.MENU || 0, modules.PERMISSION || 0, modules.AUDIT || 0],
                backgroundColor: ['#2563eb', '#10b981', '#8b5cf6', '#f97316', '#14b8a6'],
                borderRadius: 6,
                barThickness: 16
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                y: { grid: { display: false } }
              }
            }
          });
        }

        // 4. Chart Login Trend (Last 7 Days) (Line Chart)
        const ctxTrend = document.getElementById('chartLoginTrend');
        if (ctxTrend) {
          if (this.chartTrendInstance) this.chartTrendInstance.destroy();
          this.chartTrendInstance = new Chart(ctxTrend, {
            type: 'line',
            data: {
              labels: trend.labels || ['14 Mei', '15 Mei', '16 Mei', '17 Mei', '18 Mei', '19 Mei', '20 Mei'],
              datasets: [{
                label: 'Login User',
                data: trend.data || [10, 8, 15, 12, 18, 14, 16],
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.08)',
                pointBackgroundColor: '#2563eb',
                pointRadius: 4,
                fill: true,
                tension: 0.4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } }
              }
            }
          });
        }
      }).apiGetDashboardData({ actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    AEF.init();
  });
</script>
