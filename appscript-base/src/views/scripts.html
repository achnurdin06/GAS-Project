<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
<!-- Chart.js for Dashboard (Canvas-based) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  /**
   * AppScript Enterprise Framework (AEF) Client Engine
   */
  const AEF = {
    state: {
      user: null,
      session: null,
      permissions: [],
      currentRoute: '/dashboard'
    },

    init: function () {
      this.checkSessionState();
    },

    checkSessionState: function () {
      const stored = localStorage.getItem('AEF_AUTH_DATA');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          this.state.user = parsed.user;
          this.state.session = parsed.session;
          this.state.permissions = parsed.permissions;
          this.showAppShell();
          this.loadSidebarMenu();
          this.navigateTo('/dashboard');
          return;
        } catch (e) {
          localStorage.removeItem('AEF_AUTH_DATA');
        }
      }
      this.showLoginShell();
    },

    showLoginShell: function () {
      document.getElementById('aef-app-shell').classList.add('d-none-important');
      document.getElementById('aef-login-shell').classList.remove('d-none-important');
    },

    showAppShell: function () {
      document.getElementById('aef-login-shell').classList.add('d-none-important');
      document.getElementById('aef-app-shell').classList.remove('d-none-important');
      if (this.state.user) {
        document.getElementById('user-display-name').innerText = this.state.user.name;
      }
    },

    login: function (email, password) {
      const btn = document.getElementById('btn-login-submit');
      const errorAlert = document.getElementById('login-error-alert');
      errorAlert.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
          if (res.success) {
            this.state.user = res.data.user;
            this.state.session = res.data.session;
            this.state.permissions = res.data.permissions;
            localStorage.setItem('AEF_AUTH_DATA', JSON.stringify(res.data));
            this.showAppShell();
            this.loadSidebarMenu();
            this.navigateTo('/dashboard');
          } else {
            errorAlert.innerText = res.message || 'Login Gagal';
            errorAlert.classList.remove('d-none');
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
          errorAlert.innerText = 'Error: ' + err.message;
          errorAlert.classList.remove('d-none');
        })
        .apiLogin({ email, password });
    },

    logout: function () {
      google.script.run.apiLogout({
        session_id: this.state.session ? this.state.session.session_id : '',
        user_id: this.state.user ? this.state.user.id : ''
      });

      this.state.user = null;
      this.state.session = null;
      this.state.permissions = [];
      localStorage.removeItem('AEF_AUTH_DATA');
      this.showLoginShell();
    },

    loadSidebarMenu: function () {
      const navContainer = document.getElementById('aef-sidebar-nav');
      navContainer.innerHTML = '<div class="text-center p-3"><div class="spinner-border spinner-border-sm text-light"></div></div>';

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success && Array.isArray(res.data)) {
            let html = '';
            res.data.forEach(item => {
              const iconClass = item.icon || 'bi-circle';
              html += `
                <a href="#" class="aef-nav-link" onclick="AEF.navigateTo('${item.route}'); return false;" id="nav-item-${item.menu_code}">
                  <i class="bi ${iconClass}"></i>
                  <span>${item.menu_name}</span>
                </a>
              `;
            });
            navContainer.innerHTML = html;
          }
        })
        .apiGetMenu({ role_id: this.state.user ? this.state.user.role_id : 'ROLE_USER' });
    },

    navigateTo: function (route) {
      this.state.currentRoute = route;

      // Active state highlight
      document.querySelectorAll('.aef-nav-link').forEach(el => el.classList.remove('active'));
      const activeNav = document.querySelector(`.aef-nav-link[onclick*="${route}"]`);
      if (activeNav) activeNav.classList.add('active');

      const contentCanvas = document.getElementById('aef-main-content');
      
      if (route === '/dashboard') {
        contentCanvas.innerHTML = document.getElementById('tpl-dashboard').innerHTML;
        this.initDashboardChart();
      } else if (route === '/users') {
        contentCanvas.innerHTML = document.getElementById('tpl-users').innerHTML;
        this.loadUsersTable();
      } else if (route === '/roles') {
        contentCanvas.innerHTML = document.getElementById('tpl-roles').innerHTML;
        this.loadRolesTable();
      } else if (route === '/permissions') {
        contentCanvas.innerHTML = document.getElementById('tpl-permissions').innerHTML;
        this.loadPermissionsTable();
      } else if (route === '/config') {
        contentCanvas.innerHTML = document.getElementById('tpl-config').innerHTML;
        this.loadConfigsTable();
      } else if (route === '/audit') {
        contentCanvas.innerHTML = document.getElementById('tpl-audit').innerHTML;
        this.loadAuditLogsTable();
      } else {
        contentCanvas.innerHTML = `
          <div class="aef-card text-center py-5">
            <i class="bi bi-compass fs-1 text-muted"></i>
            <h4 class="mt-3">Halaman ${route}</h4>
            <p class="text-muted">Modul ini siap dikembangkan sesuai metadata AEF.</p>
          </div>
        `;
      }
    },

    loadUsersTable: function () {
      const tableBody = document.getElementById('users-table-body');
      if (!tableBody) return;
      tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success && Array.isArray(res.data)) {
            this.usersCache = res.data;
            if (res.data.length === 0) {
              tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Tidak ada data user.</td></tr>';
              return;
            }
            let rows = '';
            res.data.forEach(u => {
              rows += `
                <tr>
                  <td class="fw-semibold" style="color: #181c32;">${u.name}</td>
                  <td>${u.email}</td>
                  <td><span class="badge badge-light-primary px-3 py-2 fs-7">${u.role_id}</span></td>
                  <td><span class="badge badge-light-success px-3 py-2 fs-7">${u.status}</span></td>
                  <td>
                    <button class="btn btn-sm btn-light border text-muted me-1" onclick="AEF.openEditUserModal('${u.id}')" title="Edit User">
                      <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-light-danger text-danger border border-danger-subtle" onclick="AEF.deleteUser('${u.id}')" title="Hapus User">
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>
              `;
            });
            tableBody.innerHTML = rows;
          }
        })
        .apiGetUsers({ actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    showModal: function (modalId) {
      const modalEl = document.getElementById(modalId);
      if (!modalEl) return;
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Modal) {
          let modal = bootstrap.Modal.getInstance(modalEl);
          if (!modal) modal = new bootstrap.Modal(modalEl);
          modal.show();
          return;
        }
      } catch (e) {}

      // Fallback
      modalEl.classList.add('show');
      modalEl.style.display = 'block';
      document.body.classList.add('modal-open');
    },

    hideModal: function (modalId) {
      const modalEl = document.getElementById(modalId);
      if (!modalEl) return;
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap && bootstrap.Modal) {
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
        }
      } catch (e) {}

      // Fallback cleanup
      modalEl.classList.remove('show');
      modalEl.style.display = 'none';
      document.body.classList.remove('modal-open');
      const backdrop = document.querySelector('.modal-backdrop');
      if (backdrop) backdrop.remove();
    },

    createUser: function () {
      const name = document.getElementById('new-user-name').value;
      const email = document.getElementById('new-user-email').value;
      const password = document.getElementById('new-user-password').value;
      const roleId = document.getElementById('new-user-role').value;

      if (!name || !email || !password) {
        alert('Mohon isi semua field!');
        return;
      }

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            this.hideModal('addUserModal');
            document.getElementById('form-add-user').reset();
            this.loadUsersTable();
          } else {
            alert('Gagal membuat user: ' + res.message);
          }
        })
        .apiCreateUser({
          name: name,
          email: email,
          password: password,
          role_id: roleId,
          actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
        });
    },

    openEditUserModal: function (userId) {
      const user = (this.usersCache || []).find(u => u.id === userId);
      if (!user) return;
      document.getElementById('edit-user-id').value = user.id;
      document.getElementById('edit-user-name').value = user.name;
      document.getElementById('edit-user-email').value = user.email;
      document.getElementById('edit-user-role').value = user.role_id;
      document.getElementById('edit-user-password').value = '';

      this.showModal('editUserModal');
    },

    submitUpdateUser: function () {
      const userId = document.getElementById('edit-user-id').value;
      const name = document.getElementById('edit-user-name').value;
      const email = document.getElementById('edit-user-email').value;
      const roleId = document.getElementById('edit-user-role').value;
      const password = document.getElementById('edit-user-password').value;

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            this.hideModal('editUserModal');
            this.loadUsersTable();
          } else {
            alert('Gagal memperbarui user: ' + res.message);
          }
        })
        .apiUpdateUser({
          user_id: userId,
          name: name,
          email: email,
          role_id: roleId,
          password: password || undefined,
          actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
        });
    },

    deleteUser: function (userId) {
      if (!confirm('Apakah Anda yakin ingin menghapus user ini?')) return;
      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            this.loadUsersTable();
          } else {
            alert('Gagal menghapus user: ' + res.message);
          }
        })
        .apiDeleteUser({ userId: userId, actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

    // ROLES CRUD
    loadRolesTable: function () {
      const tbody = document.getElementById('roles-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          if (res.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Tidak ada data role.</td></tr>';
            return;
          }
          let rows = '';
          res.data.forEach(r => {
            rows += `<tr>
              <td><code>${r.role_code}</code></td>
              <td class="fw-semibold" style="color: #181c32;">${r.role_name}</td>
              <td>${r.description || '-'}</td>
              <td><span class="badge badge-light-success px-3 py-2 fs-7">${r.status}</span></td>
              <td>
                <button class="btn btn-sm btn-light-danger text-danger border border-danger-subtle" onclick="AEF.deleteRole('${r.id}')"><i class="bi bi-trash"></i></button>
              </td>
            </tr>`;
          });
          tbody.innerHTML = rows;
        }
      }).apiGetRoles();
    },

    createRole: function () {
      const code = document.getElementById('new-role-code').value;
      const name = document.getElementById('new-role-name').value;
      const desc = document.getElementById('new-role-desc').value;
      if (!code || !name) return alert('Role Code dan Nama Role wajib diisi!');
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('addRoleModal');
          document.getElementById('form-add-role').reset();
          this.loadRolesTable();
        } else alert('Gagal: ' + res.message);
      }).apiCreateRole({ role_code: code, role_name: name, description: desc });
    },

    deleteRole: function (roleId) {
      if (!confirm('Hapus role ini?')) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.success) this.loadRolesTable();
        else alert('Gagal: ' + res.message);
      }).apiDeleteRole({ role_id: roleId });
    },

    // PERMISSIONS CRUD
    loadPermissionsTable: function () {
      const tbody = document.getElementById('perms-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          if (res.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Tidak ada data permission.</td></tr>';
            return;
          }
          let rows = '';
          res.data.forEach(p => {
            rows += `<tr>
              <td><span class="badge badge-light-primary px-3 py-2 fs-7">${p.role_id}</span></td>
              <td><code>${p.permission_code}</code></td>
              <td class="fw-semibold" style="color: #181c32;">${p.permission_name}</td>
              <td><span class="badge badge-light-success px-3 py-2 fs-7">${p.status}</span></td>
              <td>
                <button class="btn btn-sm btn-light-danger text-danger border border-danger-subtle" onclick="AEF.deletePermission('${p.id}')"><i class="bi bi-trash"></i></button>
              </td>
            </tr>`;
          });
          tbody.innerHTML = rows;
        }
      }).apiGetPermissions();
    },

    createPermission: function () {
      const roleId = document.getElementById('new-perm-role').value;
      const code = document.getElementById('new-perm-code').value;
      const name = document.getElementById('new-perm-name').value;
      if (!roleId || !code) return alert('Role ID dan Permission Code wajib diisi!');
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('addPermModal');
          document.getElementById('form-add-perm').reset();
          this.loadPermissionsTable();
        } else alert('Gagal: ' + res.message);
      }).apiCreatePermission({ role_id: roleId, permission_code: code, permission_name: name });
    },

    deletePermission: function (permId) {
      if (!confirm('Hapus permission ini?')) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.success) this.loadPermissionsTable();
        else alert('Gagal: ' + res.message);
      }).apiDeletePermission({ perm_id: permId });
    },

    // CONFIG CRUD
    loadConfigsTable: function () {
      const tbody = document.getElementById('configs-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat data...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          let rows = '';
          res.data.forEach(c => {
            rows += `<tr>
              <td><code>${c.config_key}</code></td>
              <td class="fw-bold text-primary">${c.config_value}</td>
              <td>${c.description || '-'}</td>
              <td>
                <button class="btn btn-sm btn-light border text-muted" onclick="AEF.updateConfigPrompt('${c.id}', '${c.config_key}', '${c.config_value}')"><i class="bi bi-pencil me-1"></i> Edit</button>
              </td>
            </tr>`;
          });
          tbody.innerHTML = rows;
        }
      }).apiGetConfigs();
    },

    updateConfigPrompt: function (id, key, val) {
      const newVal = prompt(`Ubah nilai untuk ${key}:`, val);
      if (newVal !== null && newVal !== val) {
        google.script.run.withSuccessHandler((res) => {
          if (res.success) this.loadConfigsTable();
          else alert('Gagal: ' + res.message);
        }).apiUpdateConfig({ config_id: id, config_value: newVal });
      }
    },

    // AUDIT LOGS VIEW
    loadAuditLogsTable: function () {
      const tbody = document.getElementById('audit-table-body');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div> Memuat log...</td></tr>';
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          if (res.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Belum ada log audit.</td></tr>';
            return;
          }
          let rows = '';
          res.data.forEach(a => {
            const badgeClass = a.status === 'SUCCESS' ? 'badge-light-success' : 'badge-light-danger';
            rows += `<tr>
              <td class="small text-muted">${a.timestamp ? a.timestamp.replace('T', ' ').substring(0, 19) : '-'}</td>
              <td><code>${a.module || '-'}</code></td>
              <td><span class="badge ${badgeClass} px-3 py-2 fs-7">${a.action}_${a.status}</span></td>
              <td class="small fw-medium">${a.user_id}</td>
              <td class="small">${a.description || '-'}</td>
              <td class="small text-muted"><code>${a.reference_id ? a.reference_id.substring(0, 8) + '...' : '-'}</code></td>
            </tr>`;
          });
          tbody.innerHTML = rows;
        }
      }).apiGetAuditLogs();
    },

    initDashboardChart: function () {
      const ctx = document.getElementById('aefActivityChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
          datasets: [{
            label: 'System Activity Events',
            data: [12, 19, 8, 15, 22, 10, 25],
            borderColor: '#009ef7',
            backgroundColor: 'rgba(0, 158, 247, 0.08)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#a1a5b7' } } },
          scales: {
            x: { ticks: { color: '#a1a5b7' }, grid: { color: '#f1f1f4' } },
            y: { ticks: { color: '#a1a5b7' }, grid: { color: '#f1f1f4' } }
          }
        }
      });
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    AEF.init();
  });
</script>
