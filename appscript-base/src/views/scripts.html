    // MENUS MANAGEMENT CRUD & TREE HIERARCHY
    menuTreeState: { collapsed: {} },
    menuPagination: { page: 1, pageSize: 20 },
    selectedMenuDetailId: null,

    loadMenusTable: function () {
      const tbody = document.getElementById('menus-tree-tbody');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Memuat hierarki menu...</td></tr>';
      
      const addBtn = document.getElementById('btn-add-menu-trigger');
      if (addBtn) {
        if (this.hasPermission('MENU_CREATE')) {
          addBtn.classList.remove('d-none');
        } else {
          addBtn.classList.add('d-none');
        }
      }
      
      google.script.run.withSuccessHandler((res) => {
        if (res.success && Array.isArray(res.data)) {
          this.menusCache = res.data;
          this.populatePermissionDropdowns('', ['new-menu-perm', 'edit-menu-perm']);
          this.populateParentMenuDropdowns('', ['new-menu-parent', 'edit-menu-parent']);
          this.renderMenusTreeTable(res.data);
        }
      }).apiGetAllMenus();
    },

    toggleSubTree: function (event, parentId) {
      if (event) event.stopPropagation();
      this.menuTreeState.collapsed[parentId] = !this.menuTreeState.collapsed[parentId];
      this.renderMenusTreeTable(this.menusCache);
    },

    toggleAllMenuTree: function () {
      const parents = (this.menusCache || []).filter(m => !m.parent_id);
      const anyExpanded = parents.some(p => !this.menuTreeState.collapsed[p.menu_id || p.id]);
      
      parents.forEach(p => {
        const pId = p.menu_id || p.id;
        this.menuTreeState.collapsed[pId] = anyExpanded;
      });

      const btnIcon = document.getElementById('btn-toggle-all-tree-icon');
      const btnText = document.getElementById('btn-toggle-all-tree-text');
      if (btnIcon) btnIcon.className = anyExpanded ? 'bi bi-arrows-expand me-1' : 'bi bi-arrows-collapse me-1';
      if (btnText) btnText.innerText = anyExpanded ? 'Expand All' : 'Collapse All';

      this.renderMenusTreeTable(this.menusCache);
    },

    renderMenusTreeTable: function (dataList) {
      const tbody = document.getElementById('menus-tree-tbody');
      const infoElem = document.getElementById('menus-pagination-info');
      const controlsElem = document.getElementById('menus-pagination-controls');
      if (!tbody) return;

      const data = dataList || this.menusCache || [];
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Tidak ada data menu ditemukan.</td></tr>';
        if (infoElem) infoElem.innerText = 'Showing 0 of 0 entries';
        if (controlsElem) controlsElem.innerHTML = '';
        return;
      }

      // Group into top-level parents and child map
      const parents = data.filter(m => !m.parent_id);
      const childrenMap = {};
      data.forEach(m => {
        if (m.parent_id) {
          if (!childrenMap[m.parent_id]) childrenMap[m.parent_id] = [];
          childrenMap[m.parent_id].push(m);
        }
      });

      // Build hierarchical row structures
      const flatTreeRows = [];

      parents.forEach(p => {
        const pId = p.menu_id || p.id;
        const pChildren = childrenMap[pId] || [];
        const isCollapsed = !!this.menuTreeState.collapsed[pId];

        flatTreeRows.push({
          item: p,
          isParent: true,
          parentId: null,
          hasChildren: pChildren.length > 0,
          isCollapsed: isCollapsed
        });

        if (!isCollapsed) {
          pChildren.forEach(c => {
            flatTreeRows.push({
              item: c,
              isParent: false,
              parentId: pId,
              hasChildren: false,
              isCollapsed: false
            });
          });
        }
      });

      // Apply Pagination
      const totalItems = flatTreeRows.length;
      const pageSize = this.menuPagination.pageSize || 20;
      const totalPages = Math.ceil(totalItems / pageSize) || 1;
      
      if (this.menuPagination.page > totalPages) this.menuPagination.page = totalPages;
      if (this.menuPagination.page < 1) this.menuPagination.page = 1;

      const currentPage = this.menuPagination.page;
      const startIndex = (currentPage - 1) * pageSize;
      const pageItems = flatTreeRows.slice(startIndex, startIndex + pageSize);

      let html = '';
      const showEdit = this.hasPermission('MENU_UPDATE') ? '' : 'd-none';
      const showDelete = this.hasPermission('MENU_DELETE') ? '' : 'd-none';
      const showAddSub = this.hasPermission('MENU_CREATE') ? '' : 'd-none';

      pageItems.forEach(row => {
        const m = row.item;
        const mId = m.menu_id || m.id;
        const typeBadge = m.type === 'Internal Link' ? 'bg-info bg-opacity-10 text-info' : (m.type === 'Sub Menu' ? 'bg-secondary bg-opacity-10 text-secondary' : 'bg-primary bg-opacity-10 text-primary');
        const statusBadge = (m.status || 'ACTIVE').toUpperCase() === 'INACTIVE' ? 'badge-light-danger' : 'badge-light-success';

        if (row.isParent) {
          const toggleIconClass = row.hasChildren ? (row.isCollapsed ? 'bi-chevron-right text-muted' : 'bi-chevron-down text-primary') : 'bi-dot text-muted';
          html += `
            <tr class="align-middle fw-semibold cursor-pointer" onclick="AEF.showMenuDetail('${mId}')" style="background-color: #ffffff;">
              <td>
                <span class="tree-toggle-btn me-2" onclick="AEF.toggleSubTree(event, '${mId}')">
                  <i class="bi ${toggleIconClass} fs-7"></i>
                </span>
                <i class="bi ${m.icon || 'bi-folder'} me-2 text-primary"></i>
                <span class="text-dark fw-bold">${m.menu_name || m.name}</span>
                <span class="text-muted ms-2 fs-8 fw-normal">(${m.menu_code || m.code})</span>
              </td>
              <td><i class="bi ${m.icon || 'bi-circle'} me-1 text-muted"></i></td>
              <td><span class="badge ${typeBadge} border-0 px-2.5 py-1.5 fs-8">${m.type || 'Module'}</span></td>
              <td><span class="badge ${statusBadge} px-2.5 py-1.5 fs-8">${m.status || 'ACTIVE'}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-link text-primary p-0 me-2 text-decoration-none ${showEdit}" onclick="event.stopPropagation(); AEF.openEditMenuModal('${mId}')"><i class="bi bi-pencil me-1"></i>Edit</button>
                <button class="btn btn-sm btn-link text-danger p-0 me-2 text-decoration-none ${showDelete}" onclick="event.stopPropagation(); AEF.deleteMenu('${mId}')"><i class="bi bi-trash me-1"></i>Delete</button>
                <button class="btn btn-sm btn-link text-success p-0 text-decoration-none ${showAddSub}" onclick="event.stopPropagation(); AEF.openAddSubMenuModal('${mId}')"><i class="bi bi-plus-circle me-1"></i>Sub-Menu</button>
              </td>
            </tr>
          `;
        } else {
          html += `
            <tr class="align-middle cursor-pointer" onclick="AEF.showMenuDetail('${mId}')" style="background-color: #f8fafc;">
              <td class="ps-4">
                <span class="text-muted me-2" style="font-family: monospace;">├─</span>
                <i class="bi ${m.icon || 'bi-file-earmark'} me-2 text-muted"></i>
                <span class="text-dark fw-medium">${m.menu_name || m.name}</span>
                <span class="text-muted ms-2 fs-8">(${m.menu_code || m.code})</span>
              </td>
              <td><i class="bi ${m.icon || 'bi-circle'} me-1 text-muted"></i></td>
              <td><span class="badge ${typeBadge} border-0 px-2.5 py-1.5 fs-8">${m.type || 'Sub Menu'}</span></td>
              <td><span class="badge ${statusBadge} px-2.5 py-1.5 fs-8">${m.status || 'ACTIVE'}</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-link text-primary p-0 me-2 text-decoration-none ${showEdit}" onclick="event.stopPropagation(); AEF.openEditMenuModal('${mId}')"><i class="bi bi-pencil me-1"></i>Edit</button>
                <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none ${showDelete}" onclick="event.stopPropagation(); AEF.deleteMenu('${mId}')"><i class="bi bi-trash me-1"></i>Delete</button>
              </td>
            </tr>
          `;
        }
      });

      tbody.innerHTML = html;

      // Update Pagination UI Info & Controls
      if (infoElem) {
        const fromCount = startIndex + 1;
        const toCount = Math.min(startIndex + pageSize, totalItems);
        infoElem.innerText = `Showing ${fromCount} to ${toCount} of ${totalItems} entries`;
      }

      if (controlsElem) {
        let pagHtml = '';
        pagHtml += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${currentPage - 1});">Prev</a></li>`;
        
        for (let p = 1; p <= totalPages; p++) {
          pagHtml += `<li class="page-item ${p === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${p});">${p}</a></li>`;
        }

        pagHtml += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="event.preventDefault(); AEF.changeMenuPage(${currentPage + 1});">Next</a></li>`;
        controlsElem.innerHTML = pagHtml;
      }
    },

    changeMenuPage: function (page) {
      this.menuPagination.page = page;
      this.renderMenusTreeTable(this.menusCache);
    },

    changeMenuPageSize: function (size) {
      this.menuPagination.pageSize = size;
      this.menuPagination.page = 1;
      this.renderMenusTreeTable(this.menusCache);
    },

    showMenuDetail: function (menuId) {
      const menu = (this.menusCache || []).find(m => (m.menu_id === menuId || m.id === menuId));
      if (!menu) return;

      this.selectedMenuDetailId = menu.menu_id || menu.id;

      const parentMenu = (this.menusCache || []).find(m => (m.menu_id === menu.parent_id || m.id === menu.parent_id));
      const parentName = parentMenu ? (parentMenu.menu_name || parentMenu.name) : 'Top Level Module';

      document.getElementById('detail-empty-state').classList.add('d-none');
      document.getElementById('detail-content-state').classList.remove('d-none');

      document.getElementById('detail-menu-name').innerText = menu.menu_name || menu.name || '-';
      document.getElementById('detail-menu-code').innerText = menu.menu_code || menu.code || '-';
      document.getElementById('detail-menu-id').innerText = menu.menu_id || menu.id || '-';
      document.getElementById('detail-menu-parent-name').innerText = parentName;
      document.getElementById('detail-menu-route').innerText = menu.route || '-';
      document.getElementById('detail-menu-slug').innerText = menu.slug || '-';
      document.getElementById('detail-menu-icon-class').innerText = menu.icon || 'bi-circle';
      document.getElementById('detail-menu-sort').innerText = menu.sort_order !== undefined ? menu.sort_order : '1';
      document.getElementById('detail-menu-perm').innerText = menu.permission_code || 'DASHBOARD_VIEW';
      document.getElementById('detail-menu-desc').innerText = menu.description || 'Tidak ada deskripsi.';

      document.getElementById('detail-icon-preview').innerHTML = `<i class="bi ${menu.icon || 'bi-grid'}"></i>`;
      document.getElementById('detail-menu-type-badge').innerText = menu.type || 'Module';

      const statusBadge = document.getElementById('detail-menu-status-badge');
      if (statusBadge) {
        const isInactive = (menu.status || 'ACTIVE').toUpperCase() === 'INACTIVE';
        statusBadge.className = isInactive ? 'badge bg-danger-subtle text-danger border border-danger-subtle' : 'badge bg-success-subtle text-success border border-success-subtle';
        statusBadge.innerText = isInactive ? 'INACTIVE' : 'ACTIVE';
      }

      // Check permissions for Edit Menu and Sub-Menu in details panel
      const detailEditBtn = document.querySelector('[onclick="AEF.openEditFromDetail()"]');
      const detailSubBtn = document.querySelector('[onclick="AEF.openAddSubFromDetail()"]');
      
      if (detailEditBtn) {
        if (this.hasPermission('MENU_UPDATE')) {
          detailEditBtn.classList.remove('d-none');
        } else {
          detailEditBtn.classList.add('d-none');
        }
      }
      if (detailSubBtn) {
        if (this.hasPermission('MENU_CREATE')) {
          detailSubBtn.classList.remove('d-none');
        } else {
          detailSubBtn.classList.add('d-none');
        }
      }
    },

    openEditFromDetail: function () {
      if (this.selectedMenuDetailId) {
        this.openEditMenuModal(this.selectedMenuDetailId);
      }
    },

    openAddSubFromDetail: function () {
      if (this.selectedMenuDetailId) {
        this.openAddMenuModal(this.selectedMenuDetailId);
      }
    },

    openAddMenuModal: function (parentId) {
      const form = document.getElementById('form-add-menu');
      if (form) form.reset();

      this.populatePermissionDropdowns('', ['new-menu-perm']);
      this.populateParentMenuDropdowns('', ['new-menu-parent']);

      if (parentId) {
        const parentSelect = document.getElementById('new-menu-parent');
        if (parentSelect) parentSelect.value = parentId;

        const typeSelect = document.getElementById('new-menu-type');
        if (typeSelect) typeSelect.value = 'Sub Menu';
      }

      this.updateIconPreviewForModal('new');
      this.showModal('addMenuModal');
    },

    openAddSubMenuModal: function (parentId) {
      this.openAddMenuModal(parentId);
    },

    openEditMenuModal: function (menuId) {
      const menu = (this.menusCache || []).find(m => (m.menu_id === menuId || m.id === menuId));
      if (!menu) return;

      this.populatePermissionDropdowns(menu.permission_code || '', ['edit-menu-perm']);
      this.populateParentMenuDropdowns(menu.parent_id || '', ['edit-menu-parent']);

      document.getElementById('edit-menu-id').value = menu.menu_id || menu.id;
      document.getElementById('edit-menu-code').value = menu.menu_code || menu.code || '';
      document.getElementById('edit-menu-name').value = menu.menu_name || menu.name || '';
      document.getElementById('edit-menu-slug').value = menu.slug || '';
      document.getElementById('edit-menu-type').value = menu.type || 'Module';
      document.getElementById('edit-menu-route').value = menu.route || '';
      document.getElementById('edit-menu-icon').value = menu.icon || 'bi-circle';
      document.getElementById('edit-menu-sort').value = menu.sort_order !== undefined ? menu.sort_order : 1;
      document.getElementById('edit-menu-perm').value = menu.permission_code || 'DASHBOARD_VIEW';
      document.getElementById('edit-menu-status').value = (menu.status || 'ACTIVE').toUpperCase();
      document.getElementById('edit-menu-desc').value = menu.description || '';

      this.updateIconPreviewForModal('edit');
      this.showModal('editMenuModal');

    autoGenerateNewMenuSlug: function () {
      const name = document.getElementById('new-menu-name').value;
      const slugInput = document.getElementById('new-menu-slug');
      if (slugInput && name) {
        slugInput.value = name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');
      }
    },

    autoGenerateEditMenuSlug: function () {
      const name = document.getElementById('edit-menu-name').value;
      const slugInput = document.getElementById('edit-menu-slug');
      if (slugInput && name) {
        slugInput.value = name.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');
      }
    },

    updateIconPreviewForModal: function (prefix) {
      const input = document.getElementById(prefix + '-menu-icon');
      const preview = document.getElementById(prefix + '-menu-icon-preview');
      if (input && preview) {
        const iconVal = input.value || 'bi-circle';
        preview.innerHTML = `<i class="bi ${iconVal}"></i>`;

    createMenu: function () {
      const parentId = document.getElementById('new-menu-parent').value;
      const menuCode = document.getElementById('new-menu-code').value;
      const name = document.getElementById('new-menu-name').value;
      const slug = document.getElementById('new-menu-slug').value;
      const type = document.getElementById('new-menu-type').value;
      const route = document.getElementById('new-menu-route').value;
      const icon = document.getElementById('new-menu-icon').value;
      const sortOrder = document.getElementById('new-menu-sort').value;
      const permCode = document.getElementById('new-menu-perm').value;
      const status = document.getElementById('new-menu-status').value;
      const desc = document.getElementById('new-menu-desc').value;

      if (!name || !route || !menuCode) return alert('Kode Menu, Nama Menu, dan Route wajib diisi!');

      const payload = {
        parent_id: parentId,
        menu_code: menuCode,
        menu_name: name,
        slug: slug,
        type: type,
        route: route,
        icon: icon,
        sort_order: Number(sortOrder) || 1,
        permission_code: permCode,
        status: status,
        description: desc,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      };

      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('addMenuModal');
          this.loadMenusTable();
          this.loadSidebarMenu();
        } else alert('Gagal membuat menu: ' + res.message);
      }).apiCreateMenu(payload);
    },

    submitUpdateMenu: function () {
      const menuId = document.getElementById('edit-menu-id').value;
      const parentId = document.getElementById('edit-menu-parent').value;
      const menuCode = document.getElementById('edit-menu-code').value;
      const name = document.getElementById('edit-menu-name').value;
      const slug = document.getElementById('edit-menu-slug').value;
      const type = document.getElementById('edit-menu-type').value;
      const route = document.getElementById('edit-menu-route').value;
      const icon = document.getElementById('edit-menu-icon').value;
      const sortOrder = document.getElementById('edit-menu-sort').value;
      const permCode = document.getElementById('edit-menu-perm').value;
      const status = document.getElementById('edit-menu-status').value;
      const desc = document.getElementById('edit-menu-desc').value;

      if (!menuId || !name || !route || !menuCode) return alert('Menu ID, Kode Menu, Nama Menu, dan Route wajib diisi!');

      const payload = {
        menu_id: menuId,
        parent_id: parentId,
        menu_code: menuCode,
        menu_name: name,
        slug: slug,
        type: type,
        route: route,
        icon: icon,
        sort_order: Number(sortOrder) || 1,
        permission_code: permCode,
        status: status,
        description: desc,
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      };

      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.hideModal('editMenuModal');
          this.loadMenusTable();
          this.loadSidebarMenu();
          if (this.selectedMenuDetailId === menuId) {
            this.showMenuDetail(menuId);
          }
        } else alert('Gagal memperbarui menu: ' + res.message);
      }).apiUpdateMenu(payload);
    },

    filterMenuTree: function () {
      const query = (document.getElementById('menu-search-input').value || '').toLowerCase();
      if (!query) return this.renderMenusTreeTable(this.menusCache);

      const filtered = (this.menusCache || []).filter(m => 
        (m.menu_name || m.name || '').toLowerCase().includes(query) ||
        (m.menu_code || m.code || '').toLowerCase().includes(query) ||
        (m.route || '').toLowerCase().includes(query)
      );
      this.menuPagination.page = 1;
      this.renderMenusTreeTable(filtered);
    },

    filterMenuStatus: function (statusVal) {
      if (statusVal === 'ALL') return this.renderMenusTreeTable(this.menusCache);
      const filtered = (this.menusCache || []).filter(m => String(m.status || 'ACTIVE').toUpperCase() === statusVal);
      this.menuPagination.page = 1;
      this.renderMenusTreeTable(filtered);
    },

    filterMenuParent: function () {
      const filterVal = document.getElementById('menu-parent-filter').value;
      if (filterVal === 'ALL') return this.renderMenusTreeTable(this.menusCache);
      if (filterVal === 'TOP') {
        const filtered = (this.menusCache || []).filter(m => !m.parent_id);
        this.menuPagination.page = 1;
        return this.renderMenusTreeTable(filtered);
      }
    },

    deleteMenu: function (menuId) {
      if (!confirm('Hapus menu ini dari hierarki?')) return;
      google.script.run.withSuccessHandler((res) => {
        if (res.success) {
          this.loadMenusTable();
          this.loadSidebarMenu();
        } else alert('Gagal: ' + res.message);
      }).apiDeleteMenu({ menu_id: menuId, actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    },

      // Show loaders

      ['dash-count-menu', 'dash-count-role', 'dash-count-user', 'dash-count-perm', 'dash-count-audit'].forEach(id => {
        const el = document.getElementById(id);

      const recentList = document.getElementById('recent-activity-list');

      if (recentList) recentList.classList.add('d-none');

      google.script.run.withSuccessHandler((res) => {
        if (!res || !res.success || !res.data) return;

        const data = res.data;

        const hourlyTrend = data.hourlyActionTrend || {};
        const modules = data.auditByModule || {};

          if (data.renewalWarning) {

        if (cRole) cRole.innerText = counts.roles || 0;

        const cUser = document.getElementById('dash-count-user');
        if (cUser) cUser.innerText = counts.users || 0;

        const cPerm = document.getElementById('dash-count-perm');

            <div class="aef-metric-box"><div class="icon" style="background:#eff6ff; color:#2563eb;"><i class="bi bi-box-arrow-in-right"></i></div><div class="info"><div class="val">${actions.LOGIN || 0}</div><div class="lbl">LOGIN</div></div></div>

            <div class="aef-metric-box"><div class="icon" style="background:#ede9fe; color:#8b5cf6;"><i class="bi bi-plus-circle-fill"></i></div><div class="info"><div class="val">${actions.INSERT || 0}</div><div class="lbl">INSERT</div></div></div>

            <div class="aef-metric-box"><div class="icon" style="background:#fee2e2; color:#ef4444;"><i class="bi bi-trash-fill"></i></div><div class="info"><div class="val">${actions.DELETE || 0}</div><div class="lbl">DELETE</div></div></div>

    renderRecentActivitiesTop5: function () {

    // ─── SESSION IDLE TIMER ───────────────────────────────────────────

    startIdleTimer: function () {
      // Clear any existing timer
      if (this._idleIntervalId) clearInterval(this._idleIntervalId);
      if (this._idleWarningTimeout) clearTimeout(this._idleWarningTimeout);

      this.state.lastActivityAt = Date.now();

      // Listen to user activity events to reset idle clock
      const resetIdle = () => { this.state.lastActivityAt = Date.now(); };
      if (!this._idleListenersAttached) {
        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(ev => {
          document.addEventListener(ev, resetIdle, { passive: true });
        });
        this._idleListenersAttached = true;
      }

      // Tick every second
      this._idleIntervalId = setInterval(() => {
        const timeoutMs = (this.state.sessionTimeoutMinutes || 10) * 60 * 1000;
        const elapsed = Date.now() - (this.state.lastActivityAt || Date.now());
        const remainingMs = Math.max(0, timeoutMs - elapsed);

        // Update countdown UI
        this.updateSessionCountdown(remainingMs);

        // Auto-logout when time is up
        if (remainingMs <= 0) {
          clearInterval(this._idleIntervalId);
          this.idleLogout();
        }
      }, 1000);
    },

    updateSessionCountdown: function (remainingMs) {
      const timeoutMs = (this.state.sessionTimeoutMinutes || 10) * 60 * 1000;
      if (remainingMs === undefined) {
        const elapsed = Date.now() - (this.state.lastActivityAt || Date.now());
        remainingMs = Math.max(0, timeoutMs - elapsed);
      }

      const totalSec = Math.floor(remainingMs / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      const label = mins > 0
        ? `${mins} menit ${secs.toString().padStart(2, '0')} detik tersisa`
        : `${secs} detik tersisa`;

      const pillEl = document.getElementById('dash-session-countdown');
      if (pillEl) pillEl.innerText = label;

      const infoEl = document.getElementById('info-session-remaining');
      if (infoEl) infoEl.innerText = label;

      // Warning at 1 minute remaining
      if (totalSec <= 60 && totalSec > 0 && !this._idleWarnShown) {
        this._idleWarnShown = true;
        const toastHtml = `
          <div id="idle-warning-toast" style="position:fixed;bottom:2rem;right:2rem;z-index:9999;background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:1rem 1.5rem;box-shadow:0 4px 20px rgba(0,0,0,0.15);max-width:320px;">
            <div style="font-weight:700;color:#856404;margin-bottom:0.3rem;"><i class="bi bi-exclamation-triangle me-1"></i> Sesi Hampir Berakhir!</div>
            <div style="font-size:0.85rem;color:#664d03;">Sesi Anda akan otomatis berakhir dalam 1 menit karena tidak ada aktivitas. Gerakkan mouse atau tekan tombol apapun untuk memperbarui sesi.</div>
          </div>`;
        if (!document.getElementById('idle-warning-toast')) {
          document.body.insertAdjacentHTML('beforeend', toastHtml);
          setTimeout(() => { const t = document.getElementById('idle-warning-toast'); if (t) t.remove(); }, 30000);
        }
      } else if (totalSec > 60) {
        this._idleWarnShown = false;
        const t = document.getElementById('idle-warning-toast');
        if (t) t.remove();
      }
    },

    setSystemStatus: function (isActive) {
      const dot = document.getElementById('dash-system-status-dot');
      const text = document.getElementById('dash-system-status-text');
      if (dot) dot.style.color = isActive ? '#4ade80' : '#ef4444';
      if (text) text.innerText = isActive ? 'Sistem Aktif' : 'Sistem Off';
    },

    idleLogout: function () {
      // Stop timers
      if (this._idleIntervalId) clearInterval(this._idleIntervalId);
      // Update system status to off
      this.setSystemStatus(false);
      // Remove toast
      const t = document.getElementById('idle-warning-toast');
      if (t) t.remove();

      // Show notification
      const toastHtml = `
        <div id="idle-logout-toast" style="position:fixed;bottom:2rem;right:2rem;z-index:9999;background:#fee2e2;border:1px solid #ef4444;border-radius:12px;padding:1rem 1.5rem;box-shadow:0 4px 20px rgba(0,0,0,0.15);max-width:320px;">
          <div style="font-weight:700;color:#991b1b;margin-bottom:0.3rem;"><i class="bi bi-shield-x me-1"></i> Sesi Berakhir</div>
          <div style="font-size:0.85rem;color:#7f1d1d;">Anda telah logout otomatis karena tidak ada aktivitas selama ${this.state.sessionTimeoutMinutes || 10} menit.</div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', toastHtml);

      // Perform logout and redirect to login after 2 seconds
      setTimeout(() => {
        const authData = JSON.parse(localStorage.getItem('AEF_AUTH_DATA') || '{}');
        const token = authData.token;
        localStorage.removeItem('AEF_AUTH_DATA');
        this.state.user = null;
        this.state.session = null;
        this.state.permissions = [];
        if (token) {
          try {
            google.script.run.apiLogout({ token: token, actor_id: authData.user ? authData.user.id : 'SYSTEM' });
          } catch(e) {}
        }
        this.showLoginShell();
        const logoutToast = document.getElementById('idle-logout-toast');
        if (logoutToast) setTimeout(() => logoutToast.remove(), 4000);
      }, 2000);
    },

    applyProjectsFilter: function () {
      const state = this.paginationState.projects;
      const raw = state.rawData || [];

      const searchVal = (document.getElementById('projects-search')?.value || '').toLowerCase().trim();
      const statusFilter = document.getElementById('projects-status-filter')?.value || 'ALL';
      const priorityFilter = document.getElementById('projects-priority-filter')?.value || 'ALL';

      // Column filters
      const filterCode = (document.getElementById('projects-filter-code')?.value || '').toLowerCase().trim();
      const filterName = (document.getElementById('projects-filter-name')?.value || '').toLowerCase().trim();
      const filterPm = (document.getElementById('projects-filter-pm')?.value || '').toLowerCase().trim();
      const filterTimeline = (document.getElementById('projects-filter-timeline')?.value || '').toLowerCase().trim();
      const filterBudget = (document.getElementById('projects-filter-budget')?.value || '').toLowerCase().trim();
      const filterProgress = (document.getElementById('projects-filter-progress')?.value || '').toLowerCase().trim();
      const filterStatus = (document.getElementById('projects-filter-status')?.value || '').toLowerCase().trim();

      let filtered = raw.filter(p => {
        // Search text matching
        if (searchVal) {
          const matchSearch = String(p.project_code || '').toLowerCase().includes(searchVal) ||
            String(p.project_name || '').toLowerCase().includes(searchVal) ||
            String(p.client_name || '').toLowerCase().includes(searchVal) ||
            String(p.project_manager || '').toLowerCase().includes(searchVal);
          if (!matchSearch) return false;
        }

        // Status filter
        if (statusFilter !== 'ALL' && String(p.status || '').toUpperCase() !== statusFilter) {
          return false;
        }

        // Priority filter
        if (priorityFilter !== 'ALL' && String(p.priority || '').toUpperCase() !== priorityFilter) {
          return false;
        }

        // Column filters
        if (filterCode && !String(p.project_code || '').toLowerCase().includes(filterCode)) return false;
        if (filterName && !(String(p.project_name || '').toLowerCase().includes(filterName) || String(p.client_name || '').toLowerCase().includes(filterName))) return false;
        if (filterPm && !String(p.project_manager || '').toLowerCase().includes(filterPm)) return false;
        if (filterTimeline && !(String(p.start_date || '').toLowerCase().includes(filterTimeline) || String(p.end_date || '').toLowerCase().includes(filterTimeline))) return false;
        if (filterBudget && !String(p.budget || '').toLowerCase().includes(filterBudget)) return false;
        if (filterProgress && !String(p.progress || '').toLowerCase().includes(filterProgress)) return false;
        if (filterStatus && !String(p.status || '').toLowerCase().includes(filterStatus)) return false;

        return true;
      });

      // Sorting
      const col = state.sortCol || 'project_code';
      const asc = state.sortAsc !== false;
      filtered.sort((a, b) => {
        let valA = a[col] !== undefined ? a[col] : '';
        let valB = b[col] !== undefined ? b[col] : '';

        if (typeof valA === 'number' && typeof valB === 'number') {
          return asc ? valA - valB : valB - valA;
        }
        valA = String(valA).toLowerCase();
        valB = String(valB).toLowerCase();
        return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
      });

      state.data = filtered;
      state.page = 1;
      this.renderProjectsTablePagination();
    },

              <div class="rounded-circle d-flex align-items-center justify-content-center bg-light text-primary fw-bold" style="width: 28px; height: 28px; font-size: 0.75rem; border: 1px solid #e4e6ef;">
                ${pmInitial}

              </div>
              <span class="text-muted small fw-bold" style="font-size: 0.75rem;">${progress}%</span>

          if (btn) {

            btn.innerHTML = '<i class="bi bi-check2"></i> Simpan Perubahan';
          }
          alert('Terjadi kesalahan: ' + (err.message || err));
        })
        .apiUpdateProject(payload);
    },

    openDetailProjectModal: function (id) {
      const raw = this.paginationState.projects.rawData || [];
      const project = raw.find(p => p.id === id);
      if (!project) return;

      document.getElementById('detail-project-code').innerText = project.project_code || '-';
      document.getElementById('detail-project-name').innerText = project.project_name || '-';
      document.getElementById('detail-project-client').innerText = project.client_name || '-';
      document.getElementById('detail-project-pm').innerText = project.project_manager || 'Unassigned';
      document.getElementById('detail-project-timeline').innerText = `${project.start_date || '-'} s/d ${project.end_date || '-'}`;
      
      const formattedBudget = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(project.budget || 0);
      document.getElementById('detail-project-budget').innerText = formattedBudget;

      const progress = Number(project.progress || 0);
      document.getElementById('detail-project-progress-text').innerText = `${progress}%`;
      const progressBar = document.getElementById('detail-project-progress-bar');
      if (progressBar) {
        progressBar.style.width = `${progress}%`;
        progressBar.className = progress >= 100 ? 'progress-bar bg-success' : (progress <= 25 ? 'progress-bar bg-warning' : 'progress-bar bg-primary');
      }

      // Status badge
      const statusBadge = document.getElementById('detail-project-status-badge');
      const status = String(project.status || 'PLANNING').toUpperCase();
      if (statusBadge) {
        statusBadge.innerText = status;
        if (status === 'COMPLETED') statusBadge.className = 'badge badge-light-success';
        else if (status === 'IN_PROGRESS') statusBadge.className = 'badge badge-light-info';
        else if (status === 'ON_HOLD') statusBadge.className = 'badge badge-light-warning';
        else if (status === 'CANCELLED') statusBadge.className = 'badge badge-light-danger';
        else statusBadge.className = 'badge badge-light-primary';
      }

      // Priority badge
      const priorityBadge = document.getElementById('detail-project-priority-badge');
      const priority = String(project.priority || 'MEDIUM').toUpperCase();
      if (priorityBadge) {
        priorityBadge.innerText = priority;
        if (priority === 'CRITICAL') priorityBadge.className = 'badge badge-light-danger';
        else if (priority === 'HIGH') priorityBadge.className = 'badge badge-light-warning';
        else if (priority === 'LOW') priorityBadge.className = 'badge bg-light text-muted border';
        else priorityBadge.className = 'badge badge-light-primary';
      }

      document.getElementById('detail-project-description').innerText = project.description || 'Tidak ada deskripsi tambahan.';
      document.getElementById('detail-project-created').innerText = project.created_at ? project.created_at.split('T')[0] : '-';
      document.getElementById('detail-project-updated').innerText = project.updated_at ? project.updated_at.split('T')[0] : '-';

      const editBtn = document.getElementById('btn-detail-edit-action');
      if (editBtn) {
        editBtn.onclick = () => {
          this.hideModal('modal-detail-project');
          this.openEditProjectModal(project.id);
        };
      }

      this.showModal('modal-detail-project');
    },

    confirmDeleteProject: function (id, name) {
      if (!name && this.paginationState && this.paginationState.projects && Array.isArray(this.paginationState.projects.rawData)) {
        const found = this.paginationState.projects.rawData.find(p => p.id === id);
        if (found) name = found.project_name;
      }
      document.getElementById('delete-project-id').value = id;
      document.getElementById('delete-project-name-preview').innerText = name || 'proyek terpilih';
      this.showModal('modal-delete-project');
    },

    submitDeleteProject: function () {
      const id = document.getElementById('delete-project-id')?.value;
      if (!id) return;

      const btn = document.getElementById('btn-submit-delete-project');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Menghapus...';
      }

      google.script.run
        .withSuccessHandler((res) => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-trash me-1"></i> Ya, Hapus Proyek';
          }
          if (res && res.success) {
            this.hideModal('modal-delete-project');
            this.showToast(res.message || 'Proyek berhasil dihapus!', 'success');
            this.loadProjectsTable();
          } else {
            alert(res.message || 'Gagal menghapus proyek.');
          }
        })
        .withFailureHandler((err) => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-trash me-1"></i> Ya, Hapus Proyek';
          }
          alert('Terjadi kesalahan: ' + (err.message || err));
        })
        .apiDeleteProject({ id: id, actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
    }

    },

    // ==========================================
    // CLIENT MANAGEMENT LOGIC
    // ==========================================
    loadClientsTable: function (forceRefresh = false) {
      if (forceRefresh) this.paginationState.clients.rawData = null;
      
      const tbody = document.getElementById('clients-table-body');
      if (tbody && !this.paginationState.clients.rawData) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div> Memuat data pelanggan...</td></tr>';
      }

      if (this.paginationState.clients.rawData && !forceRefresh) {
        this.renderClientsTablePagination();
        return;
      }

      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success) {
            let data = res.data || [];
            this.paginationState.clients.rawData = data;
            this.renderClientsTablePagination();
          } else {
            if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">${res.message || 'Gagal memuat data pelanggan'}</td></tr>`;
          }
        })
        .withFailureHandler((err) => {
          if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Terjadi kesalahan: ${err.message || err}</td></tr>`;
        })
        .apiGetClients();
    },

    renderClientsTablePagination: function () {
      const state = this.paginationState.clients;
      const tbody = document.getElementById('clients-table-body');
      const info = document.getElementById('clients-pagination-info');
      const controls = document.getElementById('clients-pagination-controls');

      if (!tbody || !info || !controls) return;

      let filteredData = state.rawData || [];

      // Global Search
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        filteredData = filteredData.filter(c => 
          (c.client_code && c.client_code.toLowerCase().includes(q)) ||
          (c.client_name && c.client_name.toLowerCase().includes(q)) ||
          (c.contact_person && c.contact_person.toLowerCase().includes(q)) ||
          (c.email && c.email.toLowerCase().includes(q))
        );
      }

      // Status Filter
      if (state.statusFilter && state.statusFilter !== 'ALL') {
        filteredData = filteredData.filter(c => c.status === state.statusFilter);
      }

      // Column Filters
      if (state.columnFilters) {
        Object.keys(state.columnFilters).forEach(key => {
          const val = state.columnFilters[key].toLowerCase();
          if (val) {
            filteredData = filteredData.filter(c => {
              if (key === 'code') return (c.client_code || '').toLowerCase().includes(val);
              if (key === 'name') return (c.client_name || '').toLowerCase().includes(val);
              if (key === 'contact') return (c.contact_person || '').toLowerCase().includes(val);
              if (key === 'contactinfo') return (c.email || '').toLowerCase().includes(val) || (c.phone || '').toLowerCase().includes(val);
              if (key === 'status') return (c.status || '').toLowerCase().includes(val);
              return true;
            });
          }
        });
      }

      // Sorting
      if (state.sortCol) {
        filteredData.sort((a, b) => {
          let valA = a[state.sortCol] || '';
          let valB = b[state.sortCol] || '';
          if (typeof valA === 'string') valA = valA.toLowerCase();
          if (typeof valB === 'string') valB = valB.toLowerCase();
          if (valA < valB) return state.sortAsc ? -1 : 1;
          if (valA > valB) return state.sortAsc ? 1 : -1;
          return 0;
        });
      }

      const totalItems = filteredData.length;
      const totalPages = Math.ceil(totalItems / state.pageSize) || 1;
      if (state.page > totalPages) state.page = totalPages;

      const startIndex = (state.page - 1) * state.pageSize;
      const endIndex = Math.min(startIndex + state.pageSize, totalItems);
      const pageData = filteredData.slice(startIndex, endIndex);

      info.innerHTML = `Menampilkan ${totalItems === 0 ? 0 : startIndex + 1} s/d ${endIndex} dari total ${totalItems} data`;

      if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted">Tidak ada data pelanggan ditemukan.</td></tr>';
      } else {
        tbody.innerHTML = pageData.map(c => {
          const statusBadge = c.status === 'ACTIVE' 
            ? '<span class="badge badge-light-success">Aktif</span>' 
            : '<span class="badge badge-light-danger">Nonaktif</span>';
          
          let contactInfo = '';
          if (c.phone) contactInfo += `<div><i class="bi bi-telephone text-muted me-1"></i> ${c.phone}</div>`;
          if (c.email) contactInfo += `<div><i class="bi bi-envelope text-muted me-1"></i> ${c.email}</div>`;

          return `
            <tr class="aef-table-row">
              <td class="fw-medium text-dark">${c.client_code || '-'}</td>
              <td>
                <div class="fw-bold text-dark">${c.client_name || '-'}</div>
              </td>
              <td>${c.contact_person || '-'}</td>
              <td>${contactInfo || '-'}</td>
              <td>${statusBadge}</td>
              <td class="text-center">
                <div class="dropdown">
                  <button class="btn btn-sm btn-light btn-icon rounded" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-three-dots text-muted"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end shadow-sm border-light-subtle" style="font-size: 0.85rem; border-radius: 0.5rem; z-index: 1050;">
                    <li><a class="dropdown-item py-2" href="#" onclick="event.preventDefault(); AEF.openEditClientModal('${c.id}')"><i class="bi bi-pencil me-2 text-primary"></i> Edit Data</a></li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li><a class="dropdown-item py-2 text-danger" href="#" onclick="event.preventDefault(); AEF.confirmDeleteClient('${c.id}')"><i class="bi bi-trash me-2"></i> Hapus</a></li>
                  </ul>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      this.renderPaginationControls(state.page, totalPages, 'clients', (newPage) => {
        this.paginationState.clients.page = newPage;
        this.renderClientsTablePagination();
      });
    },

    handleClientsSearch: function (query) {
      this.paginationState.clients.searchQuery = query;
      this.paginationState.clients.page = 1;
      this.renderClientsTablePagination();
    },

    handleClientsStatusFilter: function (status) {
      this.paginationState.clients.statusFilter = status;
      this.paginationState.clients.page = 1;
      this.renderClientsTablePagination();
    },

    toggleClientsFilterRow: function () {
      const row = document.getElementById('clients-filter-row');
      if (row) row.classList.toggle('d-none');
    },

    handleClientsColumnFilter: function () {
      this.paginationState.clients.columnFilters = {
        code: document.getElementById('clients-filter-code')?.value || '',
        name: document.getElementById('clients-filter-name')?.value || '',
        contact: document.getElementById('clients-filter-contact')?.value || '',
        contactinfo: document.getElementById('clients-filter-contactinfo')?.value || '',
        status: document.getElementById('clients-filter-status')?.value || ''
      };
      this.paginationState.clients.page = 1;
      this.renderClientsTablePagination();
    },

    handleClientsSort: function (col) {
      const state = this.paginationState.clients;
      if (state.sortCol === col) {
        state.sortAsc = !state.sortAsc;
      } else {
        state.sortCol = col;
        state.sortAsc = true;
      }
      document.querySelectorAll('[id^="clients-sort-icon-"]').forEach(el => {
        el.className = 'bi bi-arrow-down-up ms-1 text-muted opacity-50';
      });
      const icon = document.getElementById(`clients-sort-icon-${col}`);
      if (icon) {
        icon.className = state.sortAsc ? 'bi bi-arrow-up ms-1 text-primary' : 'bi bi-arrow-down ms-1 text-primary';
      }
      this.renderClientsTablePagination();
    },

    handleClientsPageSizeChange: function (size) {
      this.paginationState.clients.pageSize = Number(size) || 20;
      this.renderClientsTablePagination();
    },

    openAddClientModal: function () {
      const form = document.getElementById('form-client');
      if (form) form.reset();
      document.getElementById('client-id').value = '';
      document.getElementById('modal-client-title').innerText = 'Tambah Pelanggan Baru';
      this.showModal('modal-client');
    },

    openEditClientModal: function (id) {
      const raw = this.paginationState.clients.rawData || [];
      const client = raw.find(c => c.id === id);
      if (!client) return;

      document.getElementById('client-id').value = client.id;
      document.getElementById('client-code').value = client.client_code || '';
      document.getElementById('client-name').value = client.client_name || '';
      document.getElementById('client-pic').value = client.contact_person || '';
      document.getElementById('client-phone').value = client.phone || '';
      document.getElementById('client-email').value = client.email || '';
      document.getElementById('client-address').value = client.address || '';
      document.getElementById('client-description').value = client.description || '';
      document.getElementById('client-status').value = client.status || 'ACTIVE';
      
      document.getElementById('modal-client-title').innerText = 'Edit Data Pelanggan';
      this.showModal('modal-client');
    },

    submitClientForm: function () {
      const btn = document.getElementById('btn-save-client');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Menyimpan...';
      }

      const id = document.getElementById('client-id')?.value;
      const payload = {
        client_code: document.getElementById('client-code')?.value || '',
        client_name: document.getElementById('client-name')?.value || '',
        contact_person: document.getElementById('client-pic')?.value || '',
        phone: document.getElementById('client-phone')?.value || '',
        email: document.getElementById('client-email')?.value || '',
        address: document.getElementById('client-address')?.value || '',
        description: document.getElementById('client-description')?.value || '',
        status: document.getElementById('client-status')?.value || 'ACTIVE',
        actor_id: this.state.user ? this.state.user.id : 'SYSTEM'
      };

      if (id) {
        payload.id = id;
        google.script.run
          .withSuccessHandler((res) => {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-save me-1"></i> Simpan Data'; }
            if (res && res.success) {
              this.hideModal('modal-client');
              this.showToast(res.message || 'Perubahan berhasil disimpan!', 'success');
              this.loadClientsTable(true);
            } else {
              alert(res.message || 'Gagal mengubah data pelanggan.');
            }
          })
          .withFailureHandler((err) => {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-save me-1"></i> Simpan Data'; }
            alert('Terjadi kesalahan: ' + (err.message || err));
          })
          .apiUpdateClient(payload);
      } else {
        google.script.run
          .withSuccessHandler((res) => {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-save me-1"></i> Simpan Data'; }
            if (res && res.success) {
              this.hideModal('modal-client');
              this.showToast(res.message || 'Pelanggan baru berhasil ditambahkan!', 'success');
              this.loadClientsTable(true);
            } else {
              alert(res.message || 'Gagal menyimpan data pelanggan.');
            }
          })
          .withFailureHandler((err) => {
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-save me-1"></i> Simpan Data'; }
            alert('Terjadi kesalahan: ' + (err.message || err));
          })
          .apiCreateClient(payload);
      }
    },

    confirmDeleteClient: function (id) {
      if (confirm('Apakah Anda yakin ingin menghapus data pelanggan ini? Tindakan ini tidak dapat dibatalkan.')) {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success) {
              this.showToast('Data pelanggan berhasil dihapus', 'success');
              this.loadClientsTable(true);
            } else {
              alert(res.message || 'Gagal menghapus data.');
            }
          })
          .withFailureHandler((err) => {
            alert('Terjadi kesalahan: ' + (err.message || err));
          })
          .apiDeleteClient({ id: id, actor_id: this.state.user ? this.state.user.id : 'SYSTEM' });
      }
    },

    populateClientDropdown: function (elementId, selectedId = '') {
      const select = document.getElementById(elementId);
      if (!select) return;

      if (!this.paginationState.clients.rawData) {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success) {
              this.paginationState.clients.rawData = res.data;
              this._renderClientOptions(select, res.data, selectedId);
            }
          })
          .apiGetClients();
      } else {
        this._renderClientOptions(select, this.paginationState.clients.rawData, selectedId);
      }
    },

    _renderClientOptions: function (select, clients, selectedId) {
      select.innerHTML = '<option value="">-- Pilih Klien / Instansi --</option>';
      const activeClients = clients.filter(c => c.status === 'ACTIVE');
      activeClients.forEach(c => {
        const option = document.createElement('option');
        option.value = c.id;
        option.textContent = c.client_name;
        if (c.id === selectedId) option.selected = true;
        select.appendChild(option);
      });
    }

  }; // end AEF object

  document.addEventListener('DOMContentLoaded', () => {
    AEF.init();
    
    // Close profile dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const dropdown = document.querySelector('.dropdown-menu[aria-labelledby="profileDropdown"]');
      if (dropdown && !dropdown.contains(e.target) && !e.target.closest('#profileDropdown')) {
        dropdown.classList.remove('show');
      }
    });
  });
</script>
