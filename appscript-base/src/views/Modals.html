<!-- AEF ALL MODAL DIALOGS -->

<!-- 1. Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-white border-0 shadow-lg" style="border-radius: 0.75rem;">
      <div class="modal-header border-light py-3 px-4">
        <h5 class="modal-title fw-bold" style="color: #181c32;"><i class="bi bi-person-plus text-primary me-2"></i>Tambah User Baru</h5>
        <button type="button" class="btn-close" onclick="AEF.hideModal('addUserModal')" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="form-add-user" onsubmit="event.preventDefault(); AEF.createUser();">
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Nama Lengkap</label>
            <input type="text" id="new-user-name" class="form-control" placeholder="Contoh: Budi Santoso" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Email Address</label>
            <input type="email" id="new-user-email" class="form-control" placeholder="user@aef.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Password</label>
            <input type="password" id="new-user-password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Role</label>
            <select id="new-user-role" class="form-select">
              <option value="ROLE_USER">Standard User (ROLE_USER)</option>
              <option value="ROLE_ADMIN">System Administrator (ROLE_ADMIN)</option>
            </select>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4 pt-2">
            <button type="button" class="btn btn-light text-muted" onclick="AEF.hideModal('addUserModal')">Batal</button>
            <button type="submit" class="btn btn-aef-primary">Simpan User</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 2. Edit User Modal -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-white border-0 shadow-lg" style="border-radius: 0.75rem;">
      <div class="modal-header border-light py-3 px-4">
        <h5 class="modal-title fw-bold" style="color: #181c32;"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Data User</h5>
        <button type="button" class="btn-close" onclick="AEF.hideModal('editUserModal')" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="form-edit-user" onsubmit="event.preventDefault(); AEF.submitUpdateUser();">
          <input type="hidden" id="edit-user-id">
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Nama Lengkap</label>
            <input type="text" id="edit-user-name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Email Address</label>
            <input type="email" id="edit-user-email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Password Baru (Opsional)</label>
            <input type="password" id="edit-user-password" class="form-control" placeholder="Kosongkan jika tidak ingin diubah">
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Role</label>
            <select id="edit-user-role" class="form-select">
              <option value="ROLE_USER">Standard User (ROLE_USER)</option>
              <option value="ROLE_ADMIN">System Administrator (ROLE_ADMIN)</option>
            </select>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4 pt-2">
            <button type="button" class="btn btn-light text-muted" onclick="AEF.hideModal('editUserModal')">Batal</button>
            <button type="submit" class="btn btn-aef-primary">Perbarui User</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 3. Add Role Modal -->
<div class="modal fade" id="addRoleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-white border-0 shadow-lg" style="border-radius: 0.75rem;">
      <div class="modal-header border-light py-3 px-4">
        <h5 class="modal-title fw-bold" style="color: #181c32;"><i class="bi bi-shield-plus text-primary me-2"></i>Tambah Role Baru</h5>
        <button type="button" class="btn-close" onclick="AEF.hideModal('addRoleModal')" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="form-add-role" onsubmit="event.preventDefault(); AEF.createRole();">
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Role Code (e.g. ROLE_MANAGER)</label>
            <input type="text" id="new-role-code" class="form-control" placeholder="ROLE_MANAGER" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Nama Role</label>
            <input type="text" id="new-role-name" class="form-control" placeholder="Manager Operasional" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Deskripsi</label>
            <textarea id="new-role-desc" class="form-control" rows="2"></textarea>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4 pt-2">
            <button type="button" class="btn btn-light text-muted" onclick="AEF.hideModal('addRoleModal')">Batal</button>
            <button type="submit" class="btn btn-aef-primary">Simpan Role</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 4. Add Permission Modal -->
<div class="modal fade" id="addPermModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-white border-0 shadow-lg" style="border-radius: 0.75rem;">
      <div class="modal-header border-light py-3 px-4">
        <h5 class="modal-title fw-bold" style="color: #181c32;"><i class="bi bi-key-fill text-primary me-2"></i>Tambah Permission</h5>
        <button type="button" class="btn-close" onclick="AEF.hideModal('addPermModal')" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="form-add-perm" onsubmit="event.preventDefault(); AEF.createPermission();">
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Target Role ID</label>
            <input type="text" id="new-perm-role" class="form-control" placeholder="ROLE_USER" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Permission Code (e.g. REPORT_VIEW)</label>
            <input type="text" id="new-perm-code" class="form-control" placeholder="REPORT_VIEW" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Nama Label</label>
            <input type="text" id="new-perm-name" class="form-control" placeholder="Lihat Laporan" required>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4 pt-2">
            <button type="button" class="btn btn-light text-muted" onclick="AEF.hideModal('addPermModal')">Batal</button>
            <button type="submit" class="btn btn-aef-primary">Simpan Permission</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 5. Edit Config Modal -->
<div class="modal fade" id="editConfigModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-white border-0 shadow-lg" style="border-radius: 0.75rem;">
      <div class="modal-header border-light py-3 px-4">
        <h5 class="modal-title fw-bold" style="color: #181c32;"><i class="bi bi-gear-fill text-primary me-2"></i>Edit Konfigurasi System</h5>
        <button type="button" class="btn-close" onclick="AEF.hideModal('editConfigModal')" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="form-edit-config" onsubmit="event.preventDefault(); AEF.submitUpdateConfig();">
          <input type="hidden" id="edit-config-id">
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Config Key</label>
            <input type="text" id="edit-config-key" class="form-control" readonly style="background-color: #e9ecef;">
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Config Value</label>
            <input type="text" id="edit-config-value" class="form-control" required>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4 pt-2">
            <button type="button" class="btn btn-light text-muted" onclick="AEF.hideModal('editConfigModal')">Batal</button>
            <button type="submit" class="btn btn-aef-primary">Perbarui Konfigurasi</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
