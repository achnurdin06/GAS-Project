<!-- AEF ALL MODAL DIALOGS WITH DYNAMIC RELATIONAL SELECT DROPDOWNS -->

<!-- 1. Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-white border-0 shadow-lg" style="border-radius: 0.75rem;">
      <div class="modal-header border-light py-3 px-4">
        <h5 class="modal-title fw-bold" style="color: #181c32;"><i class="bi bi-person-plus text-primary me-2"></i>Tambah User Baru</h5>
        <button type="button" class="btn-close" onclick="AEF.hideModal('addUserModal')" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="form-add-user" onsubmit="event.preventDefault(); AEF.createUser();">
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Nama Lengkap</label>
            <input type="text" id="new-user-name" class="form-control" placeholder="Contoh: Budi Santoso" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Email Address</label>
            <input type="email" id="new-user-email" class="form-control" placeholder="user@aef.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Password</label>
            <input type="password" id="new-user-password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-semibold">Role (Relasi mst_role)</label>
            <select id="new-user-role" class="form-select" required>
              <option value="">-- Pilih Role --</option>
            </select>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4 pt-2">
            <button type="button" class="btn btn-light text-muted" onclick="AEF.hideModal('addUserModal')">Batal</button>
            <button type="submit" class="btn btn-aef-primary">Simpan User</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 6. Add Menu Modal -->
<div class="modal fade" id="addMenuModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-white border-0 shadow-lg" style="border-radius: 0.75rem;">
      <div class="modal-header border-light py-3 px-4">
        <h5 class="modal-title fw-bold" style="color: #181c32;"><i class="bi bi-menu-button-wide-fill text-primary me-2"></i>Tambah Menu Baru</h5>
        <button type="button" class="btn-close" onclick="AEF.hideModal('addMenuModal')" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="form-add-menu" onsubmit="event.preventDefault(); AEF.createMenu();">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Parent Menu (Relasi mst_menu)</label>
              <select id="new-menu-parent" class="form-select form-select-sm">
                <option value="">-- Main Top-Level Menu --</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Kode Menu (e.g. MENU_REPORTS)</label>
              <input type="text" id="new-menu-code" class="form-control form-control-sm" placeholder="MENU_REPORTS" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Nama Menu</label>
              <input type="text" id="new-menu-name" class="form-control form-control-sm" placeholder="Laporan & Analitik" required oninput="AEF.autoGenerateNewMenuSlug()">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Slug (e.g. reports)</label>
              <input type="text" id="new-menu-slug" class="form-control form-control-sm" placeholder="reports">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Type</label>
              <select id="new-menu-type" class="form-select form-select-sm">
                <option value="Module">Module</option>
                <option value="Internal Link">Internal Link</option>
                <option value="External Link">External Link</option>
                <option value="Sub Menu">Sub Menu</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Target Route / URL (e.g. /reports)</label>
              <input type="text" id="new-menu-route" class="form-control form-control-sm" placeholder="/reports" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Icon Class (Bootstrap Icon)</label>
              <div class="input-group input-group-sm">
                <span class="input-group-text bg-light text-primary" id="new-menu-icon-preview"><i class="bi bi-circle"></i></span>
                <input type="text" id="new-menu-icon" class="form-control ps-2" placeholder="bi-file-earmark-text" value="bi-circle" oninput="AEF.updateIconPreviewForModal('new')">
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Sort Order</label>
              <input type="number" id="new-menu-sort" class="form-control form-control-sm" value="1">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Permission Code (Relasi mst_permission)</label>
              <select id="new-menu-perm" class="form-select form-select-sm">
                <option value="DASHBOARD_VIEW">DASHBOARD_VIEW</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Status</label>
              <select id="new-menu-status" class="form-select form-select-sm">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label text-muted small fw-semibold">Deskripsi Singkat</label>
              <textarea id="new-menu-desc" class="form-control form-control-sm" rows="2" placeholder="Penjelasan singkat modul menu..."></textarea>
            </div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top border-light">
            <button type="button" class="btn btn-light text-muted btn-sm" onclick="AEF.hideModal('addMenuModal')">Batal</button>
            <button type="submit" class="btn btn-aef-primary btn-sm"><i class="bi bi-check-lg me-1"></i>Simpan Menu</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
