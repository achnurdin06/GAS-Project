<template id="tpl-permissions">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1" style="color: #181c32;">Permission Control</h3>
      <p class="text-muted small mb-0">Atur pemetaan izin fitur (permission_code) terhadap role ID.</p>
    </div>
    <button id="btn-add-perm-trigger" class="btn btn-aef-primary" onclick="AEF.showModal('addPermModal')">
      <i class="bi bi-key-fill me-1"></i> Tambah Permission
    </button>
  </div>

  <div class="aef-card">
    <div class="table-responsive">
      <table class="table table-aef align-middle mb-0">
        <thead>
          <tr>
            <th>Role ID</th>
            <th>Permission Code</th>
            <th>Nama Permission</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="perms-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light-subtle">
      <div class="text-muted small" id="perms-pagination-info">Memuat entri...</div>
      <ul class="pagination pagination-sm mb-0" id="perms-pagination-controls"></ul>
    </div>
  </div>
</template>
