<template id="tpl-permissions">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1" style="color: #181c32;">Permission Control</h3>
      <p class="text-muted small mb-0">Atur pemetaan izin fitur (permission_code) terhadap role ID.</p>
    </div>
    <button id="btn-add-perm-trigger" class="btn btn-aef-primary" onclick="AEF.openAddPermissionModal()">
      <i class="bi bi-key-fill me-1"></i> Tambah Permission Baru
    </button>
  </div>

  <div class="aef-card border-0 shadow-sm p-4">
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
      <h5 class="fw-bold mb-0 text-dark" style="color: #3f4254;">
        <i class="bi bi-shield-check text-primary me-2"></i>Matrix Otorisasi Hak Akses Sistem
      </h5>
      <div class="d-flex gap-2">
        <button id="btn-edit-perm-matrix" class="btn btn-sm btn-light-primary text-primary" onclick="AEF.enablePermMatrixEdit()">
          <i class="bi bi-pencil me-1"></i>Edit
        </button>
        <button id="btn-save-perm-matrix" class="btn btn-sm btn-success d-none" onclick="AEF.savePermMatrix()">
          <i class="bi bi-check2-circle me-1"></i>Simpan
        </button>
        <button id="btn-cancel-perm-matrix" class="btn btn-sm btn-light text-muted d-none" onclick="AEF.cancelPermMatrixEdit()">
          <i class="bi bi-x-circle me-1"></i>Batal
        </button>
      </div>
    </div>

    <div class="table-responsive w-100">
      <table class="table table-aef align-middle mb-0">
        <thead>
          <tr class="text-muted fw-bold fs-7 text-uppercase gs-0">
            <th style="min-width: 200px;">Permission Code</th>
            <th style="min-width: 180px;">Name Permission</th>
            <th class="text-center" style="width: 100px;">Status</th>
            <th class="text-center" style="width: 100px;">Select All</th>
            <th class="text-center" style="width: 100px;">Create (C)</th>
            <th class="text-center" style="width: 100px;">Read (R)</th>
            <th class="text-center" style="width: 100px;">Update (U)</th>
            <th class="text-center" style="width: 100px;">Delete (D)</th>
            <th class="text-center" style="width: 120px;">Export/Import (E)</th>
            <th class="text-center" style="width: 80px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="perms-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div id="perms-pagination-container" class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light-subtle">
      <div class="d-flex align-items-center gap-2">
        <select id="perm-page-size" class="form-select form-select-sm" onchange="AEF.handleMatrixPageSizeChange(this.value)" style="width: 70px;">
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <div class="text-muted small" id="perms-pagination-info">Memuat entri...</div>
      </div>
      <ul class="pagination pagination-sm mb-0" id="perms-pagination-controls"></ul>
    </div>
  </div>
</template>
