<div id="aef-login-shell" class="min-vh-100 d-flex align-items-center justify-content-center bg-dark">
  <div class="aef-card text-center" style="max-width: 420px; width: 100%;">
    <div class="mb-4">
      <div class="aef-brand justify-content-center fs-3 mb-2">
        <i class="bi bi-layers-fill"></i> AEF Framework
      </div>
      <p class="text-muted small">AppScript Enterprise Framework Authentication</p>
    </div>

    <div id="login-error-alert" class="alert alert-danger d-none text-start small mb-3"></div>

    <form onsubmit="event.preventDefault(); AEF.login(document.getElementById('login-email').value, document.getElementById('login-password').value);">
      <div class="text-start mb-3">
        <label class="form-label text-muted small">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" id="login-email" class="form-control bg-dark text-white border-secondary" placeholder="admin@aef.com" required value="admin@aef.com">
        </div>
      </div>

      <div class="text-start mb-4">
        <label class="form-label text-muted small">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" id="login-password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required value="admin123">
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="btn btn-aef-primary w-100 py-2">
        Sign In
      </button>
    </form>

    <div class="mt-4 pt-3 border-top border-secondary text-muted small">
      Default Demo: <code>admin@aef.com</code> / <code>admin123</code>
    </div>
  </div>
</div>
