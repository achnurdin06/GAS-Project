<template id="tpl-config">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1" style="color: #181c32;">System Configuration</h3>
      <p class="text-muted small mb-0">Kelola parameter variabel global sistem secara dinamis.</p>
    </div>
  </div>

  <div class="aef-card">
    <div class="table-responsive">
      <table class="table table-aef align-middle mb-0">
        <thead>
          <tr>
            <th>Config Key</th>
            <th>Value</th>
            <th>Deskripsi</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="configs-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light-subtle">
      <div class="text-muted small" id="configs-pagination-info">Memuat entri...</div>
      <ul class="pagination pagination-sm mb-0" id="configs-pagination-controls"></ul>
    </div>
  </div>
</template>
